# Service-directory Nixpacks deployments can use this file explicitly.
# Keep this aligned with the repository-root nixpacks.toml.
[phases.setup]
nixPkgs = ["nodejs_22", "pnpm"]

[phases.install]
cmds = ["corepack enable", "pnpm install --frozen-lockfile --filter dvt-api..."]

[phases.build]
cmds = ["pnpm --filter dvt-api build"]

[start]
cmd = "pnpm --filter dvt-api start"
