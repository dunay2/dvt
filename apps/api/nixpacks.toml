# Railway uses Nixpacks by default for Node projects.
# Build this service from the repository root so workspace dependencies resolve.
[phases.setup]
nixPkgs = ["nodejs_22", "pnpm"]

[phases.install]
cmds = ["corepack enable", "pnpm install --frozen-lockfile --filter dvt-api..."]

[phases.build]
cmds = ["pnpm --filter dvt-api build"]

[start]
cmd = "pnpm --filter dvt-api start"
