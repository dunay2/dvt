<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Raven</title>
    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/raven-plan.jpg" />
    <link rel="manifest" href="/favicon/site.webmanifest" />
    <style>
      #app-loading-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(circle at 12% 18%, rgba(255, 122, 24, 0.18), transparent 18%),
          radial-gradient(circle at 78% 16%, rgba(62, 166, 255, 0.15), transparent 20%),
          radial-gradient(circle at 48% 112%, rgba(56, 189, 248, 0.12), transparent 22%),
          linear-gradient(180deg, #040712 0%, #050816 100%);
      }
      #app-loading-screen img {
        width: min(72vw, 520px);
        max-height: 72vh;
        object-fit: contain;
        border-radius: 12px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      }
    </style>
  </head>

  <body>
    <div id="app-loading-screen" aria-label="Loading screen">
      <img src="/favicon/raven-plan.jpg" alt="Raven plan loading screen" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
