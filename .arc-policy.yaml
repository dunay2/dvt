version: 1

triggers:
  - name: contracts
    guides: ['api-design']
    globs:
      - 'specs/contracts/**'
      - 'packages/@dvt/contracts/**'
    min_arc_level: ARC-2
    require:
      evidence_doc: true
      risk_update: true

  - name: engine-core
    guides: ['event-driven', 'observability', 'append-authority', 'determinism-replay']
    globs:
      - 'packages/@dvt/engine/**'
    min_arc_level: ARC-2
    require:
      evidence_doc: true
      risk_update: true

  - name: planner-core
    guides: ['observability', 'determinism-replay']
    globs:
      - 'packages/@dvt/planner/**'
    min_arc_level: ARC-2
    require:
      evidence_doc: true
      risk_update: true

  - name: state-core
    guides: ['event-driven', 'observability', 'append-authority', 'determinism-replay']
    globs:
      - 'packages/@dvt/state/**'
    min_arc_level: ARC-2
    require:
      evidence_doc: true
      risk_update: true

  - name: security
    guides: ['security-advanced', 'sbom-supplychain', 'lineage-openlineage-marquez']
    globs:
      - 'security/**'
      - 'docs/security/**'
    min_arc_level: ARC-3
    require:
      evidence_doc: true
      risk_update: true
      rollout_notes: true
      compat_matrix: true

  - name: adapters
    guides: ['adapter-semantics', 'determinism-replay']
    globs:
      - 'packages/@dvt/adapter-*/**'
    min_arc_level: ARC-2
    require:
      evidence_doc: true
      risk_update: true

checks:
  ARC-0: ['lint', 'test']
  ARC-1: ['lint', 'test']
  ARC-2: ['lint', 'test', 'schema-validate', 'contract-golden']
  ARC-3: ['lint', 'test', 'schema-validate', 'contract-golden', 'security-scan', 'compat-matrix']

artifacts:
  evidence_dir: 'docs/evidence'
  risk_dir: 'docs/risk-register'

validation:
  evidence_doc:
    required_front_matter_keys:
      - 'title'
      - 'status'
      - 'date'
      - 'owners'
      - 'arc_level'
      - 'breaking'
      - 'code_refs'
      - 'evidence'
    require_evidence_tests_for_levels: ['ARC-2', 'ARC-3']
