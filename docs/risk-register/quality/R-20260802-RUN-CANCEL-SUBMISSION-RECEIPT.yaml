---
id: R-20260802-RUN-CANCEL-SUBMISSION-RECEIPT
title: Concurrent cancel deliveries could dispatch duplicate provider commands
status: Closed
date: 2026-08-02
owners:
  - packages/@dvt/contracts
  - packages/@dvt/engine
  - apps/api
severity: High
probability: Low
context: >
  The runtime may not emit its cancellation lifecycle event before the API releases its per-run
  command lock.
risk: >
  A second delivery could observe RUNNING after the first provider command succeeded and dispatch
  cancellation again.
mitigations:
  - 'Persist RunCancelSubmitted after provider acceptance and before releasing the command lock.'
  - 'Return already_requested when a durable submission receipt exists.'
  - 'Keep RunCancelSubmitted non-projecting so runtime lifecycle authority remains unchanged.'
  - 'Cover concurrent RUNNING deliveries and receipt projection semantics with tests.'
review_after: 2026-11-02
