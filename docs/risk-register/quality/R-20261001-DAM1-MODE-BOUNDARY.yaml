id: R-20261001-DAM1-MODE-BOUNDARY
title: LIVE or LOCAL labels could outrun the protected data execution boundary
status: Open
date: 2026-10-01
owners:
  - '@dvt/contracts'
  - dvt-api
  - web
severity: High
probability: Medium
description: >-
  A typed mode selection alone cannot prove that the protected Preview/Run rail authorized and
  resolved a READY local generation or that a LIVE result came from the current remote provider.
  Exposing a mode label before the data path is wired could misstate provenance.
mitigations:
  - Wire the authorized Source LIVE query in GH-3553 and existing Transform LIVE query in GH-3555;
    keep LOCAL acquisition and readiness outside these cuts
  - Require authorization and READY-generation resolution before LOCAL calculation
  - Reject provisional or missing generations and never substitute the latest generation
  - Preserve no-fallback LIVE/LOCAL behavior through DAM1.05-DAM1.07 implementation
  - Prove provider and browser provenance, pagination and zero hidden reads in DAM1.10
  - Require Source provenance to match the single response binding and limit, including empty
    results
  - Invalidate old Source rows on publication change or rebinding and refresh only through an
    explicit current-source action
  - Show bounded-first-page and query time without claiming stable order, capture time or remote
    freshness
  - Deploy the Source response hard cut with its Web consumer; reject sampledAt-only responses
    instead of silently accepting legacy data
  - Derive Transform provenance from actual selected-relation physical inputs, deduplicate repeated
    physical bindings without collapsing logical occurrences, and reject mixed connections
  - Invalidate Transform samples when graph query inputs change or the model is removed; reject
    stale callbacks and late responses without automatically querying
  - Require Transform provenance on empty results and deploy its response hard cut with Web; refresh
    through the existing protected query, never through LOCAL or an execution fallback
