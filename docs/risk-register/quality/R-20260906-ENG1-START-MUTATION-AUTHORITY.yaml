id: R-20260906-ENG1-START-MUTATION-AUTHORITY
title: Start failure reporting could confuse run existence with preparation authority
status: Open
date: 2026-09-06
owners:
  - '@dvt/engine'
  - '@dvt/adapter-postgres'
  - '@dvt/adapter-temporal'
severity: High
probability: Low
context: >
  Concurrent starts and recovery deliveries share logical run and deterministic intent identities. A
  handler that derives authority from metadata existence can append RunFailed to another
  invocation's run.
risk: >
  A future coordinator or recovery change could discard the created/reused preparation disposition
  or grant failure authority before bootstrap succeeds. Failed authority reads can also be confused
  with confirmed absence and grant cancellation or RunFailed authority incorrectly.
mitigations:
  - Exclusive receipt acquisition, store-time revision reclaim and transactional fencing guard
    canonical bootstrap, provider binding and failure writes in both storage adapters.
  - Unknown provider outcomes precede the dispatch RPC. Observation-only reconciliation persists
    bounded backoff/escalation and never automatically redispatches a missing provider execution.
  - Compensation remains required until cancellation or termination is observed for the exact
    execution. Acknowledgement, missing history and incompatible terminal outcomes are not success.
  - Typed readonly preparation and explicit phase travel through the existing start coordinator,
    execution service and common failure handler.
  - Created authority originates only after successful fresh or recovery bootstrap.
  - Sixteen regressions preserve complete run state on admission rejection and deterministic
    bootstrap/recovery races while retaining owned failure behavior.
  - StartRunProtocol documents the authority requirement and the remaining boundary.
  - PostgreSQL metadata collisions must preserve the canonical Engine error class, child runId and
    original cause; real database regressions cover reuse and reservation rollback.
  - Authority reads preserve found, missing and failed. Failed DISPATCHED metadata reads defer;
    failed or missing start failure authority suppresses RunFailed and preserves the original error.
  - Decision tables and architecture guards isolate pending reconciliation decisions from effects,
    diagnostic transport from failure authority, and shared compensation from start sequencing.
  - Full-state negative tests include non-Error rejections and throwing diagnostic sinks.
  - Temporal start explicitly rejects both running identity conflicts and reuse of retained closed
    workflow IDs; it propagates duplicate errors without application redispatch or synthetic
    success.
  - Pinned full-server retransmission evidence proves both arrival orders converge while identity is
    retained, and reproduces a second execution after deletion even with the exact original request
    ID and payload. Transport retries are not application redispatch authorization.
limitations:
  - The ownership/observation cut was integrated through GH-3506 with exact-SHA acceptance and
    independent review; that proof does not admit a subsequent redispatch capability.
  - GH-2679 remains open for positive safe-redispatch acceptance. This cut deliberately forbids it.
  - Temporal identity rejection is bounded by namespace retention/history deletion and is not
    exclusive Engine ownership, resource-side fencing, or safe redispatch authorization.
  - The development profile does not prove a maximum late-request arrival bound or operational
    preservation of identity. SDK retry limits, local deadlines and request IDs do not fill that
    gap.
  - GH-2676 closed its bounded preparation-authority cut; it does not certify the remaining
    ownership and provider-effect invariants tracked by GH-2678 and GH-2679.
