id: R-20260825-VTX1-VISUAL-CAST-LIST-DRIFT
title: VTX1 visual cast discovery and compiler allow-list can drift
status: open
owner: web
probability: medium
impact: low
risk: >-
  VTX1 visual authoring and its PostgreSQL compiler maintain separate cast-target lists. A value can be offered by the UI but rejected by the compiler, or be executable without being discoverable visually.
mitigation: >-
  The concrete timestamptz mismatch is covered by a regression test. Structural list convergence is deferred deliberately to SUB1 #2640/#2642 so the temporary VTX1 fix does not create a new provider/type catalog authority.
validation:
  - apps/web/src/app/views/canvas/canvasVisualTransformSqlCompiler.test.ts
retirement_condition: >-
  Close when #2642 projects visual type/cast discovery from the admitted Substrait-backed catalog/provider projection and the separate VTX1 UI/compiler cast lists are removed or version-confined.
