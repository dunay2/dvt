context: >
  MW-D1 started under an `external compile` label and later moved toward `plan compile` in the
  public contract and API boundary. The branch now aligns the active code and living docs, but
  historical proposals, reviews, and closeouts still preserve the earlier vocabulary for
  traceability.
risk: >
  Future slices could copy historical `external compile` wording or reintroduce compile input
