---
id: R-20260409-PROVIDER-REF-EMPTY-STRING-PERSISTENCE
title: Empty temporal taskQueue values can re-enter provider-ref runtime state
status: Closed
date: 2026-04-09
owners:
  - packages/@dvt/engine
  - packages/@dvt/contracts
  - packages/@dvt/adapter-postgres
severity: Medium
probability: Medium
context: >
  A prior slice preserved explicit empty temporal task-queue values in provider refs. Once
  `EngineRunRef.taskQueue` was hardened to an optional non-blank contract field, that behavior
  became semantically invalid and could turn stored metadata into a self-rejecting runtime round
  trip.
risk: >
  If empty task queues are treated as meaningful instead of invalid, engine stores, API mapping, and
  Postgres materialization can preserve a provider ref that no longer satisfies the canonical
  `EngineRunRef` contract.
mitigations:
  - 'Temporal `taskQueue` now follows absent-or-nonblank semantics everywhere; empty strings are not
    accepted as valid provider-ref state.'
  - 'StartRunEventFactory, in-memory stores, and Postgres run-metadata persistence now validate
    provider refs through the hardened `EngineRunRef` contract boundary.'
  - 'Contracts and adapter tests now cover empty temporal task queues as invalid input or invalid
    persisted state.'
  - 'verify:prepush remains required before marking the slice ready.'
review_after: 2026-06-01
---
