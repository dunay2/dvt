---
id: R-20260512-WE-HX-3-START-RUN-DECOMPOSITION
title: Start-run phase decomposition could diverge from existing protocol semantics
status: Open
date: 2026-05-12
owners:
  - '@dvt/engine'
severity: Low
probability: Low
---
description: >
  WE-HX-3 extracts start-run admission and deterministic intent creation from
  StartRunApplicationService. The main risk is semantic drift from the existing StartRun protocol
  while moving code between internal phase owners.

mitigation: >
  Keep public contracts unchanged, reuse the existing StartRunApplicationService behavior tests, add
  direct phase-service tests, and add a semantic architecture guard that prevents provider
  resolution, scoped plan integrity, or intent creation from moving back into the application
  coordinator.
