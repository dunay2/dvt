---
id: R-20260420-TEMPORAL-DBT-BUILTIN-COUPLING
title: Adapter-temporal still owns DBT plugin and CLI surfaces inside the package
status: Open
date: 2026-04-20
owners:
  - packages/@dvt/adapter-temporal
  - apps/temporal-worker
severity: Medium
probability: Medium
context: >
  Repository review on 2026-04-20 confirmed that DBT is not only a test concern. The shared
  contracts and engine already recognize DBT step kinds and DBT-oriented run execution context
  admission, while @dvt/adapter-temporal carried DBT in the default activity registry and generic
  ActivityDeps surface. The 2026-04-28 DBT-core decoupling pass removed that default-core coupling:
  ActivityDeps no longer includes dbtPluginRunner or runExecutionContextReader,
  createDefaultStepActivityRegistry() starts empty, and apps/temporal-worker composes
  createDbtStepActivityRegistry() only when DVT_TEMPORAL_DBT_ENABLED=true. The remaining risk is
  narrower: @dvt/adapter-temporal still exports the DBT step activity, DBT CLI runner, and plugin
  contracts as package-owned plugin surface, and workflow artifact helpers still contain
  DBT-oriented artifact interpretation.
risk: >
  If new transformation executors or artifact types are added before package-level plugin extraction
  exists, @dvt/adapter-temporal can still accumulate executor-specific plugin exports, CLI hosting,
  and artifact assumptions instead of staying a Temporal translation boundary per ADR-0003,
  ADR-0019, and ADR-0034. The immediate core dispatcher/default-registry drift is mitigated, but
  package-level ownership can still bias future plugin work toward DBT unless the next extraction
  moves executor plugins behind a dedicated runtime plugin package or profile boundary.
mitigations:
  - 'Keep apps/temporal-worker as the only live composition root that wires DBT runtime
    dependencies.'
  - 'Keep createDefaultStepActivityRegistry() plugin-free and fail CI if DBT symbols re-enter core
    activity modules.'
  - 'Prefer explicit composition-time registries and step-kind wiring for every executor profile.'
  - 'Track follow-up extraction of DbtStepActivity, DbtCliPluginRunner, and dbt.compiled-sql
    artifact mapping out of the adapter package-owned plugin surface.'
  - 'Keep adapter-temporal tests split between Temporal-core behavior and DBT plugin or runtime
    behavior so boundary drift remains visible.'
review_after: 2026-06-15
---
