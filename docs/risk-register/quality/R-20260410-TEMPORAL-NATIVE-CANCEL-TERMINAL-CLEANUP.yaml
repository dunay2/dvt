severity: Low
probability: Medium
context: >
  AR-C6 now preserves ordered canonical cancel events and rethrows native cancellation after
  non-cancellable finalization so Temporal converges its provider-live terminal status on
  `CANCELLED`.
risk: >
  A future refactor could revert the workflow to normal completion after native cancellation
  cleanup, reintroducing the mismatch where canonical status reaches `CANCELLED` but
  `handle.describe()` settles on `COMPLETED`.
mitigations:
  - Unit coverage asserts that TemporalAdapter.cancelRun() calls native cancel instead of signal.
  - Time-skipping integration coverage now proves native cancellation converges to provider status
    `CANCELLED` while preserving canonical event ordering.
  - EnginePolicies records native and cooperative cancellation as distinct paths with explicit
    provider-status semantics.
