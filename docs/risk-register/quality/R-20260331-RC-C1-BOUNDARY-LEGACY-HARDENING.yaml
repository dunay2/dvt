id: R-20260331-RC-C1-BOUNDARY-LEGACY-HARDENING
title: Reopened RC-C1 could leave unrelated adapter message parsing confused with the fixed boundary
status: Open
date: 2026-03-31
owners:
  - apps/api
  - packages/@dvt/adapter-postgres
severity: Medium
probability: Low
context: >
  RC-C1 now hardens caller-visible HTTP error serialization and the
  IRunStateStoreMaintenance.rebuildSnapshot not-found boundary with typed errors.
risk: >
  Other internal adapter paths in PostgresRunMetadataRepository still throw stringly-typed errors
  for separate invariants. A future change could accidentally route those internal strings back
  across a public boundary and recreate message parsing at the edge.
mitigations:
  - httpErrorMapper now depends on typed runtime errors instead of parsing exception text.
  - adminRoutes rebuild-snapshot uses typed RunNotFoundError through the maintenance boundary.
  - Negative regressions assert that legacy RUN_NOT_FOUND message strings no longer yield HTTP 404.
  - Remaining metadata-repository string errors are explicitly documented as out of scope for RC-C1.
