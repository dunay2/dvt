summary: >
  Future governance edits could make SYS-RUNTIME-ROOT own runtime files again, masking package-level
  ownership, API, invariant, consumer, and test evidence.
mitigation: >
  The semantic governance-unit test asserts that SYS-RUNTIME-ROOT is a module with no owned files
  and that concrete runtime package files map to package-level runtime component owners while
  plan-store plan-ref policy remains outside the engine core owner.
evidence:
