summary: >
  AR-C10 closes the protected runtime command/query rail catalog, negative evidence mapping,
  explicit compatibility posture, and source-of-truth documentation posture. The executable catalog
  is the only row-level rail truth. Component and planning docs summarize and link to that catalog
  instead of carrying a second manual route matrix.

root_cause: >
  The closure slice prioritized making the protected runtime rails executable and mechanically
  testable. The follow-up closure reduced duplicated documentation truth, added architecture-test
  coverage for the source-of-truth rule, removed ambiguous canonical-plan authorization wording, and
  documented the signal parser constants facade as intentional.

