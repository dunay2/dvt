---
id: R-20260408-RECOVER-RUN-BOUNDARY-DRIFT
title: Future recover-run feature could leak back into the generic signal boundary
status: Open
date: 2026-04-08
owners:
  - packages/@dvt/contracts
  - packages/@dvt/engine
severity: Medium
probability: Low
context: >
  ADR-0049 narrows RETRY_RUN out of canonical SignalType and reserves business run recovery for a
  future dedicated use case. The current slice closes the generic signal drift, but a later recovery
  implementation could regress if it reuses signal(...) instead of defining its own governed
  boundary.
risk: >
  If a future recover-run feature is reintroduced through the generic signal enum or provider signal
  mappers, contracts, adapters, and API surfaces can drift again and recreate the mixed ownership
  problem that this slice removed.
mitigations:
  - 'ADR-0049 explicitly forbids reintroducing RETRY_RUN through generic signal(...).'
  - 'SignalType, SignalRequest validation, and WorkflowSignals now reject RETRY_RUN.'
  - 'Temporal and mock adapters translate only canonical run-control signals through explicit
    mapping helpers.'
  - 'Planning state marks WE-HX-4 and WE-HX-4-C as completed, documenting the closure posture.'
  - 'A future recover-run feature must ship as a dedicated engine or application use case with its
    own ADR and contract tests.'
review_after: 2026-05-31
