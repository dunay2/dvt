---
id: R-20260803-DBT-RUNTIME-CREDENTIALS
title: DBT runtime credentials could escape the worker boundary or survive execution
status: Closed
date: 2026-08-03
owners:
  - packages/@dvt/contracts
  - packages/@dvt/temporal-dbt-plugin
  - apps/temporal-worker
  - apps/api
severity: High
probability: Low
context: >
  DBT needs warehouse credentials at process execution time, while plans, run context artifacts,
  Temporal history, events, logs, and project bundles must remain free of plaintext secrets.
risk: >
  A plaintext value could cross admission boundaries, leak through DBT process errors, or remain in
  temporary storage after a terminal or cancelled activity.
mitigations:
  - 'Validate and persist only opaque credential references in the server-created DBT context.'
  - 'Resolve deployment-backed profile bytes only inside the Temporal worker boundary.'
  - 'Materialize one restrictive profiles.yml and clear its source buffer immediately.'
  - 'Abort the DBT subprocess on activity cancellation before deleting profile and project data.'
  - 'Heartbeat active step activities and wait for cancellation cleanup before terminal events.'
  - 'Return stable failure messages without DBT stdout, stderr, credential values, or profile paths.'
  - 'Persist allow and deny decisions through one tenant-scoped append-only IAuthAuditPort adapter.'
  - 'Prove RLS isolation, idempotency, mutation rejection, cancellation cleanup, and live DBT
    execution.'
review_after: 2026-11-03
---
