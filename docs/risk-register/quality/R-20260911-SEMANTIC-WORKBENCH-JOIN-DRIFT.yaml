id: R-20260911-SEMANTIC-WORKBENCH-JOIN-DRIFT
title: Join predicates could drift between Canvas, Substrait, samples, and PostgreSQL
status: Open
date: 2026-09-11
owners:
  - web
  - api
  - packages/@dvt/contracts
  - packages/@dvt/postgres-projection
severity: Medium
