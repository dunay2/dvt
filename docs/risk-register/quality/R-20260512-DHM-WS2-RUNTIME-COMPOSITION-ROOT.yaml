summary: >
  Future edits could reintroduce config, store, adapter, maintenance, worker, or handle assembly
  directly into createIntentReconcilerRuntime instead of keeping that sequence inside the named
  IntentReconcilerRuntimeComposition command rail.
mitigation: >
  intentReconcilerRuntimeComposition.architecture.test.ts fails if the exported factory directly
  assembles stores, migrations, adapters, maintenance, workers, or runtime handles, or if the
  ordered composition calls are removed.
