---
id: R-20260410-PLANNER-KERNEL-DBT-INGRESS-LEAKAGE
title: Planner boundary exposed DBT-native ingress alongside canonical graph admission
status: Closed
date: 2026-04-10
owners:
  - packages/@dvt/contracts
  - packages/@dvt/planner
  - apps/api
severity: Medium
probability: Medium
context: >
  The planner public contract had already declared GenericGraphSourceV1 as the canonical ingress,
  but it still exposed DBT-native caller shapes such as manifestRef and DBT-profile semantics in the
  shared kernel and protected runtime boundary.
resolution: >
  Closed after planner admission became graphSource-only, the protected runtime hard-cut
  planner-backed ingress to canonical graphSource, manifestRef was rejected in start-run and
  preview, targetProfile left the planner-backed runtime command path, and the kernel-facing
  PlannerFacade stopped resolving DBT-native ingress directly.
