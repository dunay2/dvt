summary: >
  The governing proposal says `execution.materialization` is exposed on success, but the current
  projector and UI tests allow materialization evidence to coexist with `execution.failure` on
  failed runs.

mitigations:
  - Track the contradiction in the TF-C2-B hard-QA review until one semantic rule is chosen.
  - In the follow-up slice, either clear `execution.materialization` on failure paths or document
    coexistence as an intentional "last successful sink evidence" model.
  - Add regression coverage that locks the chosen failed-run behavior at projector and UI levels.

signals:
  - product/architecture docs say materialization is success-only while UI still renders it on
    failed runs.
  - operators report confusion about whether sink write succeeded when the overall run failed.
  - future fixes change the projector or UI independently because there is no governed meaning for
    the field combination.
