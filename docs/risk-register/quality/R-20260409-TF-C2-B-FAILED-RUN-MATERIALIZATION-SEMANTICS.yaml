summary: >
  Caller-visible materialization semantics are now governed and implemented as success-only.
  Projector, API, and UI paths omit `execution.materialization` from failed and cancelled run
  states, while regression coverage locks the rule at the projection and consumer layers.

mitigations:
  - Shared run-domain projection clears materialization evidence on failure and cancel paths.
  - API read-surface serialization omits materialization outside `COMPLETED`.
  - UI rendering and regression tests lock materialization visibility to successful snapshots.

signals:
  - failed snapshots no longer expose mixed `failure + materialization` caller-visible state.
  - operator-facing UI now renders failure diagnostics without sink-success claims on failed runs.
  - projector, API, and UI tests assert the same success-only materialization rule.
