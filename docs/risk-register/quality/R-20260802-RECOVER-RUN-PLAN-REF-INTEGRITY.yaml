---
id: R-20260802-RECOVER-RUN-PLAN-REF-INTEGRITY
title: Recovery could execute a plan reference reconstructed from the wrong hash
status: Closed
date: 2026-08-02
owners:
  - packages/@dvt/artifacts
  - packages/@dvt/engine
  - packages/@dvt/adapter-postgres
  - apps/api
severity: High
probability: Low
context: >
  Canonical plan identity and executable artifact integrity are distinct hashes.
risk: >
  Reconstructing PlanRef.sha256 from PlanRecord.canonicalHash makes valid recovery fail integrity
  validation and could weaken ownership if a tenant-neutral artifact lookup is exposed directly.
mitigations:
  - 'RecoverRun consumes the exact persisted PlanRef through IStoredPlanRefReader.'
  - 'PostgresPlanStore verifies tenant, project, and environment ownership before returning it.'
  - 'Engine artifact-byte integrity validation remains mandatory and unchanged.'
  - 'Recovery lineage reservation and child bootstrap commit or roll back together.'
  - 'In-memory bootstrap serializes per origin and restores only the failed lineage checkpoint.'
  - 'An unconfirmed prepared child resumes under the same recovery identity and logical attempt.'
  - 'A pending recovery intent is reconciled against the provider before any repeated dispatch.'
  - 'Bootstrapped provider workflows are adopted; unavailable reconciliation fails closed.'
  - 'Unit, PostgreSQL integration, and live browser tests cover the complete recovery path.'
review_after: 2026-11-02
---
