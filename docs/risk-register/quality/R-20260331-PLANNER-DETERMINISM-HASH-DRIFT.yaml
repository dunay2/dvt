id: R-20260331-PLANNER-DETERMINISM-HASH-DRIFT
title: Planner determinism hash pin silently drifts when plan serialization changes
status: Mitigated
date: 2026-03-31
owners:
  - packages/@dvt/planner
severity: Low
probability: Low
context: >
  The determinism test pins an exact SHA-256 planId from a fixed input vector. When PlanAssembler
  serialization changes (e.g. constant canonicalization in #582), the pin drifts and the test fails
  — but only at next run, not at the point of change.
risk: >
  A drift between the committed pin and the actual hash means the determinism guarantee was silently
  broken between #582 and this fix. Any bisect or audit relying on the test would have seen a
  false-negative pass in that window.
mitigations:
  - Re-pinned hash verified with DVT_BOOTSTRAP_VECTOR=1 at HEAD.
  - CI determinism gate (Determinism Tests job) catches this class of failure on every PR.
  - BOOTSTRAP_MODE documents the re-pin procedure inline in the test.
  - Added explicit determinism coverage for `createdAtIso` drift in planner unit tests so `planId`
    invariance is enforced even when timestamp input changes across retries.
