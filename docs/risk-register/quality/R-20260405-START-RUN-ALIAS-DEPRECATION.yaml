The temporary `StartRunCoordinator` alias could have been reintroduced in composition wiring or
remain beyond its planned removal window, creating naming drift and slowing migration closure. This
risk is now closed because the alias was removed from the engine surface and dependency seam, and
composition-root anti-alias tests protect against regression.
