id: R-20260402-RC-G1-CONTRACT-OWNERSHIP-EXECUTION-DRIFT
title: RC-G1 contract ownership migration can drift between tracker, proposal, and package moves
status: Open
date: 2026-04-02
owners:
  - packages/@dvt/contracts
  - packages/@dvt/delivery
  - packages/@dvt/traceability-service
  - packages/@dvt/artifacts
  - packages/@dvt/planner
severity: Medium
probability: Low
context: >
  The reconciler runtime review identified contract ownership drift across the `engine`, `planner`,
  and `shared` taxonomy. The active proposal already existed, but the workboard tracker was missing
  and a local execution note reintroduced already-closed health work as if it were still open.
  `RC-G1-B` closed the engine-owned portion of the migration, `RC-G1-C` completed the delivery,
  traceability, and artifacts owner-package cutover, and `RC-G1-D` now closes the planner-private
  behavior-port migration. The remaining risk is regression risk that moved behavioral ports could
  leak back through `@dvt/contracts`.
risk: >
  Future convenience exports can still diverge between proposal, lane tracker, and real package
  changes. That would weaken ADR-0018 / ADR-0034 boundaries, re-oversize `@dvt/contracts`, and make
  future ARC-2 migrations less auditable.
mitigations:
  - Lane A now tracks the work explicitly as `RC-G1` with sequenced slices `RC-G1-A..D`.
  - The ownership proposal now freezes each affected family to `stay shared` or `move to owner`.
  - The reconciler runtime review now points to the canonical Lane A tracker instead of an orphan
    workboard reference.
  - ARC-2 evidence is required for the future `RC-G1-B/C/D` package migrations.
  - >-
    `RC-G1-B4` removed the remaining root `@dvt/contracts` exports for equivalent engine-owned
    behavioral ports, cut the last residual `RunStateCommandPort` import to `@dvt/engine`, and added
    lint guards to block reintroduction in governed engine/adapters/state-store/API code.
  - >-
    `RC-G1-C` removed delivery-owned and lineage-owned behavioral ports from the shared kernel,
    retired the generic shared artifact-store contract, moved live runtime ownership to
    `@dvt/delivery`, `@dvt/traceability-service`, and `@dvt/artifacts`, and extended lint guards so
    governed delivery/traceability/adapters/worker code fails if those imports reappear through
    `@dvt/contracts`.
  - >-
    `RC-G1-D` removes planner-private behavior ports from the shared kernel, republishes those ports
    from `@dvt/planner`, redirects API and Postgres adapter consumers, and adds architecture tests
    plus lint guards that keep shared serializable planner vocabulary distinct from planner-owned
    behavior.
