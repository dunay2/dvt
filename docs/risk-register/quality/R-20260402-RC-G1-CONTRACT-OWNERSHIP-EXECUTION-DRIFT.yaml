id: R-20260402-RC-G1-CONTRACT-OWNERSHIP-EXECUTION-DRIFT
title: RC-G1 contract ownership migration can drift between tracker, proposal, and package moves
status: Open
date: 2026-04-02
owners:
  - packages/@dvt/contracts
  - packages/@dvt/engine
  - packages/@dvt/planner
severity: Medium
probability: Medium
context: >
  The reconciler runtime review identified contract ownership drift across the `engine`, `planner`,
  and `shared` taxonomy. The active proposal already existed, but the workboard tracker was missing
  and a local execution note reintroduced already-closed health work as if it were still open.
risk: >
  Future ownership moves can diverge between proposal, lane tracker, and real package changes. That
  would weaken ADR-0018 / ADR-0034 boundaries, leave `@dvt/contracts` oversized, and make ARC-2
  changes less auditable.
mitigations:
  - Lane A now tracks the work explicitly as `RC-G1` with sequenced slices `RC-G1-A..D`.
  - The ownership proposal now freezes each affected family to `stay shared` or `move to owner`.
  - The reconciler runtime review now points to the canonical Lane A tracker instead of an orphan
    workboard reference.
  - ARC-2 evidence is required for the future `RC-G1-B/C/D` package migrations.
