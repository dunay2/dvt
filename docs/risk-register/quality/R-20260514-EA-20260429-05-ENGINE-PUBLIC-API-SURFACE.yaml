summary: >
  The engine package surface is now split into public, runtime, and testing entrypoints. Future
  runtime work could accidentally re-export implementation services from the root barrel unless the
  architecture guard remains active.
mitigation: >
  Keep packages/@dvt/engine/test/architecture/enginePublicApiSurface.architecture.test.ts in the
  package test baseline and require component docs to change before expanding any public root export
  family.
