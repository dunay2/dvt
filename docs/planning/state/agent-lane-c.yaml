lane_id: C
title: Runtime Safety And Admission
owner: Product / Architecture / Delivery / Docs
status: Active
last_reviewed: 2026-03-29
goal: Harden runtime behavior, admission checks, and caller-visible freshness.
expected_outcome:
  - runtime failures are explicit
  - claim semantics are safe under concurrency
  - API consumers can reason about freshness
tasks:
  - task_id: MVP-C1
    priority: P0
    status: queued
    objective:
      produce the minimum backend operations runbook for the existing MVP control-plane (bootstrap,
      diagnose, daily operate) without adding feature depth.
    dependency: MVP-A1, MVP-B1
    target:
      Operator-ready runbook for current runtime routes, auth scope handling, health/readiness
      diagnosis, and baseline validation commands.
  - task_id: S09
    priority: P0
    status: done
    objective: decide retry ownership across planner, engine, and adapters.
    dependency: none
    target: Lock ADR-0040 and the runtime ownership baseline.
  - task_id: RC-D2
    priority: P0
    status: done
    objective: make the outbox claim timeout configurable.
    dependency: none
    target: Deployment-tunable claim lease.
  - task_id: RC-D3
    priority: P0
    status: done
    objective: normalize Temporal not-found error code comparison.
    dependency: none
    target: Merge review and lock normalized not-found guard.
  - task_id: RC-D1
    priority: P1
    status: done
    objective: surface reconciler degradation in API health.
    dependency: none
    target: Validate and merge health degradation signaling.
  - task_id: RC-D1A
    priority: P1
    status: done
    objective: add health compatibility and watchdog integration tests.
    dependency: RC-D1
    target: Compat policy + timer wiring integration coverage.
  - task_id: RBAC at operation level
    priority: P1
    status: in_progress
    objective: enforce tenant-aware start/signal/cancel rules.
    dependency: none
    target: Define operation-level authorization boundaries.
  - task_id: snapshot staleness in API
    priority: P1
    status: queued
    objective: expose freshness to callers.
    dependency: none
    target: Caller-visible staleness surface.
  - task_id: read-your-writes contract
    priority: P2
    status: queued
    objective: set a measurable staleness SLO.
    dependency: snapshot staleness in API
    target: SLO-backed freshness contract.
  - task_id: granular RBAC
    priority: P2
    status: queued
    objective: split CANCEL and PAUSE privileges.
    dependency: none
    target: Refine operation-level authorization split.
  - task_id: RC-C1
    priority: P3
    status: queued
    objective:
      make runCommandFieldParsers error helpers fully generic so shared executor/parser plumbing
      does not depend on a closed parse-code set.
    dependency: RBAC at operation level
    target: Generic ParsedRunCommandError helper signatures validated by dedicated unit tests.
  - task_id: RC-C2
    priority: P2
    status: queued
    objective:
      institutionalize Lane C AI efficiency preflight (hygiene script + prepush chain + CI-failure
      log-first triage) and track measurable round reduction.
    dependency: none
    target: Apply the Lane C efficiency playbook in three consecutive PR cycles.
  - task_id: RC-E1
    priority: P1
    status: queued
    objective:
      harden PlanRefPolicy.isLinkLocalHost against RFC1918, full 127.0.0.0/8, IPv6 ULA, and
      dangerous schemes (data:, javascript:, mailto:).
    dependency: S16 merge
    target: SSRF/CIDR hardening + dedicated unit tests.
  - task_id: RC-E2
    priority: P1
    status: queued
    objective:
      move assertTenantAccess before validatePlanRef in validateStartRunPreconditions to prevent
      plan-URI information leakage to unauthorized callers.
    dependency: S16 merge
    target: Precondition order hardening.
dependency_notes: |
  - `MVP-C1` depends on `MVP-A1` and `MVP-B1` so the runbook reflects verified capabilities only.
  - `RC-D1A` depends on `RC-D1`.
  - `RBAC at operation level` is unblocked after `S09`.
  - `Read-your-writes contract` depends on `snapshot staleness in API`.
  - `RC-C1` depends on `RBAC at operation level`.
  - `RC-C2` is independent and may run in parallel with runtime hardening items.
  - `RC-E1` and `RC-E2` depend on S16 merge.
