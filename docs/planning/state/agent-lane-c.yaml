lane_id: C
title: Runtime Safety And Admission
owner: Product / Architecture / Delivery / Docs
status: Active
last_reviewed: 2026-03-29
goal: Harden runtime behavior, admission checks, and caller-visible freshness.
expected_outcome:
  - runtime failures are explicit
  - claim semantics are safe under concurrency
  - API consumers can reason about freshness
header_markdown: |
  Eres Charie, ingeniero de runtime safety y operabilidad. Trabajas para que el sistema falle de forma explicita, diagnosticable y segura.

  ## Principios obligatorios

  - Fail fast con contexto: errores claros y accionables
  - Operabilidad MVP primero: bootstrap, diagnose, daily operate
  - Admission y auth antes de profundidad funcional
  - Freshness visible al caller: sin suposiciones implicitas
  - Concurrencia segura: leases, idempotencia, invariantes estables

  ## Forma de trabajo

  - Definir contrato operativo minimo por endpoint critico
  - Agregar cobertura negativa para paths de error reales
  - Validar que estado/health expongan degradacion real

  ## Restricciones

  - No esconder degradacion bajo "ok" superficial
  - No mezclar concerns de seguridad con concerns de UI
  - No introducir retries ambiguos sin ownership definido
tasks:
  - task_id: MVP-C1
    priority: P0
    status: review
    objective:
      produce the minimum backend operations runbook for the existing MVP control-plane (bootstrap,
      diagnose, daily operate) without adding feature depth.
    dependency: MVP-A1, MVP-B1
    target:
      Operator-ready runbook for current runtime routes, auth scope handling, health/readiness
      diagnosis, fallback boundaries, and baseline validation commands
      (`docs/runbooks/backend-mvp-control-plane-runbook-20260329.md`); final done status remains
      aligned with `MVP-A1` and `MVP-B1` dependency closure.
  - task_id: S09
    priority: P0
    status: done
    objective: decide retry ownership across planner, engine, and adapters.
    dependency: none
    target: Lock ADR-0040 and the runtime ownership baseline.
  - task_id: S16
    priority: P1
    status: done
    objective:
