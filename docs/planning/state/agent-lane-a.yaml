lane_id: A
title: Contracts And State-Store Boundary
owner: Product / Architecture / Delivery / Docs
status: Active
last_reviewed: 2026-03-26
goal: Close the state-store boundary and the smallest contract cleanup slice around it.
expected_outcome:
  - state-store ownership is explicit
  - composition-root wiring names exact roles
  - contract drift is reduced
  - optional maintenance ownership is explicit
  - migration recovery is defined
tasks:
  - task_id: RC-A6
    priority: P0
    status: done
    objective: align dead-letter signatures with tenant-scoped concrete APIs.
    dependency: none
    target: Merge and lock tenant-scoped dead-letter contract parity.
  - task_id: S02
    priority: P0
    status: done
    objective: split IRunStateStore into write/read/maintenance roles.
    dependency: RC-A6
    target: Merge review and lock the write/read/maintenance contract split.
  - task_id: S18
    priority: P0
    status: done
    objective:
      make composition-root state-store role bindings explicit instead of reconstructing the
      aggregate by intersection.
    dependency: S02
    target:
      Bind read/write roles directly in the root and stop reconstructing the aggregate by
      convenience.
  - task_id: S19
    priority: P1
    status: done
    objective:
      isolate the maintenance query ownership by moving `listStaleSnapshotRuns` into a dedicated
      query port.
    dependency: S18
    target: Keep maintenance write-only and expose the staleness query separately.
  - task_id: S19-F1
    priority: P2
    status: queued
    objective:
      remove the correlated stale-snapshot scan pattern in `listStaleSnapshotRunsSql` to avoid
      O(N)-per-row behavior at high run concurrency.
    dependency: S19
    target: >-
      Phase 1 replaces correlated MAX(run_seq) polling with `run_event_heads(run_id, tenant_id,
      latest_run_seq)` maintained in the event-append transaction. Phase 2 (optional) moves
      projector discovery to a push-based snapshot work queue. Lock the rollout with EXPLAIN-backed
      performance coverage at the 5000-concurrent-runs target load.
  - task_id: S18-F1
    priority: P2
    status: queued
    objective:
      harden the explicit state-store role bundle into a root-owned boundary and prevent convenience
      rewiring drift.
    dependency: S18
    target:
      Keep the explicit role bundle but lock its semantics behind a stricter root-owned boundary and
      regression guard.
  - task_id: schema-migration-rollback
    priority: P1
    status: done
    objective: make storage changes recoverable after S02.
    dependency: S02
    target: Define and implement rollback recovery for state-store changes.
  - task_id: S13
    priority: P1
    status: done
    objective: remove duplicate estimateRunRef declaration.
    dependency: none
    target: Remove duplicate provider-adapter contract drift.
  - task_id: RC-A5
    priority: P1
    status: done
    objective:
      replace silent markResolved catch with warning/metric telemetry so intent-resolution failures
      are observable.
    dependency: none
    target: Merged in main (#554); intent-resolution observability locked.
  - task_id: RC-E3
    priority: P1
    status: queued
    objective:
      replace throw-based engine errors in StartRunAuthorizedFacade with Result<T, EngineError>
      return type to eliminate the Divergent Change smell.
    dependency: none
    target: Engine Result type + facade catch-block elimination.
  - task_id: DHM
    priority: P1
    status: queued
    objective:
      drive DDD/Hexagonal modularization slices starting with WS5 (test fixture modularization),
      then WS1, WS3, WS4, WS2, WS6.
    dependency: none
    target: WS5 test fixture modularization complete; roadmap for remaining workstreams defined.
  - task_id: plan-version-reset
    priority: P1
    status: queued
    objective:
      reset planVersion from '2.3' to '1.0' across contracts, registry, and test helpers before
      go-live.
    dependency: none
    target: planVersion canonical value is '1.0' everywhere before first production release.
dependency_notes: |
  - `S02` depends on `RC-A6`.
  - `S18` depends on `S02`.
  - `S19` depends on `S18`.
  - `S19-F1` depends on `S19`.
  - `S18-F1` depends on `S18`.
  - `Schema migration rollback` depends on `S02`.
  - `S13` is independent and can run in parallel.
  - `RC-E3` is a prerequisite to S03 or similar; breaking interface change — coordinate with Lane C.
  - `DHM` starts with WS5; follow WS1, WS3, WS4, WS2, WS6 dependency order.
  - `plan-version-reset` is independent and can run in parallel.
