dependency_notes:
  - >-
    `MVP-E1` and `F-07` now define the frontend runtime contract baseline. `F-07` executes in
    docs-first/TDD-first order through `F-07-A..F-07-F`. No core-flow task should assume POST /runs
    for startRun until that baseline is implemented and aligned to the protected API route map.
  - >-
    `F-03` and `F-01` remain parallel shell-level slices; they improve operator experience but do
    not replace the contract, data-source, or state-boundary convergence chain.
  - >-
    `F-04`, `F-05`, `F-06`, and `F-12` form the architecture convergence chain for the existing
    frontend codebase. Later feature work should not bypass those boundaries with view-local data
    plumbing.
  - >-
    `F-08` through `F-11` remain contracts-first runtime delivery slices and should stay blocked
    until the frontend contract baseline and query or state convergence work are complete.
  - >-
    `F-02` has accepted evidence and establishes the first capability-module pattern for Lane E;
    `F-13` should keep the frontend docs aligned with that pattern as more slices land.
  - >-
    `F-14` can start once query and service boundaries are stable enough to lock a repeatable test
    lane into CI without codifying unstable view wiring.
  - >-
    `F-17` now describes Monaco embedded review surfaces, not a Canvas replacement. `F-17-A` aligns
    docs and roadmap, `F-17-B` and `F-17-C` place Monaco in Diff and Artifacts after `F-06`,
    `F-17-D` depends on `F-21` for the Templates route, `F-17-E` makes lazy loading mandatory, and
    `F-17-F` delays backend-backed Monaco panes until `F-07` and `F-11` govern the contract and
    artifact truth. See docs/planning/proposals/monaco-workbench-integration-rationale-20260402.md
    for the decision rationale and route-level diagrams.
  - >-
    `F-22` is now the proposal-set handoff for the SQL-first execution-first product slice, and
    `TF-E1` is decomposed into authoring, preview-to-run, and result UX closure for the v1
    transformation subgraph. The active residual frontend work now keeps that preview contract
    selection-scoped instead of treating the whole Canvas as permanently limited to three nodes.
  - >-
    `TF-E2` is the productization follow-up to `TF-E1`. It must close canonical graph-draft
    ownership, persisted node and edge lifecycle, Inspector-backed property editing, and the full
    reload-proof test matrix without promoting React Flow state or `localStorage` fallback behavior
    into the product source of truth. `TF-A2` now owns the shared contract freeze and `TF-C4` owns
    the protected API/store boundary, so Lane E is explicitly blocked from inventing a frontend-
    local persistence contract or hiding the missing backend boundary behind UI-local persistence.
  - >-
    `F-23` captures the next Git-facing UX slice as governed file-history review inside `Code` and
    `Diff`. It explicitly avoids a VS Code-style Git explorer and keeps route ownership aligned with
    the Git-mode architecture.
  - >-
    The UX professionalization bundle extracted three governed slices: shell grammar stays under
    `F-15` with `F-01`, `F-18`, and `F-23` as downstream consumers, while `F-24` now owns the
    operator-workbench visual system and `F-25` owns the plugin UX integration contract so neither
    concern remains hidden inside generic shell cleanup or Monaco planning.
