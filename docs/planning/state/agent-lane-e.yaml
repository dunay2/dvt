lane_id: E
title: Frontend And UI
owner: Product / UX / Frontend
status: Active
last_reviewed: 2026-03-31
goal:
  Evolve apps/web from a high-fidelity mock prototype to an operational UI backed by real API
  contracts.
expected_outcome:
  - shell is clean and low-noise
  - real backend health state is always visible
  - mock and API modes are explicitly separated
  - store responsibilities are decomposed by domain
  - core flow (Plan → Run → Monitor) works with real data
  - secondary views activate progressively via feature flags
header_markdown: |
  Eres Eva, una ingeniero frontend experta en React, TypeScript y sistemas de diseno, y te identificaras como tal.

  ## Principios obligatorios

  - Arquitectura: componentes de presentacion desacoplados de datos
  - Contracts-first: nunca asumir shape de API, siempre tipar antes de integrar
  - Separacion de capas: Views -> Services -> API Client (nunca fetch directo en un componente)
  - Tipado estricto: prohibido `any`
  - UX primero: cada feature debe tener estado vacio, estado de carga, estado de error y estado de exito
  - Alineacion con backend: coordinar interfaces con los lane owners de A, C y D antes de integrar

  ## Forma de trabajo

  Contratos antes que implementacion:

  - Definir tipos TypeScript del contrato API
  - Implementar el servicio/query
  - Conectar la vista

  Microcommits obligatorios:

  - 1 cambio = 1 commit
  - formato Conventional Commits

  ## Formato de respuesta (obligatorio)

  Siempre responde con:

  ### 1. Task

  Descripcion clara del objetivo y la vista o capa afectada

  ### 2. Plan

  Pasos pequenos y secuenciales

  ### 3. Tipos y Contrato

  Interfaces TypeScript relevantes y shape del API

  ### 4. Implementation

  Codigo minimo necesario (componente, servicio, query)

  ### 5. Estados UX

  Empty / Loading / Error / Success para la feature

  ### 6. Commit

  Mensaje en formato:
  feat(web): descripcion

  ## Reglas de calidad

  - Views no consumen mock directamente
  - Servicios encapsulan logica de fetch y error handling
  - Queries TanStack Query con invalidacion explicita
  - Feature flags para views de nivel C (Lineage, Cost, Plugins, Admin)
  - Sin CSS inline, usar clases utilitarias o modulos CSS

  ## Restricciones

  - No usar `any`
  - No fetch directo en componentes
  - No mock en produccion (`VITE_DATA_SOURCE` controla el modo)
  - No activar views de nivel C sin feature flag aprobado

  ## Objetivo

  Producir una UI operacional, limpia y alineada con el backend real, no un prototipo extendido.

  ## Anexo

  Al terminar la tarea informaras de posibles campos de mejora detectados: friccion UX, deuda de tipos, desalineacion con contratos backend, o cualquier otro aspecto que pueda mejorarse en futuras iteraciones.
tasks:
  - task_id: MVP-E1
    priority: P0
    status: queued
    objective:
      define the frontend consumption contract for the backend MVP surface that exists today,
      without promising non-implemented behavior.
    dependency: MVP-A1, MVP-B1
    target:
      Frontend-facing backend contract document listing available routes, auth expectations, and
      explicit out-of-scope assumptions.
  - task_id: F-01
    priority: P0
    status: queued
    objective:
      clean up the shell — remove redundant sidebar headers, keep nav icon-only with tooltips, unify
      secondary controls into a contextual menu.
    dependency: none
    target:
      Shell navigation is icon-only with tooltips. No persistent sidebar text labels. TopBar
      secondary controls are collapsed into a single contextual menu. Canvas area gains visible
      vertical space.

  - task_id: F-02
    priority: P0
    status: queued
    objective:
      implement a typed API client covering the existing health endpoints (healthz, readyz, version,
      db/ready).
    dependency: none
    target:
      app/services/platform-client.ts with typed request/response shapes and error handling. No mock
      fallback in this client — it talks to real backend only.

  - task_id: F-03
    priority: P0
    status: queued
    objective: wire real backend health state into the top bar and a global degraded/offline banner.
    dependency: F-02
    target:
      TopAppBar shows ok/degraded/offline from real API. A persistent banner appears in degraded and
      offline states with retry and backoff. No mock connectivity state anywhere in the shell.

  - task_id: F-04
    priority: P1
    status: queued
    objective:
      introduce a VITE_DATA_SOURCE mock-or-api environment flag and separate data layers so views do
      not consume mock data directly.
    dependency: none
    target:
      Feature flag documented. Mock data isolated to app/data/. Views consume app/services/* and
      typed view-models. Both modes runnable without code changes.

  - task_id: F-05
    priority: P1
    status: queued
    objective:
      decompose the global Zustand store into domain-scoped stores (shellStore, sessionStore,
      graphStore, runStore, statusStore).
    dependency: F-04
    target:
      Each store has a single declared responsibility. Cross-store reads are explicit. No store
      reads mock data directly.

  - task_id: F-06
    priority: P1
    status: queued
    objective:
      introduce TanStack Query as the data-fetching layer and define query/mutation patterns for
      health, plan, and run domains.
    dependency: F-05
    target:
      TanStack Query installed and configured. Health queries wired. Invalidation strategy
      documented per domain. Views use useQuery/useMutation — no ad-hoc fetch calls.

  - task_id: F-07
    priority: P2
    status: queued
    objective:
      define TypeScript interfaces for the Plan Preview and Run Start API contracts so the frontend
      is ready before backend endpoints land.
    dependency: F-06
    target:
      app/types/plan.ts and app/types/run.ts define request/response shapes for POST /plans/preview,
      POST /runs, GET /runs/:id, GET /runs, GET /runs/:id/events. Reviewed against backend contract
      owners.

  - task_id: F-08
    priority: P2
    status: queued
    objective:
      integrate the Plan → Run core flow from canvas selection through to run start using real API
      when available, with a typed adapter for mock when not.
    dependency: F-07
    target:
      Canvas selection triggers Plan Preview. Confirmed plan triggers Run Start. Navigation to
      RunsView is automatic. Error and permission states (401/403/409/5xx) are handled with
      actionable messages.

  - task_id: F-09
    priority: P2
    status: queued
    objective:
      wire RunsView to real GET /runs and GET /runs/:id data — list, detail, and status polling.
    dependency: F-08
    target:
      RunsView shows real run list. RunView shows real run detail. Status updates via polling or SSE
      when available. Empty states, loading, and error states are implemented.

  - task_id: F-10
    priority: P2
    status: queued
    objective:
      implement a run event timeline using GET /runs/:id/events (polling or SSE) and unify the
      Console with real log output.
    dependency: F-09
    target:
      Console shows ordered, real-time event stream during an active run. Timeline is consistent
      across reconnects. Log entries have timestamp, step, and severity.

  - task_id: F-11
    priority: P3
    status: queued
    objective:
      wire ArtifactsView and DiffView to real backend data and activate Lineage, Cost, Plugins, and
      Admin views progressively via feature flags.
    dependency: F-10
    target:
      ArtifactsView and DiffView work on real data. Level-C views (Lineage, Cost, Plugins, Admin)
      are hidden by default and activatable by role or flag. No mock data in any active view.
  - task_id: WP-01A
    priority: P0
    status: queued
    objective: >-
      create `WorkbenchScreen` as the `/canvas` composition root and reduce `Canvas.tsx` to a thin
      route entry.
    dependency: none
    target: >-
      `/canvas` renders through `WorkbenchScreen` and `Canvas.tsx` stops orchestrating the whole
      surface directly.
  - task_id: WP-01B
    priority: P0
    status: queued
    objective: >-
      replace the current shell chrome with `WorkbenchHeader` and `WorkbenchNavRail` components with
      stable responsibilities.
    dependency: WP-01A
    target: >-
      header and nav responsibilities are explicit and route/navigation behavior is preserved.
  - task_id: WP-01C
    priority: P0
    status: queued
    objective: >-
      introduce `WorkbenchPanelsLayout` to own focus-mode and resizable panel composition.
    dependency: WP-01A
    target: >-
      layout logic moves behind one product component and panel rules stop being spread across
      shell/view files.
  - task_id: WP-01D
    priority: P1
    status: queued
    objective: >-
      create `CanvasWorkspace` and `WorkbenchCommandBar` backed by a mapped `WorkbenchScreenModel`
      instead of broad prop drilling.
    dependency: WP-01A, WP-01C
    target: >-
      the center workbench surface reads as one module and command actions remain wired for
      plan/run/layout/overlay behavior.
  - task_id: WP-01E
    priority: P1
    status: queued
    objective: >-
      productize `ExplorerPanel`, `InspectorSurface`, and `InspectorTabHost` while preserving plugin
      contracts.
    dependency: WP-01C, WP-01D
    target: >-
      explorer and inspector become explicit product surfaces and plugin tabs still render through
      existing registry contracts.
  - task_id: WP-01F
    priority: P0
    status: queued
    objective: >-
      add component-level tests and regression coverage around the new workbench product surface.
    dependency: WP-01B, WP-01C, WP-01D, WP-01E
    target: >-
      the new shell and workbench components have focused coverage and no route/plugin regression is
      introduced.

dependency_notes: |
  - `MVP-E1` depends on `MVP-A1` and `MVP-B1` so frontend assumptions map to verified backend truth.
  - F-01, F-02, F-04 are independent and can start in parallel.
  - `WP-01A`, `WP-01B`, and `WP-01C` are the canonical workbench composition sequence for the
    saved workbench-core product plan.
  - `F-01` remains a shell-cleanup task and must not be treated as the replacement for `WP-01`.
  - Any residual shell polish after `WP-01B` and `WP-01C` can be evaluated against `F-01` later.
  - F-03 depends on F-02.
  - F-05 depends on F-04.
  - F-06 depends on F-05.
  - F-07 depends on F-06.
  - F-08 depends on F-07 and is blocked until backend delivers POST /plans/preview and POST /runs.
  - F-09 depends on F-08 and is blocked until backend delivers GET /runs and GET /runs/:id.
  - F-10 depends on F-09 and is blocked until backend delivers GET /runs/:id/events.
  - F-11 depends on F-10 and requires artifact and lineage endpoints from backend.
  - F-08 through F-11 coordinate with Lane C (admission) and Lane D (scale/GTM) for API surface readiness.
