dependency_notes:
  - >-
    `MVP-E1` and `F-07` now define the frontend runtime contract baseline. No core-flow task should
    assume POST /runs for startRun until that baseline is written and aligned to the protected API
    route map.
  - >-
    `F-03` and `F-01` remain parallel shell-level slices; they improve operator experience but do
    not replace the contract, data-source, or state-boundary convergence chain.
  - >-
    `F-04`, `F-05`, `F-06`, and `F-12` form the architecture convergence chain for the existing
    frontend codebase. Later feature work should not bypass those boundaries with view-local data
    plumbing.
  - >-
    `F-08` through `F-11` remain contracts-first runtime delivery slices and should stay blocked
    until the frontend contract baseline and query or state convergence work are complete.
  - >-
    `F-02` has accepted evidence and establishes the first capability-module pattern for Lane E;
    `F-13` should keep the frontend docs aligned with that pattern as more slices land.
  - >-
    `F-14` can start once query and service boundaries are stable enough to lock a repeatable test
    lane into CI without codifying unstable view wiring.
