lane_id: B
title: Event Contract And Traceability
owner: Product / Architecture / Delivery / Docs
status: Active
last_reviewed: 2026-03-29
goal: Stabilize event payload versioning and lineage wiring.
expected_outcome:
  - event contracts are versioned
  - lineage ownership is explicit
  - failures are observable and replayable
tasks:
  - task_id: MVP-B1
    priority: P0
    status: in_progress
    objective:
      build a claim-to-evidence traceability matrix for backend MVP operability assertions
      (capability, proof source, and executable validation command).
    dependency: MVP-A1
    target:
      Every MVP claim in roadmap/docs maps to concrete code/test evidence and a command in the
      acceptance baseline (provisional closeout tracked in
      `docs/planning/reviews/20260330-mvp-b1-claim-evidence-traceability-matrix.md` pending MVP-A1
      acceptance).
  - task_id: S05
    priority: P0
    status: review
    objective:
      'S05-part-1 envelope boundary hardening: enforce payloadVersion and envelope-level
      write-boundary schema gating.'
    dependency: none
    target: Merge PR #623 and lock envelope boundary behavior.
  - task_id: S05-F1
    priority: P0
    status: done
    objective: add per-eventType payload-content schema validation at write boundary.
    dependency: S05
    target: Add payload schema map and AJV/runtime validation per eventType.
  - task_id: RC-B1
    priority: P1
    status: done
    objective: decouple lineage worker from adapter internals.
    dependency: none
    target: Wire lineage outbox dependency directly in the composition root.
  - task_id: RC-B2
    priority: P1
    status: done
    objective: replace lineage noop resolver with a real resolver.
    dependency: RC-B1
    target: SQL job facets enabled in production.
  - task_id: RC-B5
    priority: P1
    status: done
    objective:
      add exponential retry scheduling (next_attempt_at) to lineage outbox to pace retries and
      harden DLQ.
    dependency: none
    target: Retry pacing and DLQ hardening merged in mainline (0ac73b7).
  - task_id: RC-B5-F2
    priority: P1
    status: done
    objective:
      add real-Postgres integration tests for lineage claim-timeout and stale-claimer race
      semantics.
    dependency: RC-B5
    target:
      Real-Postgres integration coverage validates claim-timeout boundaries and stale-claimer
      interactions in lineage outbox claim fencing.
  - task_id: DLQ alerting + automated replay
    priority: P1
    status: queued
    objective: surface and reduce lineage backlogs.
    dependency: RC-B5
    target: Alerting and replay for lineage failures.
  - task_id: manifest S3 fetch cache
    priority: P2
    status: queued
    objective: reduce planner egress and build latency.
    dependency: none
    target: Cache manifest fetches.
  - task_id: ADP-LINT-ORDER-01
    priority: P2
    status: review
    objective:
      upgrade eslint import-order toolchain and remove workaround-only inline type alias patterns in
