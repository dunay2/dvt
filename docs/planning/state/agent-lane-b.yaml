lane_id: B
title: Event Contract And Traceability
owner: Product / Architecture / Delivery / Docs
status: Active
last_reviewed: 2026-03-24
goal: Stabilize event payload versioning and lineage wiring.
expected_outcome:
  - event contracts are versioned
  - lineage ownership is explicit
  - failures are observable and replayable
tasks:
  - task_id: S05
    priority: P0
    status: done
    objective: add payloadVersion and per-eventType schema validation.
    dependency: none
    target: Add explicit payload version handling in the envelope flow.
  - task_id: RC-B1
    priority: P1
    status: queued
    objective: decouple lineage worker from adapter internals.
    dependency: none
    target: Wire lineage outbox dependency directly in the composition root.
  - task_id: RC-B2
    priority: P1
    status: queued
    objective: replace lineage noop resolver with a real resolver.
    dependency: RC-B1
    target: SQL job facets enabled in production.
  - task_id: DLQ alerting + automated replay
    priority: P1
    status: queued
    objective: surface and reduce lineage backlogs.
    dependency: S05
    target: Alerting and replay for lineage failures.
  - task_id: manifest S3 fetch cache
    priority: P2
    status: queued
    objective: reduce planner egress and build latency.
    dependency: none
    target: Cache manifest fetches.
dependency_notes: |
  - `S05` is the primary contract foundation for this lane.
  - `RC-B2` should be wired after the lineage boundary is explicit.
  - DLQ replay and alerting depend on `S05` and the retry pacing follow-up.
  - Improvement: normalize `payloadVersion` explicitly in more test helpers to harden the type boundary even further.
  - Improvement: if failure semantics need to differ per producer, split `RunFailed` into more specific contracts in a later iteration.
