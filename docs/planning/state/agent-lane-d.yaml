lane_id: D
title: Scale And Go-To-Market
owner: Product / Architecture / Delivery / Docs
status: Active
last_reviewed: 2026-03-29
goal: Prepare the system for scale and for the first enterprise customer.
expected_outcome:
  - storage and read-path scale are bounded
  - snapshot correctness is preserved
  - GTM work is separated from code execution
header_markdown: |
  Eres Dana, lider de escala y GTM readiness. Tu foco es sostenibilidad operativa y riesgos residuales explicitamente gestionados.

  ## Principios obligatorios

  - Escala con limites: retencion, costos y crecimiento acotados
  - Correctitud de snapshot y storage por encima de throughput bruto
  - Riesgo explicito: lo diferido debe tener dueno y razon no-bloqueante
  - GTM desacoplado de cambios runtime de alto riesgo
  - Priorizar capacidad operativa antes de optimizacion prematura

  ## Forma de trabajo

  - Convertir riesgos en backlog ejecutable y medible
  - Definir criterios de cierre por capacidad (no solo actividad)
  - Mantener separacion entre roadmap comercial y hardening tecnico

  ## Restricciones

  - No introducir complejidad de escala sin evidencia de cuello real
  - No mezclar tareas P3 de negocio con bloqueantes del MVP
  - No cerrar riesgos sin evidencia de mitigacion verificable
tasks:
  - task_id: MVP-D1
    priority: P0
    status: in_progress
    objective:
      define the residual-risk baseline explicitly accepted after MVP backend operability reset,
      including what is deferred and why it does not block MVP.
    dependency: MVP-A1, MVP-B1
    target:
      Provisional residual-risk baseline published with explicit deferred items, lane ownership, and
      non-blocking rationale for MVP control-plane operation; final lock pending MVP-A1 and MVP-B1
      evidence.
  - task_id: run event log retention + TTL
    priority: P1
    status: in_progress
    objective: bound storage growth and automate archival.
    dependency: none
    target: Retention and archival automation.
  - task_id: G5-PR2
    priority: P1
    status: queued
    objective: add deferred deletion and restore flow for archived events.
    dependency: none
    target: Restore + grace delete worker.
  - task_id: S15
    priority: P1
    status: done
    objective:
      add monotonic CAS guard on run_snapshots.last_run_seq upsert to prevent snapshot regression
      under concurrency.
    dependency: none
    target: persistWithClient upsert guard.
  - task_id: S15-F1
    priority: P1
    status: done
    objective:
      surface CAS no-op outcome for stale snapshot writes so repair callers can observe discard.
    dependency: S15
    target: Return or emit stale-write conflict result.
  - task_id: S14
    priority: P1
    status: done
    objective: preserve gateway evaluation context across `continueAsNew` segments.
    dependency: none
    target: Workflow state handoff hardening.
  - task_id: cost attribution model
    priority: P2
    status: queued
    objective: support billing and finance reporting.
    dependency: S05, S02, retention
    target: Usage accounting and finance visibility.
  - task_id: run_events partitioning
    priority: P2
    status: queued
    objective: reduce storage and write-path pressure.
    dependency: none
    target: Partitioned event log storage.
  - task_id: read replica query path
    priority: P2
    status: queued
    objective: offload read traffic from primary.
    dependency: run_events partitioning
    target: Read scaling path.
  - task_id: projector event-driven invalidation
    priority: P2
    status: queued
    objective: remove polling bottlenecks.
    dependency: read-your-writes contract
    target: Event-driven projection cache invalidation.
  - task_id: Temporal -> API backpressure
    priority: P2
    status: queued
    objective: protect admission under saturation.
    dependency: projector event-driven invalidation
    target: Backpressure propagation.
  - task_id: first enterprise pilot
    priority: P3
    status: queued
    objective: validate product-market fit.
    dependency: SLOs and RBAC
    target: First customer validation.
  - task_id: billing integration
    priority: P3
    status: queued
    objective: turn usage into invoicing.
    dependency: first enterprise pilot
