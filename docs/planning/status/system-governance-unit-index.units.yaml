  - id: SYS-CI-PLANNING-DB-RUNTIME
    name: Local Planning Query Store runtime
    parent: SYS-CI-GOVERNANCE-ROOT
    level: component
    status: review
    ownedConcern: >-
      Own the durable local Planning Query Store Docker lifecycle and configuration through the
      existing canonical executor, preserving the configured data and explicit reset separation.
    responsibilities:
      - >-
        Configure the fixed Compose project/container, image and persistent bind through the
        existing argument and environment builders.
      - >-
        Start and inspect the shared runtime through existing bounded startup/readiness paths and
        process supervision.
    nonGoals:
      - >-
        No governance import, projection rebuild, schema migration, task authority or implicit data
        reset.
      - >-
        Immediate shutdown remains an explicitly reviewed emergency operation; init supervision is
        not proof of the original crash cause.
    reasonsToChange:
      - Local runtime lifecycle, canonical Compose configuration or preservation guarantees change.
    owns:
      - scripts/planning-db-run.cjs
      - scripts/planning-db-run.test.cjs
      - infra/planning-db/docker-compose.yml
    excludes: []
    childrenRequired: false
    dddOwner: PlanningQueryStoreRuntime
    cqRails: StartPlanningQueryStoreRuntime;InspectPlanningQueryStoreRuntime
    publicApi:
      - >-
        runPlanningDbUp; runPlanningDbHealth; waitForPlanningDbReady; buildComposeArgs; buildPgEnv;
        explicit planResetDataDir/resetPlanningDb separation
    invariants:
      - >-
        Starting retains the fixed Compose project/container and configured persistent bind; startup
        never authorizes reset, governance import or schema rebuild.
      - >-
        Canonical Compose supervises PostgreSQL under init while image, environment, ports and
        healthcheck remain operator-explicit.
    transitions:
      - >-
        The existing up/readiness paths move unavailable or stopped to starting and healthy only
        through bounded successful results; errors remain failures.
    consumers:
      - >-
        Local operators and existing Planning DB query, write and CI commands consume this shared
        local PostgreSQL runtime.
    governance:
      - https://github.com/dunay2/dvt/issues/3751#issuecomment-6512414690
    fowlerSignals: []
