  - id: SYS-WEB-CHROMIUM-DIAGNOSTICS
    name: Owned Chromium diagnostics
    parent: SYS-WEB-ROOT
    level: component
    status: review
    ownedConcern: >-
      Own the opt-in Chromium capture lease, bounded owned Linux observation and safe evidence
      projection without owning browser proof acceptance.
    responsibilities:
      - >-
        Own current-launch capture identity, private failed-spec observations, native-completion
        reconciliation and exact cleanup.
      - >-
        Observe only owned Linux process lifetimes, bounded signal and OOM evidence through proven
        capabilities and await actual retirement.
      - >-
        Project only allowlisted network, process and validation-code metadata while preserving
        unavailable, incomplete and uncertain outcomes.
    nonGoals:
      - >-
        Product behavior, provider/auth policy, new browser rail, retry, timeout or assertion
        relaxation.
      - >-
        Owning the external runner, Cypress configuration, browser router or changed-slice planner
        merely because they call diagnostics.
    reasonsToChange:
      - Capture ownership, completion, reconciliation or cleanup rules change.
      - >-
        Kernel protocols, process identity, capability admission, deadlines or owned-resource
        retirement change.
      - Disclosure schema, strict input validation or correlation uncertainty changes.
    owns:
      - apps/web/cypress/node/chromiumNetworkDiagnostics.ts
      - apps/web/cypress/node/chromiumNetworkEvidence.ts
      - apps/web/cypress/node/chromiumNetworkProjection.ts
      - apps/web/cypress/node/chromiumProcessObserver.ts
      - apps/web/cypress/node/linuxChromiumProcessObserver.py
      - apps/web/cypress/node/linuxChromiumProcessProtocol.py
      - apps/web/cypress/node/linuxChromiumSignalTrace.py
      - apps/web/cypress/node/linuxChromiumOomJournal.py
      - scripts/chromium-network-diagnostics.test.cjs
      - scripts/chromium-network-projection.test.cjs
      - scripts/chromium-process-observer.test.cjs
      - scripts/chromium-process-protocol.test.cjs
      - scripts/chromium-process-protocol.test.py
      - scripts/chromium-signal-trace.test.py
      - scripts/chromium-oom-journal.test.py
    excludes: []
    childrenRequired: false
    dddOwner: Web / Cypress diagnostics
    cqRails: RunWebCypressNative
    publicApi:
      - withChromiumNetworkDiagnostics
      - configureChromiumNetworkDiagnostics
      - stageChromiumObservation
      - finalizeChromiumCapture
      - projectChromiumNetworkCapture
      - projectChromiumProcessLog
      - startChromiumProcessObserver
    invariants:
      - >-
        The existing proof result and strict exact-spec acceptance remain authoritative; observation
        cannot fabricate success.
      - >-
        Only exact owned launch identities and resources may be observed or retired; unavailable
        capability rejects explicitly.
      - >-
        Readiness is bounded to 20 seconds, normal EOF to 10 seconds, then existing TERM 5 seconds
        and KILL 5 seconds; retain actual completion and cleanup outcomes.
      - >-
        Privileged group retirement duplicates the controller-held open file description with actual
        pidfd_getfd, never /proc FD reopening. Require the real libc wrapper, ptrace duplication
        capability and kernel pidfd GROUP support from Linux 6.9 in the native probe; otherwise
        deny. No unrelated process signal or global tracing change.
      - >-
        No raw log, arbitrary exception, URL, process payload, command line, credential or private
        raw receipt is published as complete evidence.
    transitions:
      - >-
        Admitted existing operation produces actual completion or an explicit failed, unavailable or
        incomplete result.
    consumers:
      - Existing native browser proof adapters; external ownership and acceptance remain explicit.
