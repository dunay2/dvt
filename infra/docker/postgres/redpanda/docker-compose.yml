version: '3.9'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dvt
      POSTGRES_PASSWORD: dvt
      POSTGRES_DB: dvt
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://localhost:9092
    ports: ['9092:9092']
volumes:
  pgdata:
