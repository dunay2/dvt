# Railway and root-context Nixpacks deployments use this file automatically.
# Keep this aligned with apps/api/nixpacks.toml.
[phases.setup]
nixPkgs = ["nodejs_22", "pnpm"]

[phases.install]
cmds = ["corepack enable", "pnpm install --frozen-lockfile --filter dvt-api..."]

[phases.build]
cmds = ["pnpm --filter dvt-api build"]

[start]
cmd = "pnpm --filter dvt-api start"
