name: Traceability Governance
on: [pull_request]

jobs:
  traceability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install
        run: pnpm i --frozen-lockfile

      - name: Build traceability service
        run: pnpm -C packages/@dvt/traceability-service build

      - name: Validate and build traceability manifest
        run: >-
          pnpm -C packages/@dvt/traceability-service trace validate-and-build-manifest --config
          ./traceability.config.json --repoRoot . --component "@dvt/contracts" --componentVersion
          "1.0.0" --repoSha "${{ github.sha }}"
