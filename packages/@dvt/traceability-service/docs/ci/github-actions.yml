name: Traceability Governance
on: [pull_request]

jobs:
  traceability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install
        run: pnpm i --frozen-lockfile

      - name: Build traceability service
        run: pnpm -C packages/@dvt/traceability-service build

      - name: Validate and publish traceability
        run:
          pnpm -C packages/@dvt/traceability-service trace validate-and-publish --config
          ./traceability.config.json --repoRoot . --component "@dvt/contracts" --componentVersion
          "1.0.0" --repoSha "${{ github.sha }}" --moduleName "@dvt/contracts" --modulePath
          "packages/@dvt/contracts"
        env:
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USER: ${{ secrets.NEO4J_USER }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
