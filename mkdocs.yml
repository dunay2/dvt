site_name: DVT Documentation
site_description: Canonical documentation structure (baseline)
repo_url: https://github.com/dunay2/dvt
docs_dir: docs

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: indigo
      accent: indigo

markdown_extensions:
  - admonition
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Home: index.md
  - Concepts:
      - Concepts Index: concepts/index.md
      - Glossary: concepts/glossary.md
      - Domain Language: concepts/domain-language.md
      - System Map: concepts/system-map.md
      - Repository Map: concepts/repository-map.md
  - Reference:
      - Architecture Index: architecture/index.md
      - Contracts Index: contracts/index.md
      - Planner Contracts: contracts/planner/index.md
      - Shared Contracts: contracts/shared/index.md
      - Traceability Contracts: contracts/traceability/index.md
      - Engine Contracts: contracts/engine/index.md
      - Shared Packages:
          - Shared Packages Index: architecture/shared/index.md
          - CLI Package: architecture/shared/cli.md
          - Gateway DSL Package: architecture/shared/dsl.md
          - Plan Interpreter Package: architecture/shared/plan-interpreter.md
          - Crypto Package: architecture/shared/crypto.md
      - Frontend Architecture: architecture/frontend/index.md
      - Infra Architecture: architecture/infra/index.md
      - Engine Architecture: architecture/engine/index.md
      - Atlas: architecture/atlas/index.md
      - Reference Architecture: architecture/reference-architecture.md
  - How-To:
      - Guides Index: guides/index.md
      - Mandatory AI Workflow: guides/ai-work-protocol.md
  - Operations:
      - Runbooks: runbooks/index.md
      - Risk Register: risk-register/index.md
      - Evidence: evidence/index.md
  - Decisions:
      - ADR Index: adr/index.md
      - Draft ADRs: adr/_drafts/index.md
      - ADR Archive: adr/_archive/index.md
  - Planning:
      - Planning Index: planning/index.md
      - Roadmap Of Record: planning/roadmap/index.md
      - Current Status: architecture/system-delivery-status.md
      - Gap Tracking: planning/gaps/index.md
      - Gap Execution Plans: planning/gaps/GAP_EXECUTION_PLANS.md
      - G6 OpenLineage Gap: planning/gaps/g6/index.md
      - Proposals: planning/proposals/index.md
      - Reviews: planning/reviews/index.md
      - Status: planning/status/index.md
      - Execution Model: planning/execution-model/index.md
      - Planning Templates: planning/templates/index.md
  - Archive: archive/index.md

extra:
  language: en
