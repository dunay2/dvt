site_name: DVT Documentation
site_description: Documentation site for DVT (engine, contracts, runbooks)
repo_url: https://github.com/dunay2/dvt
theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
markdown_extensions:
  - admonition
  - toc:
      permalink: true
plugins:
  - search
nav:
  - Home: index.md
extra:
  language: en
