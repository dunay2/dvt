# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Prepare planning DB
description: Start, migrate, and optionally import DB-first governance projections for CI gates

inputs:
  import-governance:
    description: Import governance and command/query projections after migration
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Prepare planning DB
      shell: bash
      env:
        IMPORT_GOVERNANCE: ${{ inputs.import-governance }}
      run: |
        set -euo pipefail

        export DVT_PLANNING_DB_DATA_DIR="${RUNNER_TEMP}/dvt-planning-db/postgres-data"
        pnpm planning:db:up
        for attempt in {1..30}; do
          if pnpm planning:db:health; then
            break
          fi
          if [[ "$attempt" == "30" ]]; then
            echo "planning DB did not become healthy in time" >&2
            exit 1
          fi
          sleep 2
        done

        pnpm planning:db:migrate
        if [[ "${IMPORT_GOVERNANCE}" == "true" ]]; then
          pnpm planning:db:import -- --if-stale
        fi
