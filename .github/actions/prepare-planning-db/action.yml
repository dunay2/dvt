# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Prepare planning DB
description: Start and rebuild the current Planning DB state for CI gates

runs:
  using: composite
  steps:
    - name: Prepare planning DB
      shell: bash
      run: |
        set -euo pipefail

        export DVT_PLANNING_DB_DATA_DIR="${RUNNER_TEMP}/dvt-planning-db/postgres-data"
        pnpm planning:db:up
        for attempt in {1..30}; do
          if pnpm planning:db:health; then
            break
          fi
          if [[ "$attempt" == "30" ]]; then
            echo "planning DB did not become healthy in time" >&2
            exit 1
          fi
          sleep 2
        done

        node scripts/planning-db-schema.cjs
        pnpm planning:db:import
