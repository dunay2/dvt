name: Setup Node + pnpm + cache + install
description: Reusable setup for Node.js, pnpm, pnpm store cache, and dependency install

inputs:
  node-version:
    description: Node.js version to install
    required: false
    default: '22'
  install-args:
    description: Arguments passed to pnpm install
    required: false
    default: '--frozen-lockfile'

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
      with:
        node-version: ${{ inputs.node-version }}

    - name: Setup pnpm
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

    - name: Get pnpm store path
      id: pnpm-store-path
      shell: bash
      run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    - name: Cache pnpm store
      uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
      with:
        path: ${{ env.STORE_PATH }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-

    - name: Cache node_modules
      id: nm-cache
      uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
          packages/@dvt/*/node_modules
        key: nm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

    - name: Install dependencies
      if: steps.nm-cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm install ${{ inputs.install-args }}
