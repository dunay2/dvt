# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Setup Node + pnpm + install
description: Reusable setup for Node.js, pnpm, pnpm store cache, Turbo cache, and dependency install

inputs:
  node-version:
    description: Node.js version to install
    required: false
    default: '22'
  install-args:
    description: Arguments passed to pnpm install
    required: false
    default: '--frozen-lockfile --prefer-offline'
  turbo-cache-variant:
    description: Stable identity for parallel variants of the same producing job
    required: false
    default: 'default'

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Setup pnpm
      uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

    - name: Get pnpm store path
      id: pnpm-store-path
      shell: bash
      run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    - name: Cache pnpm store
      uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
      with:
        path: ${{ env.STORE_PATH }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-

    - name: Cache Turbo
      uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
      with:
        path: .turbo
        key: >-
          turbo-v2-${{ runner.os }}-${{ github.workflow }}-${{ github.job }}-${{
          inputs.turbo-cache-variant }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json',
          'pnpm-workspace.yaml', 'tsconfig.node-runtime.base.json',
          'tsconfig.package-bundler.base.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          turbo-v2-${{ runner.os }}-${{ github.workflow }}-${{ github.job }}-${{ inputs.turbo-cache-variant }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'pnpm-workspace.yaml', 'tsconfig.node-runtime.base.json', 'tsconfig.package-bundler.base.json') }}-

    - name: Install dependencies
      shell: bash
      run: pnpm install ${{ inputs.install-args }}
