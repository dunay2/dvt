name: Isolated retirement target correction
on:
  push:
    branches: [automation/3004-3314-review-fix-20260919]
    paths: [.github/workflows/retirement-3314-review-fix.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GIT_BASE: f9ecdfbccf031a9db2bd0dca8660cad75d4c5bc0
      GIT_HEAD: HEAD
      REVIEW_HEAD: 05368b59b10407789b13ef4fa4676cd86bf47bc8
      PLANNING_DB_INTEGRITY_SCOPE: bootstrap
    steps:
      - name: Read pinned preparation only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4ba97f6461d423a96e1f0938f8f5b0ef96ebffbd
          persist-credentials: false
      - name: Isolate preparation outside the product tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/review-3314"
          cp .github/maintenance/3314-retirement-target-fix.py "$RUNNER_TEMP/3314-retirement-target-fix.py"
          sha256sum "$RUNNER_TEMP/3314-retirement-target-fix.py" > "$RUNNER_TEMP/review-3314/preparation-sha256.txt"
      - name: Checkout the exact reviewed PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 05368b59b10407789b13ef4fa4676cd86bf47bc8
          fetch-depth: 0
          persist-credentials: true
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 22.x
      - name: Reproduce P2 and correct the existing target and guard
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/3314-retirement-target-fix.py" | tee "$RUNNER_TEMP/review-3314/preparation.log"
          git diff --check
          git diff --binary > "$RUNNER_TEMP/review-3314/pre-hook.patch"
      - name: Commit using the repository helper and enabled hooks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DVT documentation maintenance"
          git config user.email "34416258+dunay2@users.noreply.github.com"
          git switch -c review/3314-retirement-target-correction
          git add -- docs/planning/proposals/mandatory/frontend-and-ux/archive-candidates/index.md tools/ci/docs-disposition-canon.test.mjs
          pnpm commit docs docs "Reconcile retirement candidate instructions" 2>&1 | tee "$RUNNER_TEMP/review-3314/commit.log"
          git rev-parse HEAD > "$RUNNER_TEMP/review-3314/head.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/review-3314/tree.txt"
      - name: Prepare the standard disposable CI database from committed sources
        uses: ./.github/actions/prepare-planning-db
      - name: Refresh and validate the complete corrected candidate
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/review-3314"
          pnpm docs:sync 2>&1 | tee "$out/docs-sync.log"
          pnpm governance:refresh 2>&1 | tee "$out/governance-refresh.log"
          git diff --exit-code HEAD
          test -z "$(git status --porcelain)"
          node --test scripts/check-feature-mechanization.test.cjs scripts/documentation-publication.test.cjs scripts/planning-db-surface-inventory-check.test.cjs tools/ci/docs-disposition-canon.test.mjs tools/ci/startup-card-canon.test.mjs tools/ci/planner-package-governance.test.mjs tools/ci/architecture-doc-reconciliation-canon.test.mjs scripts/governance-refresh.test.cjs tools/ci/emit-test-matrix.test.mjs tools/ci/turbo-workspace-task-contract.test.mjs 2>&1 | tee "$out/tests.log"
          node tools/ci/arc-check.mjs > "$out/arc.json"
          pnpm docs:sync:check 2>&1 | tee "$out/sync-check.log"
          pnpm docs:gov:manifest:check 2>&1 | tee "$out/manifest-check.log"
          pnpm ci:docs 2>&1 | tee "$out/ci-docs.log"
          pnpm verify:prepush 2>&1 | tee "$out/prepush.log"
          pnpm pr:validate-title "docs(docs): Retire obsolete contract and CI journals" 2>&1 | tee "$out/title.log"
          git diff --exit-code HEAD
          test -z "$(git status --porcelain)"
          git diff --exit-code "$GIT_BASE" HEAD -- apps packages specs scripts .github .arc-policy.yaml AGENTS.md CLAUDE.md docs/architecture docs/contracts docs/adr docs/evidence docs/risk-register docs/runbooks buzon
      - name: Repeat the full retirement and reference controls
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,json,pathlib,subprocess
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'review-3314';base=os.environ['GIT_BASE'];old=os.environ['REVIEW_HEAD']
          def git(*args):return subprocess.check_output(['git',*args])
          removed=git('diff','--name-only','--diff-filter=D',base,'HEAD').decode().splitlines()
          assert len(removed)==27
          assert removed==git('diff','--name-only','--diff-filter=D',base,old).decode().splitlines()
          modified=git('diff','--name-only','--diff-filter=M',base,'HEAD').decode().splitlines()
          assert set(modified)=={'docs/planning/proposals/mandatory/frontend-and-ux/index.md','docs/planning/proposals/mandatory/frontend-and-ux/archive-candidates/index.md','tools/ci/docs-disposition-canon.test.mjs'}
          assert not git('diff','--name-only','--diff-filter=A',base,'HEAD').strip()
          command=['node','--test','tools/ci/docs-disposition-canon.test.mjs'];results=[]
          def run(name,code):
            p=subprocess.run(command,capture_output=True,text=True)
            (out/(name+'.log')).write_text(p.stdout+p.stderr)
            results.append({'name':name,'exit':p.returncode,'expected':code})
            assert p.returncode==code,(name,p.stdout,p.stderr)
          for i,n in enumerate(removed,1):
            path=pathlib.Path(n);path.parent.mkdir(parents=True,exist_ok=True)
            try:path.write_bytes(git('show',base+':'+n));run('restore-'+str(i),1)
            finally:
              path.unlink(missing_ok=True)
              if n.endswith('/superseded/index.md'):path.parent.rmdir()
          path=pathlib.Path('AGENTS.md');saved=path.read_bytes();n=removed[0]
          try:
            for name,url,code in [('relative',n,1),('main','https://github.com/dunay2/dvt/blob/main/'+n,1),('pinned','https://github.com/dunay2/dvt/blob/'+base+'/'+n,0)]:
              path.write_bytes(saved+('\n[Reference]('+url+')\n').encode());run('reference-'+name,code)
          finally:path.write_bytes(saved)
          run('final-guard',0)
          (out/'restoration-results.json').write_text(json.dumps(results,indent=2)+'\n')
          (out/'removed.json').write_text(json.dumps(removed,indent=2)+'\n')
          for name,args in {'candidate.patch':['diff','--binary',base,'HEAD'],'review-fix.patch':['diff','--binary',old,'HEAD'],'stats.txt':['diff','--stat',base,'HEAD'],'numstat.txt':['diff','--numstat',base,'HEAD'],'name-status.txt':['diff','--name-status',base,'HEAD'],'head-files.txt':['ls-tree','-rz','HEAD'],'commit.txt':['cat-file','commit','HEAD'],'validated.txt':['rev-parse','HEAD']}.items():(out/name).write_bytes(git(*args))
          assert not git('diff','--name-only').strip()
          PY
          git archive --format=tar HEAD | gzip -n > "$RUNNER_TEMP/review-3314/source.tar.gz"
      - name: Publish only validated objects to the isolated validation branch
        shell: bash
        run: |
          set -euo pipefail
          target=refs/heads/validation/3004-3314-retirement-target-20260919
          test -z "$(git ls-remote origin "$target")"
          git push origin "HEAD:$target" 2>&1 | tee "$RUNNER_TEMP/review-3314/push.log"
      - name: Preserve checksums and failed-attempt evidence
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'review-3314';out.mkdir(exist_ok=True)
          (out/'final-status.txt').write_text(subprocess.run(['git','status','--porcelain'],capture_output=True,text=True).stdout)
          checksums={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(out.iterdir()) if p.is_file() and p.name!='checksums.json'}
          (out/'checksums.json').write_text(json.dumps(checksums,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: retirement-3314-review-correction
          path: ${{ runner.temp }}/review-3314
          retention-days: 7
          if-no-files-found: error
