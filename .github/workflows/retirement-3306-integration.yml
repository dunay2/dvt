name: Isolated journal retirement integration validation
on:
  push:
    branches: [automation/3004-3306-integration-20260919]
    paths: [.github/workflows/retirement-3306-integration.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GIT_BASE: 8c8f8cf31b141591da311664b4c1f3067ebfdd87
      GIT_HEAD: HEAD
      ORIGINAL_HEAD: 8eec0a7503493e82275b28fe74971d3efd132afd
      ORIGINAL_BASE: b1778255afcc6392e54b887c79660005ed8754ad
      PLANNING_DB_INTEGRITY_SCOPE: bootstrap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8c8f8cf31b141591da311664b4c1f3067ebfdd87
          fetch-depth: 0
          persist-credentials: true
      - name: Combine the existing retirement with exact current main
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/journal-review"
          git config user.name "DVT documentation maintenance"
          git config user.email "34416258+dunay2@users.noreply.github.com"
          test "$(git rev-parse HEAD)" = "$GIT_BASE"
          test "$(git merge-base HEAD "$ORIGINAL_HEAD")" = "$ORIGINAL_BASE"
          git switch -c review/3004-journals-current-main
          git merge --no-ff --no-commit "$ORIGINAL_HEAD"
          python - <<'PY'
          import json,os,pathlib,subprocess
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'journal-review'
          base=os.environ['GIT_BASE'];oldbase=os.environ['ORIGINAL_BASE'];oldhead=os.environ['ORIGINAL_HEAD']
          def git(*a):return subprocess.check_output(['git',*a])
          removed=git('diff','--name-only','--diff-filter=D',oldbase,oldhead).decode().splitlines()
          guard='tools/ci/docs-disposition-canon.test.mjs'
          assert len(removed)==25 and all(n.startswith('docs/planning/closeouts/') and n.endswith('.md') for n in removed)
          assert set(git('diff','--cached','--name-only').decode().splitlines())==set(removed)|{guard}
          assert git('show',base+':'+guard)==git('show',oldbase+':'+guard)
          assert pathlib.Path(guard).read_bytes()==git('show',oldhead+':'+guard)
          for n in removed:
            assert git('show',base+':'+n)==git('show',oldbase+':'+n),n
            assert not pathlib.Path(n).exists(),n
          (out/'removed.json').write_text(json.dumps(removed,indent=2)+'\n')
          (out/'base.txt').write_text(base+'\n')
          (out/'base-tree.txt').write_bytes(git('rev-parse',base+'^{tree}'))
          (out/'base-files.txt').write_bytes(git('ls-tree','-rz',base))
          (out/'upstream-changes.txt').write_bytes(git('diff','--name-status',oldbase,base))
          PY
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 22.x
      - name: Recheck every restoration and live reference against the combined tree
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib,subprocess
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'journal-review'
          removed=json.loads((out/'removed.json').read_text());base=os.environ['GIT_BASE']
          guard='tools/ci/docs-disposition-canon.test.mjs'
          command=['node','--test',guard];results=[]
          def run(name,expected):
            p=subprocess.run(command,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
            (out/(name+'.log')).write_text(p.stdout)
            results.append({'name':name,'command':command,'exitCode':p.returncode,'expected':expected})
            assert p.returncode==expected,(name,p.stdout)
            if expected==0:assert '# fail 0' in p.stdout and '# skipped 0' in p.stdout
            else:assert '# fail 1' in p.stdout
          run('guard-green-before',0)
          for i,n in enumerate(removed,1):
            path=pathlib.Path(n);original=subprocess.check_output(['git','show',base+':'+n])
            try:
              path.write_bytes(original);run('restore-'+str(i),1)
            finally:path.unlink(missing_ok=True)
          path=pathlib.Path('AGENTS.md');saved=path.read_bytes();target=removed[0]
          controls=[('relative',f'\n[obsolete]({target})\n',1),('main',f'\n[obsolete](https://github.com/dunay2/dvt/blob/main/{target})\n',1),('pinned',f'\n[historical](https://github.com/dunay2/dvt/blob/{base}/{target})\n',0)]
          try:
            for name,extra,expected in controls:
              path.write_bytes(saved+extra.encode());run('reference-'+name,expected)
          finally:path.write_bytes(saved)
          run('guard-green-after',0)
          (out/'mutation-results.json').write_text(json.dumps(results,indent=2)+'\n')
          PY
          git diff --exit-code
      - name: Commit through the repository helper with hooks enabled
        shell: bash
        run: |
          set -euo pipefail
          pnpm commit docs docs "Reconcile journal retirement with current main" 2>&1 | tee "$RUNNER_TEMP/journal-review/commit.log"
          git merge-base --is-ancestor "$ORIGINAL_HEAD" HEAD
          git merge-base --is-ancestor "$GIT_BASE" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/journal-review/head.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/journal-review/tree.txt"
      - name: Bootstrap only the disposable CI database from the committed candidate
        uses: ./.github/actions/prepare-planning-db
      - name: Refresh and validate the actual candidate
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/journal-review"
          pnpm docs:sync 2>&1 | tee "$out/docs-sync.log"
          pnpm governance:refresh 2>&1 | tee "$out/governance-refresh.log"
          git diff --exit-code HEAD
          test -z "$(git status --porcelain)"
          node --test scripts/check-feature-mechanization.test.cjs scripts/documentation-publication.test.cjs scripts/planning-db-surface-inventory-check.test.cjs tools/ci/docs-disposition-canon.test.mjs tools/ci/startup-card-canon.test.mjs tools/ci/planner-package-governance.test.mjs tools/ci/architecture-doc-reconciliation-canon.test.mjs scripts/governance-refresh.test.cjs tools/ci/emit-test-matrix.test.mjs tools/ci/turbo-workspace-task-contract.test.mjs 2>&1 | tee "$out/tests.log"
          node tools/ci/arc-check.mjs > "$out/arc.json"
          pnpm docs:sync:check 2>&1 | tee "$out/sync-check.log"
          pnpm docs:gov:manifest:check 2>&1 | tee "$out/manifest-check.log"
          pnpm ci:docs 2>&1 | tee "$out/ci-docs.log"
          pnpm verify:prepush 2>&1 | tee "$out/prepush.log"
          pnpm pr:validate-title "docs(docs): Retire obsolete HTTP Canvas and planning journals" 2>&1 | tee "$out/title.log"
          git diff --exit-code HEAD
          test -z "$(git status --porcelain)"
          git diff --exit-code "$GIT_BASE" HEAD -- apps packages specs scripts .github .arc-policy.yaml AGENTS.md CLAUDE.md docs/architecture docs/contracts docs/adr docs/evidence docs/risk-register docs/runbooks docs/planning/proposals buzon
          python - <<'PY'
          import json,os,pathlib,subprocess
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'journal-review';removed=json.loads((out/'removed.json').read_text())
          base=os.environ['GIT_BASE'];guard='tools/ci/docs-disposition-canon.test.mjs'
          def git(*a):return subprocess.check_output(['git',*a])
          assert set(git('diff','--name-only',base,'HEAD').decode().splitlines())==set(removed)|{guard}
          assert set(git('diff','--name-only','--diff-filter=D',base,'HEAD').decode().splitlines())==set(removed)
          for n,params in {'candidate.patch':['diff','--binary',base,'HEAD'],'stats.txt':['diff','--stat',base,'HEAD'],'name-status.txt':['diff','--name-status',base,'HEAD'],'head-files.txt':['ls-tree','-rz','HEAD'],'validated.txt':['rev-parse','HEAD'],'commit.txt':['cat-file','commit','HEAD']}.items():(out/n).write_bytes(git(*params))
          PY
          git archive --format=tar HEAD | gzip -n > "$out/source.tar.gz"
      - name: Publish validated objects without changing the PR or main
        shell: bash
        run: |
          set -euo pipefail
          target=refs/heads/validation/3004-3306-current-main-20260919
          test -z "$(git ls-remote origin "$target")"
          git push origin "HEAD:$target" 2>&1 | tee "$RUNNER_TEMP/journal-review/push.log"
      - name: Preserve verification and failure evidence
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'journal-review';out.mkdir(exist_ok=True)
          (out/'final-status.txt').write_text(subprocess.run(['git','status','--porcelain'],capture_output=True,text=True).stdout)
          sums={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(out.iterdir()) if p.is_file() and p.name!='checksums.json'}
          (out/'checksums.json').write_text(json.dumps(sums,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: journal-retirement-current-main-validation
          path: ${{ runner.temp }}/journal-review
          retention-days: 7
          if-no-files-found: error
