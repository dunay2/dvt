name: Isolated ARC 2878 review correction
on:
  push:
    branches: [automation/2878-arc-review-20260917]
    paths: [.github/workflows/arc-2878-review.yml]
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GIT_BASE: 8396e9a06c6ee10a66ec6734be00b00a3ebae2bb
      GIT_HEAD: HEAD
      PLANNING_DB_INTEGRITY_SCOPE: bootstrap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f04fe4d7ef534e012c4445b8c9edf9f37f95936c
          fetch-depth: 0
          persist-credentials: true
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 22.x
      - uses: ./.github/actions/prepare-planning-db
      - name: Prove and correct the two review findings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/arc2878-review"
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'arc2878-review'
          agents=pathlib.Path('AGENTS.md')
          tests=pathlib.Path('tools/ci/arc-policy-state-store.test.mjs')
          def blob(b): return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()=='f04fe4d7ef534e012c4445b8c9edf9f37f95936c'
          assert blob(agents.read_bytes())=='71131c7e75cd7dbd3069089d600e1bbe9f130abb'
          assert blob(tests.read_bytes())=='678be2614dbd885ec1d1b81ff1d1ead21bd14c18'
          source=tests.read_text()
          needle="  const agents = readFileSync('AGENTS.md', 'utf8');\n"
          assert source.count(needle)==1
          addition="""  const followingSection = agents.split('## ARC-0 Fast Path\\n')[1]?.split('\\n## ')[1];
            assert.ok(
              followingSection?.startsWith('ARC Artifacts When Required\\n'),
              'ARC artifacts must immediately follow ARC-0'
            );
            assert.ok(agents.includes('A routed skip does not prove that required artifacts are present.'));
          """
          tests.write_text(source.replace(needle,needle+addition))
          command=['node','--test',str(tests)]
          red=subprocess.run(command,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
          (out/'red.log').write_text(red.stdout); print(red.stdout)
          assert red.returncode==1 and 'ARC artifacts must immediately follow ARC-0' in red.stdout
          assert '# pass 17' in red.stdout and '# fail 1' in red.stdout
          text=agents.read_text()
          a=text.index('## ARC Artifacts When Required\n'); b=text.index('## PR Rules\n',a)
          block=text[a:b]
          block=block.replace('validates its documentation obligations','checks routed evidence/risk obligations')
          old='   satisfy the required PR gates. Missing required evidence or risk fails the\n   `ARC docs / evidence validate` step; do not skip or relax it.\n'
          assert block.count(old)==1
          block=block.replace(old,'   satisfy the required PR gates, including `ARC docs / evidence validate` for\n   its routed scope. Do not disable or relax required checks.\n\nA routed skip does not prove that required artifacts are present.\n')
          text=text[:a]+text[b:]
          anchor='## No Debt And No Stub Policy\n'
          assert text.count(anchor)==1
          agents.write_text(text.replace(anchor,block+anchor))
          green=subprocess.run(command,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
          (out/'green.log').write_text(green.stdout);print(green.stdout)
          assert green.returncode==0
          PY
      - name: Refresh and commit the correction through the existing helper
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/arc2878-review"
          pnpm docs:sync 2>&1 | tee "$out/docs-sync.log"
          pnpm governance:refresh 2>&1 | tee "$out/governance-refresh.log"
          git diff --exit-code -- .arc-policy.yaml tools/ci/arc-check.mjs tools/ci/doc-check.mjs CLAUDE.md
          python - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed <= {'AGENTS.md','tools/ci/arc-policy-state-store.test.mjs','docs/.manifest.json'},changed
          PY
          git config user.name "DVT governance maintenance"
          git config user.email "34416258+dunay2@users.noreply.github.com"
          git switch -c docs/2878-arc-guidance
          git add AGENTS.md tools/ci/arc-policy-state-store.test.mjs docs/.manifest.json
          pnpm commit docs docs "Align ARC guidance with routed validation" 2>&1 | tee "$out/commit.log"
          git rev-parse HEAD > "$out/head.txt"
          git rev-parse HEAD^{tree} > "$out/tree.txt"
      - name: Validate the complete final candidate
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/arc2878-review"
          node --test tools/ci/arc-policy-state-store.test.mjs tools/ci/ci-tool-test-suite.test.mjs tools/ci/startup-card-canon.test.mjs 2>&1 | tee "$out/tests.log"
          node tools/ci/arc-check.mjs > "$out/arc.json"
          pnpm docs:sync:check 2>&1 | tee "$out/docs-sync-check.log"
          pnpm docs:gov:manifest:check 2>&1 | tee "$out/manifest-check.log"
          pnpm ci:docs 2>&1 | tee "$out/ci-docs.log"
          pnpm verify:prepush 2>&1 | tee "$out/prepush.log"
          git diff --exit-code HEAD
          test -z "$(git status --porcelain)"
          git rev-parse HEAD > "$out/validated.txt"
          git diff --binary "$GIT_BASE" HEAD > "$out/candidate.patch"
          git diff --stat "$GIT_BASE" HEAD > "$out/stats.txt"
      - name: Advance only the existing topic branch without force
        shell: bash
        run: |
          set -euo pipefail
          current=$(git ls-remote origin refs/heads/docs/2878-arc-guidance | cut -f1)
          test "$current" = f04fe4d7ef534e012c4445b8c9edf9f37f95936c
          git push origin HEAD:refs/heads/docs/2878-arc-guidance 2>&1 | tee "$RUNNER_TEMP/arc2878-review/push.log"
      - name: Record artifact integrity
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'arc2878-review';out.mkdir(exist_ok=True)
          hashes={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(out.iterdir()) if p.is_file() and p.name!='checksums.json'}
          (out/'checksums.json').write_text(json.dumps(hashes,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: arc-2878-review-validation
          path: ${{ runner.temp }}/arc2878-review
          if-no-files-found: error
          retention-days: 7
