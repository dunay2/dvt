name: Test Suite

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group:
    test-${{ github.workflow }}-${{ github.event_name == 'pull_request' &&
    github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect_test_matrix:
    name: Detect package test matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: "!(github.event_name == 'pull_request' && github.event.pull_request.draft)"
    outputs:
      any_tests: ${{ steps.scope.outputs.any_tests }}
      matrix: ${{ steps.scope.outputs.test_matrix }}
      adapter_temporal: ${{ fromJSON(steps.scope.outputs.test_scope).adapter_temporal }}
      web: ${{ fromJSON(steps.scope.outputs.test_scope).web }}
      root_build_sensitive: ${{ fromJSON(steps.scope.outputs.test_scope).root_build_sensitive }}
      coverage_relevant: ${{ fromJSON(steps.scope.outputs.test_scope).coverage_relevant }}
      postgres_capability_changed:
        ${{ fromJSON(steps.scope.outputs.test_scope).postgres_capability_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Fetch pull-request base ref
        uses: ./.github/actions/fetch-scope-base
        with:
          base-ref: ${{ github.base_ref }}

      - name: Validate workflow scope policy JSON
        run: node tools/ci/validate-policy.js tools/ci/policy/workflow-scope.json

      - name: Emit test scope outputs
        id: scope
        run: node tools/ci/emit-scope.mjs
        env:
          GIT_BASE: origin/${{ github.base_ref }}
          GIT_HEAD: ${{ github.sha }}

  package-tests:
    name: Package Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [detect_test_matrix]
    if: github.event_name != 'pull_request' || needs.detect_test_matrix.outputs.any_tests == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect_test_matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup pnpm, cache and dependencies
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 22.x
          turbo-cache-variant: ${{ matrix.name }}

      - name: Build package dependency graph
        run: node scripts/run-turbo-workspace-task.cjs build ${{ matrix.buildFilters }}
        env:
          TURBO_TOKEN: ${{ github.event_name != 'pull_request' && secrets.TURBO_TOKEN || '' }}
          TURBO_TEAM: ${{ github.event_name != 'pull_request' && secrets.TURBO_TEAM || '' }}

      - name: Run package tests
        run: ${{ matrix.command }}
        env:
          DVT_CI: '1'

  adapter-temporal:
    name: Adapter Temporal Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [detect_test_matrix]
    if: >-
      !(github.event_name == 'pull_request' && github.event.pull_request.draft) &&
      (github.event_name != 'pull_request' ||
       needs.detect_test_matrix.outputs.adapter_temporal == 'true' ||
       needs.detect_test_matrix.outputs.root_build_sensitive == 'true')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup pnpm, cache and dependencies
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 22.x

      - name: Build adapter-temporal dependency graph
        run: node scripts/run-turbo-workspace-task.cjs build --filter=@dvt/adapter-temporal^...
        env:
          TURBO_TOKEN: ${{ github.event_name != 'pull_request' && secrets.TURBO_TOKEN || '' }}
          TURBO_TEAM: ${{ github.event_name != 'pull_request' && secrets.TURBO_TEAM || '' }}

      - name: Run adapter-temporal tests
        run: pnpm test:adapter-temporal
        env:
          DVT_CI: '1'

  web-frontend-tests:
    name: Web Frontend Tests (${{ matrix.capability || matrix.phase }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [detect_test_matrix]
    if: >-
      !(github.event_name == 'pull_request' && github.event.pull_request.draft) &&
      (github.event_name != 'pull_request' || needs.detect_test_matrix.outputs.web == 'true' ||
       needs.detect_test_matrix.outputs.root_build_sensitive == 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - phase: vitest
            capability: ''
          - phase: browser
            capability: controlled
          - phase: browser
            capability: available
          - phase: browser
            capability: unavailable
    env:
      DVT_CI: '1'
      NODE_OPTIONS: --max-old-space-size=4096
      DVT_SELECTED_CLOSURE_CYPRESS_RUNTIME: native
      DVT_SELECTED_CLOSURE_TEMPORAL_WORKER_RUNTIME: available
      GIT_BASE: >-
        ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) ||
        github.event_name == 'push' && github.event.before || github.sha }}
      GIT_HEAD: ${{ github.sha }}
      PROOF_OWNER:
        ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.capability || matrix.phase }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Fetch pull-request base ref
        uses: ./.github/actions/fetch-scope-base
        with:
          base-ref: ${{ github.base_ref }}

      - name: Fetch exact push comparison base
        if: github.event_name == 'push'
        run:
          git cat-file -e "$GIT_BASE^{commit}" || git fetch --no-tags --depth=1 origin "$GIT_BASE"

      - name: Setup pnpm, cache and dependencies
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 22.x
          turbo-cache-variant: ${{ matrix.capability || matrix.phase }}
        env:
          CYPRESS_INSTALL_BINARY: '0'

      - name: Resolve governed Web evidence plan
        id: web_plan
        run: >-
          pnpm test:web:changed --plan --phase=${{ matrix.phase }} ${{ matrix.capability &&
          format('--browser-capability={0}', matrix.capability) || '' }} ${{ (github.event_name !=
          'pull_request' || needs.detect_test_matrix.outputs.root_build_sensitive == 'true') &&
          '--full' || '' }}

      - name: Setup browser proof Python
        id: browser_python
        if: matrix.phase == 'browser' && steps.web_plan.outputs.provider_required == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'

      - name: Install browser proof provider dependencies
        id: browser_provider
        if: matrix.phase == 'browser' && steps.web_plan.outputs.provider_required == 'true'
        run:
          python -m pip install --disable-pip-version-check dbt-postgres==1.10.0 dbt-core==1.11.11

      - name: Install native browser proof dependencies
        id: browser_dependencies
        if: matrix.phase == 'browser' && steps.web_plan.outputs.browser_required == 'true'
        run: |
          pnpm --filter @dvt/web exec cypress install
          pnpm --filter @dvt/web exec cypress verify

      - name: Allocate browser proof PostgreSQL
        id: browser_postgres
        if: matrix.phase == 'browser' && steps.web_plan.outputs.provider_required == 'true'
        run: |
          proof_container=$(docker create --name "dvt-web-proof-$PROOF_OWNER" \
            --label "dvt.ci.proof=$PROOF_OWNER" --publish 127.0.0.1::5432 \
            --env POSTGRES_USER=dvt_proof --env POSTGRES_DB=postgres \
            --env "POSTGRES_PASSWORD=$PROOF_OWNER" postgres:15)
          echo "container_id=$proof_container" >> "$GITHUB_OUTPUT"
          docker start "$proof_container"
          for attempt in {1..30}; do
            if docker exec "$proof_container" pg_isready -h 127.0.0.1 -U dvt_proof -d postgres; then break; fi
            sleep 1
          done
          docker exec "$proof_container" pg_isready -h 127.0.0.1 -U dvt_proof -d postgres
          proof_address=$(docker port "$proof_container" 5432/tcp)
          echo "DATABASE_URL=postgresql://dvt_proof:$PROOF_OWNER@$proof_address/postgres" >> "$GITHUB_ENV"

      - name: Build web dependency graph
        run: node scripts/run-turbo-workspace-task.cjs build --filter=@dvt/web^...
        env:
          TURBO_TOKEN: ${{ github.event_name != 'pull_request' && secrets.TURBO_TOKEN || '' }}
          TURBO_TEAM: ${{ github.event_name != 'pull_request' && secrets.TURBO_TEAM || '' }}

      - name: Run governed Web changed evidence (PR)
        if:
          github.event_name == 'pull_request' && needs.detect_test_matrix.outputs.web == 'true' &&
          needs.detect_test_matrix.outputs.root_build_sensitive != 'true'
        run: >-
          pnpm test:web:changed --phase=${{ matrix.phase }} ${{ matrix.capability &&
          format('--browser-capability={0}', matrix.capability) || '' }}

      - name: Run governed web Vitest primary suites
        if:
          matrix.phase == 'vitest' && (github.event_name != 'pull_request' ||
          needs.detect_test_matrix.outputs.root_build_sensitive == 'true')
        run: pnpm test:web:ci

      - name: Run admitted live browser baseline
        if:
          matrix.phase == 'browser' && (github.event_name != 'pull_request' ||
          needs.detect_test_matrix.outputs.root_build_sensitive == 'true')
        run:
          pnpm test:web:changed --full --phase=browser --browser-capability=${{ matrix.capability }}

      - name: Upload browser failure screenshots
        if: >-
          (failure() || cancelled()) && matrix.phase == 'browser' &&
          steps.web_plan.outputs.browser_required == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-live-proof-screenshots-${{ matrix.capability }}
          path: .dvt/evidence/selected-closure/screenshots
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Remove browser proof PostgreSQL
        if: always() && steps.browser_postgres.outputs.container_id != ''
        env:
          PROOF_CONTAINER_ID: ${{ steps.browser_postgres.outputs.container_id }}
        run: |
          proof_owner=$(docker inspect --format '{{ index .Config.Labels "dvt.ci.proof" }}' "$PROOF_CONTAINER_ID")
          test "$proof_owner" = "$PROOF_OWNER"
          docker rm --force "$PROOF_CONTAINER_ID"

  adapter-postgres:
    name: Adapter Postgres Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [detect_test_matrix]
    if: >-
      github.event_name != 'pull_request' ||
      needs.detect_test_matrix.outputs.postgres_capability_changed == 'true'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: dvt_test
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: dvt_test
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 5432:5432
    env:
      DVT_CI: '1'
      DVT_PG_INTEGRATION: '1'
      DVT_PG_ADMIN_URL:
        postgresql://dvt_test:${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/dvt_test
      DVT_PG_APP_USER: dvt_app
      DVT_PG_APP_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-app
      DVT_PG_RLS_URL:
        postgresql://dvt_app:${{ github.run_id }}-${{ github.run_attempt
        }}-app@localhost:5432/dvt_test
      DVT_PG_URL:
        postgresql://dvt_test:${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/dvt_test
      DATABASE_URL:
        postgresql://dvt_test:${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/dvt_test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm, cache and dependencies
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 22.x

      - name: Provision non-bypass Postgres app role
        run: node scripts/provision-postgres-app-role.cjs

      - name: Enforce adapter-postgres import alias guard
        run: node --test tools/ci/adapter-postgres-import-alias-regression.test.mjs

      - name: Build adapter-postgres dependency graph
        run: node scripts/run-turbo-workspace-task.cjs build --filter=@dvt/adapter-postgres...
        env:
          TURBO_TOKEN: ${{ github.event_name != 'pull_request' && secrets.TURBO_TOKEN || '' }}
          TURBO_TEAM: ${{ github.event_name != 'pull_request' && secrets.TURBO_TEAM || '' }}

      - name: Run adapter-postgres full suite
        run: pnpm test:adapter-postgres

  coverage:
    name: Engine Coverage Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [detect_test_matrix]
    if: >-
      !(github.event_name == 'pull_request' && github.event.pull_request.draft) &&
      (github.event_name != 'pull_request' ||
       needs.detect_test_matrix.outputs.coverage_relevant == 'true')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup pnpm, cache and dependencies
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 22.x

      - name: Build engine dependency graph (once, before tests)
        run: node scripts/run-turbo-workspace-task.cjs build --filter=@dvt/engine^...
        env:
          TURBO_TOKEN: ${{ github.event_name != 'pull_request' && secrets.TURBO_TOKEN || '' }}
          TURBO_TEAM: ${{ github.event_name != 'pull_request' && secrets.TURBO_TEAM || '' }}

      - name: Run engine coverage (with threshold enforcement)
        run: pnpm test:coverage:engine
        env:
          DVT_CI: '1'

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-coverage-report
          path: packages/@dvt/engine/coverage/coverage-final.json
          if-no-files-found: error

  test-suite-required:
    name: Test Suite Required for Merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      [
        detect_test_matrix,
        package-tests,
        adapter-temporal,
        web-frontend-tests,
        adapter-postgres,
        coverage,
      ]
    if: always()
    steps:
      - name: Check test suite jobs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const jobs = ${{ toJSON(needs) }};
            const failures = [];
            const isPr = context.eventName === 'pull_request';
            const draft = isPr && context.payload.pull_request?.draft === true;
            const full = ['push', 'workflow_dispatch'].includes(context.eventName);
            if (!isPr && !full) failures.push(`Unsupported event: ${context.eventName}`);
            if (isPr && typeof context.payload.pull_request?.draft !== 'boolean') {
              failures.push('Missing pull-request draft posture');
            }
            const scope = jobs.detect_test_matrix?.outputs ?? {};
            if (!draft) {
              for (const key of ['any_tests', 'adapter_temporal', 'web',
                'root_build_sensitive', 'postgres_capability_changed', 'coverage_relevant']) {
                if (!['true', 'false'].includes(scope[key])) failures.push(`Invalid scope: ${key}`);
              }
            }
            const root = scope.root_build_sensitive === 'true';
            const required = {
              detect_test_matrix: !draft,
              'package-tests': !draft && (full || scope.any_tests === 'true'),
              'adapter-temporal': !draft && (full || root || scope.adapter_temporal === 'true'),
              'web-frontend-tests': !draft && (full || root || scope.web === 'true'),
              'adapter-postgres': !draft && (full || scope.postgres_capability_changed === 'true'),
              coverage: !draft && (full || scope.coverage_relevant === 'true'),
            };
            for (const [name, selected] of Object.entries(required)) {
              const expected = selected ? 'success' : 'skipped';
              const result = jobs[name]?.result;
              if (result !== expected) failures.push(`${name}: expected ${expected}, got ${result}`);
            }
            for (const name of Object.keys(jobs)) {
              if (!(name in required)) failures.push(`Unclassified result: ${name}`);
            }
            if (failures.length > 0) core.setFailed(failures.join('; '));
