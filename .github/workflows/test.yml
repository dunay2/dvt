name: Test Suite

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group:
    test-${{ github.workflow }}-${{ github.event_name == 'pull_request' &&
    github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect_test_matrix:
    name: Detect package test matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: "!(github.event_name == 'pull_request' && github.event.pull_request.draft)"
    outputs:
      any_tests: ${{ steps.matrix.outputs.any_tests }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

      - name: Validate workflow scope policy JSON
        run: node tools/ci/validate-policy.js tools/ci/policy/workflow-scope.json

      - name: Emit test scope outputs
        id: scope
        run: node tools/ci/emit-scope.mjs --mode test
        env:
          GIT_BASE: origin/${{ github.base_ref }}
          GIT_HEAD: ${{ github.sha }}

      - name: Build package test matrix
        id: matrix
        run: node tools/ci/emit-test-matrix.mjs
        env:
          GIT_BASE: origin/${{ github.base_ref }}
          GIT_HEAD: ${{ github.sha }}

  package-tests:
    name: Package Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [detect_test_matrix]
    if: github.event_name != 'pull_request' || needs.detect_test_matrix.outputs.any_tests == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect_test_matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1

      - name: Setup pnpm, cache and dependencies
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 22.x

      - name: Build package dependency graph
        run: node scripts/run-turbo-workspace-task.cjs build --filter=${{ matrix.pkg }}

      - name: Run package tests
        run: ${{ matrix.command }}
        env:
          DVT_CI: '1'

  adapter-temporal:
    name: Adapter Temporal Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: "!(github.event_name == 'pull_request' && github.event.pull_request.draft)"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

      - name: Validate workflow scope policy JSON
        run: node tools/ci/validate-policy.js tools/ci/policy/workflow-scope.json

      - name: Emit adapter-temporal scope outputs
        id: scope
        run: node tools/ci/emit-scope.mjs --mode test
        env:
          GIT_BASE: origin/${{ github.base_ref }}
          GIT_HEAD: ${{ github.sha }}

      - name: Setup pnpm, cache and dependencies
        if:
          github.event_name != 'pull_request' || steps.scope.outputs.adapter_temporal == 'true' ||
          steps.scope.outputs.root_build_sensitive == 'true'
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 22.x

      - name: Build adapter-temporal dependency graph
        if:
          github.event_name != 'pull_request' || steps.scope.outputs.adapter_temporal == 'true' ||
          steps.scope.outputs.root_build_sensitive == 'true'
        run: pnpm --filter "@dvt/adapter-temporal^..." --workspace-concurrency=4 build

      - name: Run adapter-temporal tests
        if:
          github.event_name != 'pull_request' || steps.scope.outputs.adapter_temporal == 'true' ||
          steps.scope.outputs.root_build_sensitive == 'true'
        run: pnpm test:adapter-temporal
        env:
          DVT_CI: '1'

      - name: Report adapter-temporal test scope skip
        if:
          github.event_name == 'pull_request' && steps.scope.outputs.adapter_temporal != 'true' &&
          steps.scope.outputs.root_build_sensitive != 'true'
        run: echo "No adapter-temporal test scope detected; skipping adapter-temporal tests."

  web-frontend-tests:
    name: Web Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: "!(github.event_name == 'pull_request' && github.event.pull_request.draft)"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

      - name: Validate workflow scope policy JSON
        run: node tools/ci/validate-policy.js tools/ci/policy/workflow-scope.json

      - name: Emit web test scope outputs
        id: scope
        run: node tools/ci/emit-scope.mjs --mode test
        env:
          GIT_BASE: origin/${{ github.base_ref }}
          GIT_HEAD: ${{ github.sha }}

      - name: Setup pnpm, cache and dependencies
        if:
          github.event_name != 'pull_request' || steps.scope.outputs.web == 'true' ||
          steps.scope.outputs.root_build_sensitive == 'true'
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 22.x

      - name: Build web dependency graph
        if:
          github.event_name != 'pull_request' || steps.scope.outputs.web == 'true' ||
          steps.scope.outputs.root_build_sensitive == 'true'
        run: pnpm --filter "@dvt/web^..." --workspace-concurrency=4 build

      - name: Run governed web Vitest changed suites (PR)
        if:
          github.event_name == 'pull_request' && steps.scope.outputs.web == 'true' &&
          steps.scope.outputs.root_build_sensitive != 'true'
        run: pnpm test:web:changed
        env:
          DVT_CI: '1'
          GIT_BASE: origin/${{ github.base_ref }}
          GIT_HEAD: ${{ github.sha }}

      - name: Run governed web Vitest primary suites
        if:
          github.event_name != 'pull_request' || steps.scope.outputs.root_build_sensitive == 'true'
        run: pnpm test:web:ci
        env:
          DVT_CI: '1'

      - name: Report web test scope skip
        if:
          github.event_name == 'pull_request' && steps.scope.outputs.web != 'true' &&
          steps.scope.outputs.root_build_sensitive != 'true'
        run: echo "No web test scope detected; skipping governed web Vitest suites."

  detect-pg-scope:
    name: Detect adapter-postgres scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: "!(github.event_name == 'pull_request' && github.event.pull_request.draft)"
    outputs:
      adapter_postgres_changed: ${{ steps.scope.outputs.postgres_capability_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

      - name: Validate workflow scope policy JSON
        run: node tools/ci/validate-policy.js tools/ci/policy/workflow-scope.json

      - name: Emit adapter-postgres scope output
        id: scope
        run: node tools/ci/emit-scope.mjs --mode test
        env:
          GIT_BASE: origin/${{ github.base_ref }}
          GIT_HEAD: ${{ github.sha }}

  adapter-postgres:
    name: Adapter Postgres Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [detect-pg-scope]
    if:
      needs.detect-pg-scope.result == 'success' &&
      needs.detect-pg-scope.outputs.adapter_postgres_changed == 'true'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: dvt_test
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: dvt_test
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 5432:5432
    env:
      DVT_CI: '1'
      DVT_PG_INTEGRATION: '1'
      DVT_PG_ADMIN_URL:
        postgresql://dvt_test:${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/dvt_test
      DVT_PG_APP_USER: dvt_app
      DVT_PG_APP_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-app
      DVT_PG_RLS_URL:
        postgresql://dvt_app:${{ github.run_id }}-${{ github.run_attempt
        }}-app@localhost:5432/dvt_test
      DVT_PG_URL:
        postgresql://dvt_test:${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/dvt_test
      DATABASE_URL:
        postgresql://dvt_test:${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/dvt_test
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup pnpm, cache and dependencies
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 22.x

      - name: Provision non-bypass Postgres app role
        run: node scripts/provision-postgres-app-role.cjs

      - name: Enforce adapter-postgres import alias guard
        run: node --test tools/ci/adapter-postgres-import-alias-regression.test.mjs

      - name: Build adapter-postgres dependency graph
        run: pnpm --workspace-concurrency=4 --filter @dvt/adapter-postgres... --if-present run build

      - name: Prove adapter-postgres app-role runtime and direct RLS
        run:
          pnpm --filter @dvt/adapter-postgres test -- PostgresAppRoleRuntime.integration.test.ts
          PostgresTenantRlsEnforcement.integration.test.ts

      - name: Run adapter-postgres full suite
        run: pnpm test:adapter-postgres

  test-determinism:
    name: Determinism Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: "!(github.event_name == 'pull_request' && github.event.pull_request.draft)"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

      - name: Validate workflow scope policy JSON
        run: node tools/ci/validate-policy.js tools/ci/policy/workflow-scope.json

      - name: Emit determinism scope output
        id: scope
        run: node tools/ci/emit-scope.mjs --mode test
        env:
          GIT_BASE: origin/${{ github.base_ref }}
          GIT_HEAD: ${{ github.sha }}

      - name: Setup pnpm, cache and dependencies
        if:
          github.event_name != 'pull_request' || steps.scope.outputs.determinism_relevant == 'true'
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 22.x

      - name: Build engine dependency graph (once, before tests)
        if:
          github.event_name != 'pull_request' || steps.scope.outputs.determinism_relevant == 'true'
        run: pnpm --filter "@dvt/engine^..." --workspace-concurrency=4 build

      - name: Run determinism tests
        if:
          github.event_name != 'pull_request' || steps.scope.outputs.determinism_relevant == 'true'
        run: pnpm test:determinism
        env:
          DVT_CI: '1'

      - name: Verify replay consistency
        if:
          github.event_name != 'pull_request' || steps.scope.outputs.determinism_relevant == 'true'
        run: pnpm test:replay
        env:
          DVT_CI: '1'

  coverage:
    name: Engine Coverage Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: "!(github.event_name == 'pull_request' && github.event.pull_request.draft)"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

      - name: Validate workflow scope policy JSON
        run: node tools/ci/validate-policy.js tools/ci/policy/workflow-scope.json

      - name: Emit coverage scope output
        id: scope
        run: node tools/ci/emit-scope.mjs --mode test
        env:
          GIT_BASE: origin/${{ github.base_ref }}
          GIT_HEAD: ${{ github.sha }}

      - name: Setup pnpm, cache and dependencies
        if: github.event_name != 'pull_request' || steps.scope.outputs.coverage_relevant == 'true'
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 22.x

      - name: Build engine dependency graph (once, before tests)
        if: github.event_name != 'pull_request' || steps.scope.outputs.coverage_relevant == 'true'
        run: pnpm --filter "@dvt/engine^..." --workspace-concurrency=4 build

      - name: Run engine coverage (with threshold enforcement)
        if: github.event_name != 'pull_request' || steps.scope.outputs.coverage_relevant == 'true'
        run: pnpm test:coverage:engine
        env:
          DVT_CI: '1'

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-coverage-report
          path: packages/@dvt/engine/coverage/
