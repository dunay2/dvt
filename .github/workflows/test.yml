name: Test Suite

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_full_test_suite:
        description: 'Run full recursive test suite (pnpm test)'
        required: false
        type: boolean
        default: false
      run_coverage:
        description: 'Generate and upload coverage (requires full suite)'
        required: false
        type: boolean
        default: false

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect package changes (PR only)
        id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            engine:
              - 'packages/@dvt/engine/**'
            contracts:
              - 'packages/@dvt/contracts/**'
            adapter_temporal:
              - 'packages/@dvt/adapter-temporal/**'
            cli:
              - 'packages/@dvt/cli/**'
            root_config:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'vitest.config.ts'
              - 'tsconfig*.json'
              - '.github/workflows/test.yml'

      - name: Load adapter-postgres package filters
        if: github.event_name == 'pull_request'
        run: |
          node .github/scripts/generate-paths-filter.js tools/ci/policy/adapter-postgres-relevance.json adapter_postgres > adapter-postgres-filters.yml
          echo "ADAPTER_POSTGRES_FILTERS<<EOF" >> $GITHUB_ENV
          cat adapter-postgres-filters.yml >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Detect adapter-postgres package changes (PR only)
        id: adapter_postgres_changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: ${{ env.ADAPTER_POSTGRES_FILTERS }}

      - name: Setup pnpm, cache and dependencies
        if:
          github.event_name != 'pull_request' || steps.changes.outputs.engine == 'true' ||
          steps.changes.outputs.contracts == 'true' || steps.changes.outputs.adapter_temporal ==
          'true' || steps.changes.outputs.cli == 'true' || steps.changes.outputs.root_config ==
          'true' || steps.adapter_postgres_changes.outputs.adapter_postgres == 'true'
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run tests (push/workflow_dispatch full suite)
        if:
          github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' ||
          github.event.inputs.run_full_test_suite == 'true')
        run: pnpm test

      - name: Run engine tests (affected package)
        if:
          github.event_name == 'pull_request' && (steps.changes.outputs.engine == 'true' ||
          steps.changes.outputs.root_config == 'true')
        run: pnpm test:engine

      - name: Run contracts tests (affected package)
        if:
          github.event_name == 'pull_request' && (steps.changes.outputs.contracts == 'true' ||
          steps.changes.outputs.root_config == 'true')
        run: pnpm test:contracts

      - name: Run adapter-temporal tests (affected package)
        if:
          github.event_name == 'pull_request' && (steps.changes.outputs.adapter_temporal == 'true'
          || steps.changes.outputs.root_config == 'true')
        run: pnpm test:adapter-temporal

      - name: Run cli tests (affected package)
        if:
          github.event_name == 'pull_request' && (steps.changes.outputs.cli == 'true' ||
          steps.changes.outputs.root_config == 'true')
        run: pnpm test:cli

      - name: Skip package tests (PR with no affected packages)
        if:
          github.event_name == 'pull_request' && steps.changes.outputs.engine != 'true' &&
          steps.changes.outputs.contracts != 'true' && steps.changes.outputs.adapter_temporal !=
          'true' && steps.changes.outputs.cli != 'true' && steps.changes.outputs.root_config !=
          'true'
        run: echo "No affected test packages detected; skipping package test execution."

  adapter-postgres-integration:
    name: Adapter Postgres Integration Smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: dvt_test
          POSTGRES_PASSWORD: dvt_test
          POSTGRES_DB: dvt_test
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 5432:5432
    env:
      DVT_PG_INTEGRATION: '1'
      DATABASE_URL: postgresql://dvt_test:dvt_test@localhost:5432/dvt_test
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect adapter-postgres integration changes (PR only)
        run: |
          node .github/scripts/generate-paths-filter.js tools/ci/policy/adapter-postgres-relevance.json adapter_postgres_integration > adapter-postgres-integration-filters.yml
          echo "ADAPTER_POSTGRES_INTEGRATION_FILTERS<<EOF" >> $GITHUB_ENV
          cat adapter-postgres-integration-filters.yml >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
        id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: ${{ env.ADAPTER_POSTGRES_INTEGRATION_FILTERS }}

      - name: Setup pnpm, cache and dependencies
        if:
          github.event_name != 'pull_request' || steps.changes.outputs.adapter_postgres_integration
          == 'true'
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 20.x

      - name: Build adapter-postgres dependency graph (integration)
        if:
          github.event_name != 'pull_request' || steps.changes.outputs.adapter_postgres_integration
          == 'true'
        run: pnpm --filter @dvt/adapter-postgres... --if-present run build

      - name: Run adapter-postgres smoke integration
        if:
          github.event_name != 'pull_request' || steps.changes.outputs.adapter_postgres_integration
          == 'true'
        run: pnpm test:adapter-postgres:integration

      - name: Skip adapter-postgres smoke integration (PR without relevant changes)
        if:
          github.event_name == 'pull_request' && steps.changes.outputs.adapter_postgres_integration
          != 'true'
        run: echo "No adapter-postgres integration changes detected; skipping smoke integration."

  test-determinism:
    name: Determinism Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect determinism-relevant changes (PR only)
        id: det_changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            determinism_relevant:
              - 'packages/@dvt/engine/**'
              - 'packages/@dvt/contracts/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/test.yml'

      - name: Setup pnpm, cache and dependencies
        if:
          github.event_name != 'pull_request' || steps.det_changes.outputs.determinism_relevant ==
          'true'
        uses: ./.github/actions/setup-node-pnpm

      - name: Run determinism tests
        if:
          (github.event_name != 'pull_request' || steps.det_changes.outputs.determinism_relevant ==
          'true') && hashFiles('packages/@dvt/engine/test/determinism/**/*.test.ts') != ''
        run: pnpm test:determinism

      - name: Verify replay consistency
        if:
          (github.event_name != 'pull_request' || steps.det_changes.outputs.determinism_relevant ==
          'true') && hashFiles('packages/@dvt/engine/test/replay/**/*.test.ts') != ''
        run: pnpm test:replay

      - name: Skip determinism checks (PR without relevant changes)
        if:
          github.event_name == 'pull_request' && steps.det_changes.outputs.determinism_relevant !=
          'true'
        run: echo "No determinism-relevant changes detected; skipping determinism checks."

  adapter-postgres-smoke:
    name: Adapter Postgres Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect adapter-postgres-relevant changes (PR only)
        run: |
          node .github/scripts/generate-paths-filter.js tools/ci/policy/adapter-postgres-relevance.json adapter_postgres_relevant > adapter-postgres-relevant-filters.yml
          echo "ADAPTER_POSTGRES_RELEVANT_FILTERS<<EOF" >> $GITHUB_ENV
          cat adapter-postgres-relevant-filters.yml >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
        id: pg_changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: ${{ env.ADAPTER_POSTGRES_RELEVANT_FILTERS }}

      - name: Setup pnpm, cache and dependencies
        if:
          github.event_name != 'pull_request' || steps.pg_changes.outputs.adapter_postgres_relevant
          == 'true'
        uses: ./.github/actions/setup-node-pnpm

      - name: Build adapter-postgres dependency graph
        if:
          github.event_name != 'pull_request' || steps.pg_changes.outputs.adapter_postgres_relevant
          == 'true'
        run: pnpm --filter @dvt/adapter-postgres... --if-present run build

      - name: Run adapter-postgres smoke suite
        if:
          github.event_name != 'pull_request' || steps.pg_changes.outputs.adapter_postgres_relevant
          == 'true'
        run: pnpm --filter @dvt/adapter-postgres test -- smoke.test.ts

      - name: Run adapter-postgres full test suite
        if:
          github.event_name != 'pull_request' || steps.pg_changes.outputs.adapter_postgres_relevant
          == 'true'
        run: pnpm test:adapter-postgres

      - name: Skip adapter-postgres smoke (PR without relevant changes)
        if:
          github.event_name == 'pull_request' && steps.pg_changes.outputs.adapter_postgres_relevant
          != 'true'
        run: echo "No adapter-postgres-relevant changes detected; skipping smoke suite."
