name: Test Suite

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group:
    test-${{ github.workflow }}-${{ github.event_name == 'pull_request' &&
    github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: "!(github.event_name == 'pull_request' && github.event.pull_request.draft)"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Detect package changes (PR only)
        id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4
        with:
          filters: |
            engine:
              - 'packages/@dvt/engine/**'
            contracts:
              - 'packages/@dvt/contracts/**'
            adapter_temporal:
              - 'packages/@dvt/adapter-temporal/**'
            cli:
              - 'packages/@dvt/cli/**'
            api:
              - 'apps/api/**'
            planner:
              - 'packages/@dvt/planner/**'
            root_config:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'vitest.config.ts'
              - 'tsconfig*.json'
              - '.github/workflows/test.yml'

      - name: Setup pnpm, cache and dependencies
        if:
          github.event_name != 'pull_request' || steps.changes.outputs.engine == 'true' ||
          steps.changes.outputs.contracts == 'true' || steps.changes.outputs.adapter_temporal ==
          'true' || steps.changes.outputs.cli == 'true' || steps.changes.outputs.api == 'true' ||
          steps.changes.outputs.planner == 'true' || steps.changes.outputs.root_config == 'true'
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 22.x

      - name: Build all packages (once, before tests)
        if: github.event_name != 'pull_request'
        run: pnpm -r build

      - name: Run tests (push/workflow_dispatch full suite)
        if: github.event_name != 'pull_request'
        run: pnpm test
        env:
          DVT_CI: '1'

      - name: Run engine tests (affected package)
        if:
          github.event_name == 'pull_request' && (steps.changes.outputs.engine == 'true' ||
          steps.changes.outputs.root_config == 'true')
        run: pnpm test:engine

      - name: Run contracts tests (affected package)
        if:
          github.event_name == 'pull_request' && (steps.changes.outputs.contracts == 'true' ||
          steps.changes.outputs.root_config == 'true')
        run: pnpm test:contracts

      - name: Run adapter-temporal tests (affected package)
        if:
          github.event_name == 'pull_request' && (steps.changes.outputs.adapter_temporal == 'true'
          || steps.changes.outputs.root_config == 'true')
        run: pnpm test:adapter-temporal

      - name: Run cli tests (affected package)
        if:
          github.event_name == 'pull_request' && (steps.changes.outputs.cli == 'true' ||
          steps.changes.outputs.root_config == 'true')
        run: pnpm test:cli

      - name: Run api tests (affected package)
        if:
          github.event_name == 'pull_request' && (steps.changes.outputs.api == 'true' ||
          steps.changes.outputs.root_config == 'true')
        run: pnpm test:api

      - name: Run planner tests (affected package)
        if:
          github.event_name == 'pull_request' && (steps.changes.outputs.planner == 'true' ||
          steps.changes.outputs.contracts == 'true' || steps.changes.outputs.root_config == 'true')
        run: pnpm test:planner

  detect-pg-scope:
    name: Detect adapter-postgres scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: "!(github.event_name == 'pull_request' && github.event.pull_request.draft)"
    outputs:
      integration_changed:
        ${{ steps.changes.outputs.adapter_postgres_integration || steps.push_all.outputs.changed }}
      smoke_changed:
        ${{ steps.changes.outputs.adapter_postgres_relevant || steps.push_all.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Mark all changed (push/dispatch — no diff available)
        id: push_all
        if: github.event_name != 'pull_request'
        run: echo "changed=true" >> $GITHUB_OUTPUT

      - name: Generate adapter-postgres filters
        id: filters
        if: github.event_name == 'pull_request'
        run: |
          echo "filters<<EOF" >> $GITHUB_OUTPUT
          node .github/scripts/generate-paths-filter.js tools/ci/policy/adapter-postgres-relevance.json adapter_postgres_integration >> $GITHUB_OUTPUT
          node .github/scripts/generate-paths-filter.js tools/ci/policy/adapter-postgres-relevance.json adapter_postgres_relevant >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Detect adapter-postgres changes
        id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4
        with:
          filters: ${{ steps.filters.outputs.filters }}

  adapter-postgres-integration:
    name: Adapter Postgres Integration Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [detect-pg-scope]
    if:
      needs.detect-pg-scope.result == 'success' && needs.detect-pg-scope.outputs.integration_changed
      == 'true'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: dvt_test
          POSTGRES_PASSWORD: dvt_test
          POSTGRES_DB: dvt_test
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 5432:5432
    env:
      DVT_PG_INTEGRATION: '1'
      DATABASE_URL: postgresql://dvt_test:dvt_test@localhost:5432/dvt_test
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup pnpm, cache and dependencies
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 22.x

      - name: Enforce adapter-postgres import alias guard
        run: node --test tools/ci/adapter-postgres-import-alias-regression.test.mjs

      - name: Build adapter-postgres dependency graph (integration)
        run: pnpm --filter @dvt/adapter-postgres... --if-present run build

      - name: Run adapter-postgres smoke integration
        run: pnpm test:adapter-postgres:integration

  test-determinism:
    name: Determinism Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: "!(github.event_name == 'pull_request' && github.event.pull_request.draft)"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Detect determinism-relevant changes (PR only)
        id: det_changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4
        with:
          filters: |
            determinism_relevant:
              - 'packages/@dvt/engine/**'
              - 'packages/@dvt/contracts/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/test.yml'

      - name: Setup pnpm, cache and dependencies
        if:
          github.event_name != 'pull_request' || steps.det_changes.outputs.determinism_relevant ==
          'true'
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 22.x

      - name: Run determinism tests
        if:
          github.event_name != 'pull_request' || steps.det_changes.outputs.determinism_relevant ==
          'true'
        run: pnpm test:determinism

      - name: Verify replay consistency
        if:
          github.event_name != 'pull_request' || steps.det_changes.outputs.determinism_relevant ==
          'true'
        run: pnpm test:replay

  coverage:
    name: Engine Coverage Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: "!(github.event_name == 'pull_request' && github.event.pull_request.draft)"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Detect coverage-relevant changes (PR only)
        id: cov_changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4
        with:
          filters: |
            coverage_relevant:
              - 'packages/@dvt/engine/src/**'
              - 'packages/@dvt/engine/test/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'vitest.config.ts'
              - '.github/workflows/test.yml'

      - name: Setup pnpm, cache and dependencies
        if:
          github.event_name != 'pull_request' || steps.cov_changes.outputs.coverage_relevant ==
          'true'
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 22.x

      - name: Run engine coverage (with threshold enforcement)
        if:
          github.event_name != 'pull_request' || steps.cov_changes.outputs.coverage_relevant ==
          'true'
        run: pnpm test:coverage:engine

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: engine-coverage-report
          path: packages/@dvt/engine/coverage/

  adapter-postgres-smoke:
    name: Adapter Postgres Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [detect-pg-scope]
    if:
      needs.detect-pg-scope.result == 'success' && needs.detect-pg-scope.outputs.smoke_changed ==
      'true'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup pnpm, cache and dependencies
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 22.x

      - name: Enforce adapter-postgres import alias guard
        run: node --test tools/ci/adapter-postgres-import-alias-regression.test.mjs

      - name: Build adapter-postgres dependency graph
        run: pnpm --filter @dvt/adapter-postgres... --if-present run build

      - name: Run adapter-postgres full test suite
        run: pnpm test:adapter-postgres
