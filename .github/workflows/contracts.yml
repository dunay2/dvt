name: Contracts & Determinism

# Blocking policy (issue #93):
# - Critical contract checks MUST fail the job and block merge.
# - Documented exceptions:
#   1) Scope gating: jobs are skipped when no relevant files changed on PRs.
#   2) JSON schema validation is skipped only when no *.schema.json files exist.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_determinism_scan:
        description: 'Run determinism lint checks'
        required: false
        type: boolean
        default: false
      run_golden_validation:
        description: 'Run golden fixtures validation and hash checks'
        required: false
        type: boolean
        default: false

concurrency:
  group: contracts-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect contracts/determinism scope
    runs-on: ubuntu-latest
    outputs:
      contracts_relevant: ${{ steps.changes.outputs.contracts_relevant }}
      determinism_relevant: ${{ steps.changes.outputs.determinism_relevant }}
      golden_relevant: ${{ steps.changes.outputs.golden_relevant }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Detect changed areas (PR only)
        id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4
        with:
          filters: |
            contracts_relevant:
              - 'packages/@dvt/contracts/**'
              - 'packages/@dvt/engine/test/contracts/**'
              - 'docs/architecture/engine/contracts/**'
              - '.golden/**'
              - 'scripts/compare-hashes.cjs'
              - 'scripts/db-migrate.cjs'
              - 'scripts/validate-contracts.cjs'
              - '.github/workflows/contracts.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            determinism_relevant:
              - 'packages/@dvt/engine/**'
              - 'packages/@dvt/contracts/**'
              - '.github/workflows/contracts.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            golden_relevant:
              - 'packages/@dvt/engine/test/contracts/**'
              - 'docs/architecture/engine/contracts/**'
              - '.golden/**'
              - 'scripts/compare-hashes.cjs'
              - 'scripts/db-migrate.cjs'
              - '.github/workflows/contracts.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'

      - name: Set default outputs (non-PR events)
        if: github.event_name != 'pull_request'
        run: |
          echo "contracts_relevant=true" >> "$GITHUB_OUTPUT"
          echo "determinism_relevant=true" >> "$GITHUB_OUTPUT"
          echo "golden_relevant=true" >> "$GITHUB_OUTPUT"
        shell: bash

  validate-json-schemas:
    name: Validate JSON Schemas
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if:
      github.event_name != 'pull_request' || needs.detect-changes.outputs.contracts_relevant ==
      'true'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup pnpm, cache and dependencies
        uses: ./.github/actions/setup-node-pnpm

      - name: Validate JSON schemas
        run: |
          set -euo pipefail
          echo "Checking for JSON schema files..."

          schema_roots=()
          [[ -d "docs/architecture/engine/contracts" ]] && schema_roots+=("docs/architecture/engine/contracts")
          [[ -d "docs/contracts" ]] && schema_roots+=("docs/contracts")

          if [ ${#schema_roots[@]} -eq 0 ]; then
            echo "No schema root directories found; skipping"
            exit 0
          fi

          mapfile -t all_schemas < <(find "${schema_roots[@]}" -name "*.schema.json" -type f 2>/dev/null)
          if [ ${#all_schemas[@]} -eq 0 ]; then
            echo "No schema files found; skipping"
            exit 0
          fi

          echo "Validating draft 2020-12 schemas..."
          mapfile -t draft2020_schemas < <(
            for schema in "${all_schemas[@]}"; do
              if grep -q '"\$schema"[[:space:]]*:[[:space:]]*"https://json-schema.org/draft/2020-12/schema"' "$schema"; then
                echo "$schema"
              fi
            done
          )
          if [ ${#draft2020_schemas[@]} -gt 0 ]; then
            for schema in "${draft2020_schemas[@]}"; do
              pnpm exec ajv compile --spec=draft2020 --strict=false -s "$schema"
            done
          else
            echo "No draft 2020-12 schemas found"
          fi

          echo "Validating draft-07/legacy schemas..."
          mapfile -t draft7_schemas < <(for f in "${all_schemas[@]}"; do
            if ! grep -q '"\$schema"[[:space:]]*:[[:space:]]*"https://json-schema.org/draft/2020-12/schema"' "$f"; then
              echo "$f"
            fi
          done)
          if [ ${#draft7_schemas[@]} -gt 0 ]; then
            for schema in "${draft7_schemas[@]}"; do
              pnpm exec ajv compile --spec=draft7 --strict=false -s "$schema"
            done
          else
            echo "No draft-07/legacy schemas found"
          fi

          echo "Schema validation complete"

  determinism-checks:
    name: Determinism Pattern Scan
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: >
      (github.event_name != 'pull_request' || needs.detect-changes.outputs.determinism_relevant ==
      'true') && (github.event_name != 'workflow_dispatch' ||
      github.event.inputs.run_determinism_scan == 'true')
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup pnpm, cache and dependencies
        uses: ./.github/actions/setup-node-pnpm

      - name: Run determinism linting
        run: pnpm lint:determinism

      - name: Check for Date.now()
        run: |
          echo "🔍 Scanning for Date.now() in engine workflows..."
          if grep -r "Date\.now()" packages/@dvt/engine/src --exclude-dir=node_modules 2>/dev/null | grep -v "OutboxWorker.ts" | grep -q .; then
            echo "❌ Found Date.now() calls (use workflow.now() in Temporal workflows)"
            exit 1
          else
            echo "✅ No Date.now() calls found"
          fi

      - name: Check for Math.random()
        run: |
          echo "🔍 Scanning for Math.random() in engine workflows..."
          if grep -r "Math\.random()" packages/@dvt/engine/src --exclude-dir=node_modules 2>/dev/null | grep -v "OutboxWorker.ts" | grep -q .; then
            echo "❌ Found Math.random() calls (use workflow-seeded RNG)"
            exit 1
          else
            echo "✅ No Math.random() calls found"
          fi

      - name: Check for crypto.randomBytes()
        run: |
          echo "🔍 Scanning for crypto.randomBytes() in engine workflows..."
          if grep -r "crypto\.randomBytes" packages/@dvt/engine/src --exclude-dir=node_modules 2>/dev/null | grep -v "OutboxWorker.ts" | grep -q .; then
            echo "❌ Found crypto.randomBytes() calls (use deterministic UUID generation)"
            exit 1
          else
            echo "✅ No crypto.randomBytes() calls found"
          fi

  contract-compile:
    name: Compile TypeScript Contracts
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if:
      github.event_name != 'pull_request' || needs.detect-changes.outputs.contracts_relevant ==
      'true'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup pnpm, cache and dependencies
        uses: ./.github/actions/setup-node-pnpm

      - name: Compile contracts
        run: pnpm test:contracts:compile

      - name: Check for 'any' types
        run: |
          echo "Checking for TypeScript 'any' types in contracts..."
          if [ -d "packages/@dvt/contracts/src" ]; then
            if grep -rE ":\s*any" packages/@dvt/contracts/src 2>/dev/null | grep -q .; then
              echo "❌ Found 'any' types in contracts (violates strict mode)"
              exit 1
            else
              echo "✅ No 'any' types found"
            fi
          else
            echo "⚠️  packages/@dvt/contracts/src directory not found"
            echo "✅ Check passed (stub mode)"
          fi

      - name: Upload compiled contracts artifact
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: compiled-contracts
          path: |
            packages/@dvt/contracts/dist/

  contract-validate:
    name: Validate Golden JSON Fixtures
    runs-on: ubuntu-latest
    needs: [detect-changes, contract-compile]
    if: >
      (github.event_name != 'pull_request' || needs.detect-changes.outputs.contracts_relevant ==
      'true') && (github.event_name != 'workflow_dispatch' ||
      github.event.inputs.run_golden_validation == 'true')
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup pnpm, cache and dependencies
        uses: ./.github/actions/setup-node-pnpm

      - name: Download compiled contracts artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: compiled-contracts
          path: .

      - name: Validate golden fixtures
        run: pnpm validate:contracts

  contract-hashes:
    name: Execute Golden Paths & Validate Hashes
    runs-on: ubuntu-latest
    needs: [detect-changes, contract-compile]
    if: >
      (github.event_name != 'pull_request' || needs.detect-changes.outputs.golden_relevant ==
      'true') && (github.event_name != 'workflow_dispatch' ||
      github.event.inputs.run_golden_validation == 'true')
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: dvt_test
          POSTGRES_PASSWORD: dvt_test
          POSTGRES_DB: dvt_test
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Setup pnpm, cache and dependencies
        uses: ./.github/actions/setup-node-pnpm

      - name: Download compiled contracts artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: compiled-contracts
          path: .

      - name: Run database migrations
        run: node scripts/db-migrate.cjs
        env:
          DATABASE_URL: postgresql://dvt_test:dvt_test@localhost:5432/dvt_test

      - name: Execute golden paths
        run: pnpm golden:validate
        env:
          DATABASE_URL: postgresql://dvt_test:dvt_test@localhost:5432/dvt_test
        timeout-minutes: 5

      - name: Detect hash-compare scope (PR only)
        id: hash_scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          changed_files="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")"
          if echo "$changed_files" | grep -Eq '^(packages/@dvt/engine/test/contracts/|docs/architecture/engine/contracts/|\.golden/|scripts/compare-hashes\.cjs|scripts/db-migrate\.cjs)'; then
            echo "run_hash_compare=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_hash_compare=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare snapshot hashes (blocking)
        if: >-
          ${{
            github.event_name != 'pull_request' ||
            steps.hash_scope.outputs.run_hash_compare == 'true'
          }}
        run: |
          set -euo pipefail
          echo "Comparing snapshot hashes..."
          node scripts/compare-hashes.cjs

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: contract-test-results
          path: |
            packages/@dvt/engine/test/contracts/results/
            .golden/hashes.json
