name: Temporary Python code-node CI scope refresh

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/python-code-node-ci-scope-refresh.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  refresh-ci-scope:
    if: >-
      github.repository == 'dunay2/dvt' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/python-code-node-vertical'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Register Python plugin package in governed CI scope
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          policy_path = Path('tools/ci/policy/workflow-scope.json')
          policy = json.loads(policy_path.read_text())
          policy['workspace_temporal_python_plugin'] = [
              'packages/@dvt/temporal-python-plugin/**',
              'packages/@dvt/adapter-temporal/**',
              'packages/@dvt/contracts/**',
              'packages/@dvt/engine/**',
              'tools/ci/**',
          ]
          policy_path.write_text(json.dumps(policy, indent=2) + '\n')

          scope_path = Path('tools/ci/scope-config.mjs')
          text = scope_path.read_text()
          replacements = {
              "    'workspace_temporal_http_json_plugin',\n    'workspace_temporal_object_file_postgres_plugin',":
                  "    'workspace_temporal_http_json_plugin',\n    'workspace_temporal_python_plugin',\n    'workspace_temporal_object_file_postgres_plugin',",
              "  {\n    key: 'temporal_object_file_postgres_plugin',\n    name: 'temporal-object-file-postgres-plugin',":
                  "  {\n    key: 'temporal_python_plugin',\n    name: 'temporal-python-plugin',\n    pkg: '@dvt/temporal-python-plugin',\n    patterns: WORKFLOW_SCOPE_POLICY.workspace_temporal_python_plugin,\n  },\n  {\n    key: 'temporal_object_file_postgres_plugin',\n    name: 'temporal-object-file-postgres-plugin',",
              "  temporal_http_json_plugin: WORKFLOW_SCOPE_POLICY.workspace_temporal_http_json_plugin,\n  temporal_object_file_postgres_plugin:":
                  "  temporal_http_json_plugin: WORKFLOW_SCOPE_POLICY.workspace_temporal_http_json_plugin,\n  temporal_python_plugin: WORKFLOW_SCOPE_POLICY.workspace_temporal_python_plugin,\n  temporal_object_file_postgres_plugin:",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing governed scope anchor: {old!r}')
              text = text.replace(old, new, 1)
          scope_path.write_text(text)
          PY

          rm .github/workflows/python-code-node-ci-scope-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/ci/policy/workflow-scope.json tools/ci/scope-config.mjs .github/workflows/python-code-node-ci-scope-refresh.yml
          git diff --cached --quiet && exit 0
          git commit -m "chore(ci): cover Temporal Python plugin tests"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
