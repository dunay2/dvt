name: Validate Documentation Retirement
on:
  push:
    branches: [automation/3004-p2-and-next-cut]
    paths: [.github/workflows/retirement-next-cut.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      BASE: f9ecdfbccf031a9db2bd0dca8660cad75d4c5bc0
      SOURCE: 05368b59b10407789b13ef4fa4676cd86bf47bc8
      GIT_BASE: f9ecdfbccf031a9db2bd0dca8660cad75d4c5bc0
      PLANNING_DB_INTEGRITY_SCOPE: bootstrap
      TZ: UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 05368b59b10407789b13ef4fa4676cd86bf47bc8
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 22.x
      - name: Apply reviewed correction with RED before deletion
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,hashlib,os
          out=Path('/tmp/retirement');out.mkdir(exist_ok=True)
          def sha(b): return hashlib.sha256(b).hexdigest()
          assert subprocess.check_output(['git','rev-parse','HEAD']).decode().strip()==os.environ['SOURCE']
          p=Path('tools/ci/docs-disposition-canon.test.mjs');s=p.read_text()
          assert sha(p.read_bytes())=='faa03a96c2564292114ddc06f6419dcaef3af0c7b7f616ac1ae98ced6b0c4802'
          needle="    'docs/planning/proposals/mandatory/frontend-and-ux/superseded',"
          assert s.count(needle)==1
          s=s.replace(needle,needle+"\n    'docs/planning/proposals/mandatory/frontend-and-ux/archive-candidates',")
          needle=r'  assert.doesNotMatch(frontendClassification, /\.\/superseded\//u);'
          assert s.count(needle)==1
          s=s.replace(needle,needle+'\n'+r'  assert.doesNotMatch(frontendClassification, /archive-candidates\//u);')
          assert sha(s.encode())=='12417de62857cd4dfa1ba1cc5cbc7b2ef952b1efc99401ba6e8b2fe014a6e1b0'
          p.write_text(s)
          cmd=['node','--test','--test-name-pattern=retired historical packs','tools/ci/docs-disposition-canon.test.mjs']
          red=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
          (out/'red.log').write_text(red.stdout);assert red.returncode==1
          p=Path('docs/planning/proposals/mandatory/frontend-and-ux/index.md')
          assert sha(p.read_bytes())=='40d05216a10f20e509ba8c300b25ec38612b38e8abc09f00290a6397b9d698ac'
          s=p.read_text();assert s.count('./archive-candidates/index.md')==1
          s=''.join(line for line in s.splitlines(keepends=True) if './archive-candidates/index.md' not in line)
          assert sha(s.encode())=='3215558d0c536d495b8e71bb670fdb3391fdceaa0e7f0cb7b0ec10dd38be2dc7'
          p.write_text(s)
          p=Path('docs/planning/proposals/mandatory/frontend-and-ux/archive-candidates/index.md')
          assert sha(p.read_bytes())=='7e646881677260390b2d988753120dfff8ba0361ea9ba1168c4c84432b819de0'
          p.unlink();p.parent.rmdir()
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','-A'],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          PY
      - name: Commit with canonical helper and enabled hooks
        shell: bash
        run: |
          set -euo pipefail
          pnpm commit docs docs "Retire stale archive-candidate navigation" 2>&1 | tee /tmp/retirement/commit.log
          echo "GIT_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Prepare disposable CI database only
        uses: ./.github/actions/prepare-planning-db
      - name: Run canonical generators
        shell: bash
        run: |
          set -euo pipefail
          pnpm docs:sync 2>&1 | tee /tmp/retirement/sync.log
          pnpm governance:refresh 2>&1 | tee /tmp/retirement/refresh.log
          git add -A
          if ! git diff --cached --quiet; then
            test "$(git diff --cached --name-only)" = docs/.manifest.json
            pnpm commit docs docs "Regenerate inventory after candidate navigation retirement"
          fi
          echo "GIT_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Validate correction and complete final candidate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,json,os,re
          out=Path('/tmp/retirement');results=[];base=os.environ['BASE'];source=os.environ['SOURCE']
          def git(*a):return subprocess.check_output(['git',*a]).decode().strip()
          def run(name,cmd,expected=0):
              r=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True)
              (out/(name+'.log')).write_text(r.stdout+'\nSTDERR\n'+r.stderr)
              results.append({'name':name,'exitCode':r.returncode,'expected':expected,'command':cmd})
              (out/'validation.json').write_text(json.dumps(results,indent=2))
              print(name,r.returncode,flush=True)
              assert r.returncode==expected,(name,r.stdout[-4000:],r.stderr[-4000:])
              return r.stdout
          assert len(git('diff','--name-only','--diff-filter=D',base,'HEAD').splitlines())==28
          assert not git('diff','--name-only','--diff-filter=A',base,'HEAD')
          assert not git('diff','--name-only',base,'HEAD','--','apps','packages','specs','docs/architecture','docs/adr','docs/evidence','docs/risk-register','buzon','.github','package.json','pnpm-lock.yaml')
          cmd=['node','--test','--test-name-pattern=retired historical packs','tools/ci/docs-disposition-canon.test.mjs']
          run('green',cmd)
          for name,path in [('restored-target','docs/planning/proposals/mandatory/frontend-and-ux/archive-candidates/index.md'),('restored-parent','docs/planning/proposals/mandatory/frontend-and-ux/index.md')]:
              p=Path(path);old=p.read_bytes() if p.exists() else None;p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(subprocess.check_output(['git','show',source+':'+path]))
              try:run(name,cmd,1)
              finally:
                  if old is None:p.unlink();p.parent.rmdir()
                  else:p.write_bytes(old)
          text=run('arc',['node','tools/ci/arc-check.mjs']);m=re.search(r'^\{',text,re.MULTILINE);assert m
          arc=json.loads(text[m.start():]);assert arc['effectiveArcLevel']=='ARC-0'
          assert all(arc['requirements'][k] is False for k in ['evidenceDoc','riskUpdate','rolloutNotes','compatMatrix'])
          run('tests',['node','--test','scripts/check-feature-mechanization.test.cjs','scripts/documentation-publication.test.cjs','scripts/planning-db-surface-inventory-check.test.cjs','tools/ci/docs-disposition-canon.test.mjs','tools/ci/startup-card-canon.test.mjs','tools/ci/planner-package-governance.test.mjs','tools/ci/architecture-doc-reconciliation-canon.test.mjs','scripts/governance-refresh.test.cjs','tools/ci/emit-test-matrix.test.mjs','tools/ci/turbo-workspace-task-contract.test.mjs'])
          for name,cmd in [('sync-check',['pnpm','docs:sync:check']),('manifest',['pnpm','docs:gov:manifest:check']),('ci-docs',['pnpm','ci:docs']),('prepush',['pnpm','verify:prepush']),('title',['pnpm','pr:validate-title','docs(docs): Retire obsolete contract and CI journals']),('clean',['git','diff','--exit-code','HEAD'])]:run(name,cmd)
          assert not git('status','--porcelain')
          (out/'validated.txt').write_text(git('rev-parse','HEAD')+'\n')
          PY
      - name: Export sources and actual evidence
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,json,hashlib,os
          out=Path('/tmp/retirement');out.mkdir(exist_ok=True);base=os.environ['BASE']
          for name,args in {'head.txt':['rev-parse','HEAD'],'tree.txt':['rev-parse','HEAD^{tree}'],'commit.txt':['cat-file','commit','HEAD'],'head-files.txt':['ls-tree','-rz','HEAD'],'status.txt':['status','--porcelain'],'candidate.patch':['diff',base,'HEAD'],'numstat.txt':['diff','--numstat',base,'HEAD'],'name-status.txt':['diff','--name-status',base,'HEAD'],'stats.txt':['diff','--stat',base,'HEAD']}.items():
              (out/name).write_bytes(subprocess.check_output(['git',*args]))
          subprocess.run(['git','archive','--format=tar.gz','-o',str(out/'source.tar.gz'),'HEAD'],check=True)
          (out/'checksums.json').write_text(json.dumps({p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in out.iterdir() if p.is_file() and p.name!='checksums.json'},indent=2))
          PY
      - name: Publish isolated validated candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat /tmp/retirement/validated.txt)" = "$(git rev-parse HEAD)"
          gh auth setup-git
          branch=automation/3004-3314-p2-validated
          test -z "$(git ls-remote --heads origin refs/heads/$branch)"
          git push origin HEAD:refs/heads/$branch
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: docs-3314-p2-retirement
          path: /tmp/retirement
          retention-days: 7
