name: Isolated legacy planning source audit
on:
  push:
    branches: [automation/3004-legacy-planning-20260917]
    paths: [.github/workflows/legacy-planning-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d8c3e3b9479139a35d6e269f6a6ef42dde2080f6
          fetch-depth: 1
          persist-credentials: false
      - name: Export exact tracked source and identities for bounded review
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/legacy-planning-audit"
          mkdir -p "$out"
          test "$(git rev-parse HEAD)" = d8c3e3b9479139a35d6e269f6a6ef42dde2080f6
          git rev-parse HEAD > "$out/head.txt"
          git rev-parse HEAD^{tree} > "$out/tree.txt"
          git ls-tree -r HEAD > "$out/tree-manifest.txt"
          git archive --format=tar.gz HEAD > "$out/source.tar.gz"
          cd "$out"
          sha256sum head.txt tree.txt tree-manifest.txt source.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: legacy-planning-source-audit
          path: ${{ runner.temp }}/legacy-planning-audit
          retention-days: 7
          if-no-files-found: error
