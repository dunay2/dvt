name: Docs Integration Repair

on:
  push:
    branches: [automation/3004-docs-integration-repair]
    paths: [.github/workflows/docs-integration-repair.yml]

permissions:
  contents: read

jobs:
  verify:
    name: Verify exact cleanup integration candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GIT_BASE: 88b7922f7246386959700da5866e330076f8dd97
      GIT_HEAD: 3a94a3d34ce7acb8cf5f5e4b78f6e609886771dc
      PLANNING_DB_INTEGRITY_SCOPE: bootstrap
    steps:
      - name: Checkout exact candidate without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 3a94a3d34ce7acb8cf5f5e4b78f6e609886771dc
          fetch-depth: 0
          persist-credentials: false
      - name: Setup existing toolchain
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 22.x
      - name: Prepare existing disposable CI database
        uses: ./.github/actions/prepare-planning-db
      - name: Check generated documentation has no drift
        run: |
          pnpm docs:sync:check
          pnpm docs:gov:manifest:check
      - name: Validate full documentation contract in CI scope
        run: pnpm ci:docs
      - name: Run canonical pre-push validation
        run: pnpm verify:prepush
      - name: Rerun the affected regression suites
        run: node --test scripts/planning-db-surface-inventory-check.test.cjs tools/ci/docs-disposition-canon.test.mjs
      - name: Reject any uncommitted tracked change
        run: git diff --exit-code HEAD
