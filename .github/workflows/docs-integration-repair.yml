name: Docs Integration Repair

on:
  push:
    branches: [automation/3004-docs-integration-repair]
    paths: [.github/workflows/docs-integration-repair.yml]

permissions:
  contents: read

jobs:
  retire:
    name: Retire copied PR drafts and completed documentation journals
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      BASE: 0c26e7cb74c68ae95bdaf46219f49531df2d98cd
      GIT_BASE: 0c26e7cb74c68ae95bdaf46219f49531df2d98cd
      PLANNING_DB_INTEGRITY_SCOPE: bootstrap
      TZ: UTC
    steps:
      - name: Checkout exact merged baseline without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0c26e7cb74c68ae95bdaf46219f49531df2d98cd
          fetch-depth: 0
          persist-credentials: false
      - name: Apply reviewed hash-verified retirement
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,json,hashlib,os
          out=Path('/tmp/journal-retirement');out.mkdir(exist_ok=True)
          base=os.environ['BASE']
          def git(*a):return subprocess.check_output(['git',*a])
          def sha(b):return hashlib.sha256(b).hexdigest()
          assert git('rev-parse','HEAD').decode().strip()==base
          assert git('rev-parse','HEAD^{tree}').decode().strip()=='af122b10dfaac3c813ebb73159789d699623e04e'
          removed=['.gh-comments/normalize_issues_v2.ps1', '.gh-comments/pr-117.md', '.gh-comments/pr-221.md', '.gh-comments/pr-226-glossary-and-postgres-hardening-2026-02-19.md', '.gh-comments/pr-9.md', '.gh-comments/pr-closure-notes-14-15.md', '.gh-comments/pr-postgres-hardening-p0-p2-2026-02-19.md', '.gh-comments/pr-roadmap-status-refresh-2026-02-15.md', '.git.bfg-report/2026-02-19/14-48-28/cache-stats.txt', '.git.bfg-report/2026-02-19/14-48-28/object-id-map.old-new.txt', 'buzon/20260524-codex-fowler-planning-review-canon.md', 'buzon/dvt_front_component_inventory_app_reflection_study_20260604.md', 'docs/planning/closeouts/20260315-architecture-components-map-closeout.md', 'docs/planning/closeouts/20260315-docs-governance-hardening-closeout.md', 'docs/planning/closeouts/20260315-markdown-location-governance-closeout.md', 'docs/planning/closeouts/20260316-phase2-arch-roadmap-closeout.md', 'docs/planning/closeouts/20260317-adapter-temporal-pretest-split-closeout.md', 'docs/planning/closeouts/20260317-outbox-worker-script-dedup-closeout.md', 'docs/planning/closeouts/20260317-repo-rule-git-commit-escalation-closeout.md', 'docs/planning/closeouts/20260317-tsconfig-app-base-closeout.md', 'docs/planning/closeouts/20260318-contracts-generated-artifact-cleanup-closeout.md', 'docs/planning/closeouts/20260331-zensical-single-config-migration-closeout.md', 'docs/planning/closeouts/20260402-evidence-information-architecture-classification-closeout.md', 'docs/planning/closeouts/20260402-evidence-information-architecture-phase3-migration-closeout.md', 'docs/planning/closeouts/20260402-rc-g1-governance-startup-reconciliation-closeout.md', 'docs/planning/closeouts/20260406-mw-a4-step-kind-extension-guide-closeout.md', 'docs/planning/closeouts/20260407-f23-git-file-history-docs-first-closeout.md', 'docs/planning/closeouts/20260411-pr911-merge-conflict-resolution-closeout.md', 'docs/planning/closeouts/20260413-pr-895-release-branch-reconciliation-closeout.md', 'docs/planning/closeouts/20260413-pr-926-web-toolchain-compatibility-closeout.md', 'docs/planning/closeouts/20260514-ci-audit-adr0-owner-closeout.md', 'docs/planning/closeouts/20260515-ci-audit-contracts-scope-closeout.md', 'docs/planning/closeouts/20260515-ci-audit-release-flow-closeout.md', 'docs/planning/closeouts/20260522-cfg-ts-t1-baseurl-deprecation-plan-closeout.md', 'docs/planning/closeouts/20260522-f24-canvas-route-chrome-token-convergence-closeout.md', 'docs/planning/closeouts/20260522-f24-context-panel-token-convergence-closeout.md', 'docs/planning/closeouts/20260522-f24-dbt-node-renderer-token-convergence-closeout.md', 'docs/planning/closeouts/20260522-f24-lineage-panel-token-convergence-closeout.md', 'docs/planning/closeouts/20260522-f24-monaco-visual-token-convergence-closeout.md', 'docs/planning/closeouts/20260522-f24-react-flow-token-convergence-closeout.md', 'docs/planning/closeouts/20260522-f25-plugin-capability-table-closeout.md', 'docs/planning/closeouts/20260525-f29-canvas-workbench-proposal-disposition-closeout.md', 'docs/planning/closeouts/20260601-ci-workflow-policy-fanout-trim-closeout.md', 'docs/planning/closeouts/20260603-ci-draft-ready-workflow-gates-closeout.md', 'docs/planning/status/20260402-command-logging-pane.md']
          assert len(removed)==45 and len(set(removed))==45
          (out/'removed.json').write_text(json.dumps(removed,indent=2))
          originals={p:sha(Path(p).read_bytes()) for p in removed}
          (out/'original-hashes.json').write_text(json.dumps(originals,indent=2))
          p=Path('tools/ci/docs-disposition-canon.test.mjs');before=p.read_bytes()
          assert sha(before)=='e5b3262772a9298938436ac7d0c185bc7918886c93facd5799dcef2dc3e9e30c'
          needle='  const editorialCloseouts = new Set([\n'
          text=before.decode();assert text.count(needle)==1
          names=sorted(Path(v).name for v in removed if v.startswith('docs/planning/closeouts/'))
          assert len(names)==32
          text=text.replace(needle,needle+''.join("    '"+v+"',\n" for v in names))
          text+='\n// PR conversations and one-off command logs belong in Git/GitHub, not live files.\ntest(\'retired PR drafts and historical intake have no files or live consumers\', () => {\n  const retiredDirectories = [\'.gh-comments\', \'.git.bfg-report\'];\n  const retiredFiles = [\n    \'.gh-comments/normalize_issues_v2.ps1\',\n    \'.gh-comments/pr-117.md\',\n    \'.gh-comments/pr-221.md\',\n    \'.gh-comments/pr-226-glossary-and-postgres-hardening-2026-02-19.md\',\n    \'.gh-comments/pr-9.md\',\n    \'.gh-comments/pr-closure-notes-14-15.md\',\n    \'.gh-comments/pr-postgres-hardening-p0-p2-2026-02-19.md\',\n    \'.gh-comments/pr-roadmap-status-refresh-2026-02-15.md\',\n    \'.git.bfg-report/2026-02-19/14-48-28/cache-stats.txt\',\n    \'.git.bfg-report/2026-02-19/14-48-28/object-id-map.old-new.txt\',\n    \'buzon/20260524-codex-fowler-planning-review-canon.md\',\n    \'buzon/dvt_front_component_inventory_app_reflection_study_20260604.md\',\n    \'docs/planning/status/20260402-command-logging-pane.md\',\n  ];\n  for (const path of [...retiredDirectories, ...retiredFiles]) {\n    assert.equal(existsSync(new URL(`../../${path}`, import.meta.url)), false, path);\n  }\n  const retiredNames = retiredFiles.map((path) => path.split(\'/\').at(-1));\n  const paths = execFileSync(\'git\', [\'ls-files\', \'-z\'], { encoding: \'utf8\' })\n    .split(\'\\0\')\n    .filter(Boolean);\n  for (const path of paths) {\n    if (path === \'tools/ci/docs-disposition-canon.test.mjs\') continue;\n    if (!existsSync(new URL(`../../${path}`, import.meta.url))) continue;\n    let current = readRepoFile(path).replace(\n      /https:\\/\\/github\\.com\\/dunay2\\/dvt\\/(?:blob|tree)\\/[a-f0-9]{40}\\/[^\\s)\\]<>"`]+/gu,\n      \'\'\n    );\n    if (path === requiredFiles[0]) {\n      // The existing guard permits removal of fully absent forbidden subtrees.\n      // Exempt only this exact prohibition, never the owning document as a whole.\n      const prohibition =\n        \'forbiddenImplementationSurfaces:\\n  - .gh-comments/**\\n  - .git.bfg-report/**\\n\';\n      assert.equal(current.split(prohibition).length, 2, \'retired roots must remain forbidden\');\n      current = current.replace(prohibition, \'forbiddenImplementationSurfaces:\\n\');\n    }\n    for (const name of retiredNames) {\n      assert.equal(current.includes(name), false, `retired journal reference: ${path}: ${name}`);\n    }\n    for (const directory of retiredDirectories) {\n      assert.equal(\n        current.includes(`${directory}/`),\n        false,\n        `retired metadata ownership or reference: ${path}: ${directory}`\n      );\n    }\n  }\n  assertFilesExist([\n    \'docs/planning/state/github-mvp-issue-workflow.md\',\n    \'docs/planning/proposals/mandatory/frontend-and-ux/frontend-component-reflection-inventory-plan-20260604.md\',\n    \'docs/planning/proposals/mandatory/governance-and-docs/architecture-doc-reconciliation-plan-20260402.md\',\n  ]);\n});\n'
          assert sha(text.encode())=='1ce61a7c0ba0b4069628c034b85cd7139d4f8cf9e2939cd6d23a2bd1d6adcc6e'
          p.write_text(text)
          p=Path('docs/planning/status/system-governance-unit-index.units.yaml');before=p.read_bytes()
          assert sha(before)=='682375ad1e2c3cf95c5fcac69ae85c10c05d067ee4683ba57e56932a2b341143'
          text=before.decode()
          for line in ['      - .gh-comments/**\n','      - .git.bfg-report/**\n']:
              assert text.count(line)==1
              text=text.replace(line,'')
          assert sha(text.encode())=='098eeaaf7b3947b6fa519282b8026e6ec752ac744c17eeb501fc7fe8d1af2875'
          p.write_text(text)
          p=Path('docs/planning/proposals/mandatory/governance-and-docs/docs-disposition-canon-plan-20260524.md');before=p.read_bytes()
          assert sha(before)=='2d061384bf1d32307cc99b8202c008846b52860615cb1ecc3fbcb41b70cccbbf'
          text=before.decode();assert text.count('forbiddenImplementationSurfaces:\n')==1
          text=text.replace('forbiddenImplementationSurfaces:\n','forbiddenImplementationSurfaces:\n  - .gh-comments/**\n  - .git.bfg-report/**\n')
          assert sha(text.encode())=='a86a25bbbe80b2f3490c3b70cd1130de06342347e11feb76352a57f8acdfd499'
          p.write_text(text)
          for name in removed:
              p=Path(name);p.unlink();parent=p.parent
              while parent!=Path('.') and parent.exists() and not any(parent.iterdir()):
                  parent.rmdir();parent=parent.parent
          assert set(git('diff','--name-only','--diff-filter=D').decode().splitlines())==set(removed)
          assert set(git('diff','--name-only','--diff-filter=M').decode().splitlines())=={'tools/ci/docs-disposition-canon.test.mjs','docs/planning/status/system-governance-unit-index.units.yaml','docs/planning/proposals/mandatory/governance-and-docs/docs-disposition-canon-plan-20260524.md'}
          assert not git('ls-files','--others','--exclude-standard').strip()
          git('config','user.name','DVT documentation retirement')
          git('config','user.email','34416258+dunay2@users.noreply.github.com')
          git('add','-A');git('diff','--cached','--check')
          print('Exact 45 deletions and three source edits verified')
          PY
      - name: Setup canonical toolchain with enabled hooks
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 22.x
      - name: Commit source through canonical helper and hooks
        shell: bash
        run: |
          set -euo pipefail
          pnpm commit docs docs "Retire copied PR drafts and completed documentation journals" 2>&1 | tee /tmp/journal-retirement/source-commit.log
          git rev-parse HEAD > /tmp/journal-retirement/source-head.txt
          echo "GIT_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Bootstrap disposable CI DB without operated authority claims
        uses: ./.github/actions/prepare-planning-db
      - name: Regenerate canonical indexes and governance outputs
        shell: bash
        run: |
          set -euo pipefail
          pnpm docs:sync 2>&1 | tee /tmp/journal-retirement/docs-sync.log
          pnpm governance:refresh 2>&1 | tee /tmp/journal-retirement/governance-refresh.log
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes; no empty commit" | tee /tmp/journal-retirement/generated-commit.log
          else
            test "$(git diff --cached --name-only)" = docs/.manifest.json
            pnpm commit docs docs "Regenerate manifest after journal retirement" 2>&1 | tee /tmp/journal-retirement/generated-commit.log
          fi
          echo "GIT_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Validate retirement negatives preserved obligations and complete gates
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,json,os,re
          out=Path('/tmp/journal-retirement');base=os.environ['BASE']
          removed=json.loads((out/'removed.json').read_text());results=[]
          def git(*a):return subprocess.check_output(['git',*a]).decode().strip()
          def run(name,cmd,expected=0):
              r=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
              (out/(name+'.log')).write_text(r.stdout)
              results.append({'name':name,'command':cmd,'exitCode':r.returncode,'expectedExitCode':expected})
              (out/'validation.json').write_text(json.dumps(results,indent=2))
              print(name,r.returncode,flush=True);print('\n'.join(r.stdout.splitlines()[-10:]),flush=True)
              assert r.returncode==expected,(name,r.stdout[-6000:])
              return r.stdout
          assert set(git('diff','--name-only','--diff-filter=D',base,'HEAD').splitlines())==set(removed)
          assert not git('diff','--name-only','--diff-filter=A',base,'HEAD')
          allowed=set(removed)|{'tools/ci/docs-disposition-canon.test.mjs','docs/planning/status/system-governance-unit-index.units.yaml','docs/.manifest.json','docs/planning/proposals/mandatory/governance-and-docs/docs-disposition-canon-plan-20260524.md'}
          assert set(git('diff','--name-only',base,'HEAD').splitlines())<=allowed
          assert not git('diff','--name-only',base,'HEAD','--','apps','packages','specs','docs/adr','docs/evidence','docs/risk-register','.github','package.json','pnpm-lock.yaml')
          arc=run('arc',['node','tools/ci/arc-check.mjs']);start=re.search(r'^\{',arc,re.MULTILINE);assert start
          a=json.loads(arc[start.start():]);assert a['effectiveArcLevel']=='ARC-0'
          assert all(a['requirements'][k] is False for k in ['evidenceDoc','riskUpdate','rolloutNotes','compatMatrix'])
          cmd=['node','--test','--test-name-pattern=retired documentation-only closeouts|retired PR drafts','tools/ci/docs-disposition-canon.test.mjs']
          run('green-selected',cmd)
          for i,name in enumerate(removed):
              p=Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(subprocess.check_output(['git','show',base+':'+name]))
              try:run('restore-'+str(i+1),cmd,1)
              finally:
                  p.unlink();parent=p.parent
                  while parent!=Path('.') and parent.exists() and not any(parent.iterdir()):
                      parent.rmdir();parent=parent.parent
          p=Path('docs/planning/status/system-governance-unit-index.units.yaml');original=p.read_bytes()
          p.write_bytes(subprocess.check_output(['git','show',base+':'+str(p)]))
          try:run('restore-root-ownership',cmd,1)
          finally:p.write_bytes(original)
          p=Path('README.md');original=p.read_bytes();slug='docs/planning/status/20260402-command-logging-pane.md'
          for name,text,code in [('local',slug,1),('relative','[Old](../status/20260402-command-logging-pane.md)',1),('main','https://github.com/dunay2/dvt/blob/main/'+slug,1),('git','https://github.com/dunay2/dvt/blob/'+base+'/'+slug,0),('unrelated','The current command logging API is unchanged.',0)]:
              p.write_bytes(original+('\n'+text+'\n').encode())
              try:run('consumer-'+name,cmd,code)
              finally:p.write_bytes(original)
          p=Path('docs/planning/proposals/mandatory/governance-and-docs/docs-disposition-canon-plan-20260524.md');original=p.read_bytes()
          for name,mutated in [('missing-prohibition',original.replace(b'  - .gh-comments/**\n',b'')),('live-owner-link',original+b'\n[Stale](../../../../../../.gh-comments/pr-117.md)\n')]:
              p.write_bytes(mutated)
              try:run(name,cmd,1)
              finally:p.write_bytes(original)
          commands=[
           ['node','--test','scripts/check-feature-mechanization.test.cjs','scripts/documentation-publication.test.cjs','scripts/planning-db-surface-inventory-check.test.cjs','tools/ci/docs-disposition-canon.test.mjs','tools/ci/startup-card-canon.test.mjs','tools/ci/planner-package-governance.test.mjs','tools/ci/architecture-doc-reconciliation-canon.test.mjs'],
           ['pnpm','docs:sync:check'],['pnpm','docs:gov:manifest:check'],['pnpm','ci:docs'],['pnpm','verify:prepush'],
           ['pnpm','pr:validate-title','docs(docs): Retire copied PR drafts and completed documentation journals'],['git','diff','--exit-code','HEAD']]
          for i,c in enumerate(commands):run('validation-'+str(i+1),c)
          assert not git('status','--porcelain')
          (out/'validated.txt').write_text(git('rev-parse','HEAD')+'\n')
          PY
      - name: Export exact candidate and all validation evidence
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,json,hashlib,os
          out=Path('/tmp/journal-retirement');out.mkdir(exist_ok=True);base=os.environ['BASE']
          def git(*a):return subprocess.check_output(['git',*a])
          for name,args in {'head.txt':['rev-parse','HEAD'],'tree.txt':['rev-parse','HEAD^{tree}'],'commit.txt':['cat-file','commit','HEAD'],'status.txt':['status','--porcelain'],'stats.txt':['diff','--stat',base,'HEAD'],'candidate.patch':['diff',base,'HEAD'],'worktree.patch':['diff','HEAD'],'name-status.txt':['diff','--name-status',base,'HEAD'],'numstat.txt':['diff','--numstat',base,'HEAD'],'base-files.txt':['ls-tree','-rz',base],'head-files.txt':['ls-tree','-rz','HEAD']}.items():
              (out/name).write_bytes(git(*args))
          if (out/'source-head.txt').exists():(out/'source-commit.txt').write_bytes(git('cat-file','commit',(out/'source-head.txt').read_text().strip()))
          subprocess.run(['git','archive','--format=tar.gz','-o',str(out/'source.tar.gz'),'HEAD'],check=True)
          (out/'checksums.json').write_text(json.dumps({p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in out.iterdir() if p.is_file() and p.name!='checksums.json'},indent=2))
          print((out/'head.txt').read_text());print((out/'stats.txt').read_text())
          PY
      - name: Publish a new candidate branch only after successful validation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat /tmp/journal-retirement/validated.txt)" = "$(git rev-parse HEAD)"
          gh auth setup-git
          branch=docs/3004-retire-pr-drafts-and-completed-journals
          test -z "$(git ls-remote --heads origin "refs/heads/$branch")"
          git push origin "HEAD:refs/heads/$branch"
      - name: Upload exact source and evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr-draft-and-journal-retirement
          path: /tmp/journal-retirement
          retention-days: 7
