name: Docs Integration Repair
on:
  push:
    branches: [automation/3004-docs-integration-repair]
    paths: [.github/workflows/docs-integration-repair.yml]
permissions:
  contents: read
jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      BASE: b1778255afcc6392e54b887c79660005ed8754ad
      CANDIDATE: b060e2447b91988887293e7ec3f1d0df4846e7f5
      GIT_BASE: b1778255afcc6392e54b887c79660005ed8754ad
      PLANNING_DB_INTEGRITY_SCOPE: bootstrap
      TZ: UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b1778255afcc6392e54b887c79660005ed8754ad
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 22.x
      - name: Apply only the previously reviewed increment to merged main
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/next-retirement
          test "$(git rev-parse HEAD)" = "$BASE"
          test "$(git rev-parse HEAD^{tree})" = 95a2e262354e6d5582b67eeed27dd5f4d4e03c0d
          test "$(git rev-parse "$CANDIDATE^{tree}")" = e18e8450e81a8218639cb1e8ae8298d504080cd6
          test "$(git rev-parse "$CANDIDATE^")" = 05b09c5c15e8defc9634db6a52be8e2f7f0f7052
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git cherry-pick --no-commit "$CANDIDATE"
          test "$(git write-tree)" = e18e8450e81a8218639cb1e8ae8298d504080cd6
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,json,os
          out=Path('/tmp/next-retirement');base=os.environ['BASE']
          def git(*a):return subprocess.check_output(['git',*a]).decode().strip()
          removed=git('diff','--cached','--name-only','--diff-filter=D').splitlines()
          assert len(removed)==25
          assert all(p.startswith('docs/planning/closeouts/') and p.endswith('.md') for p in removed)
          assert git('diff','--cached','--name-only','--diff-filter=M')=='tools/ci/docs-disposition-canon.test.mjs'
          assert not git('diff','--cached','--name-only','--diff-filter=A')
          (out/'removed.json').write_text(json.dumps(removed,indent=2))
          command=['node','--test','--test-name-pattern=retired documentation-only closeouts','tools/ci/docs-disposition-canon.test.mjs']
          for name in removed:Path(name).write_bytes(subprocess.check_output(['git','show',base+':'+name]))
          try:
              r=subprocess.run(command,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              (out/'red-before-removal.log').write_text(r.stdout);assert r.returncode==1
          finally:
              for name in removed:Path(name).unlink()
          git('diff','--cached','--check')
          PY
      - name: Commit through normal helper and hooks
        shell: bash
        run: |
          set -euo pipefail
          pnpm commit docs docs "Retire obsolete HTTP Canvas and planning journals" 2>&1 | tee /tmp/next-retirement/source-commit.log
          git rev-parse HEAD > /tmp/next-retirement/source-head.txt
          echo "GIT_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Prepare disposable CI bootstrap not operated architecture authority
        uses: ./.github/actions/prepare-planning-db
      - name: Regenerate canonical documentation projections
        shell: bash
        run: |
          set -euo pipefail
          pnpm docs:sync 2>&1 | tee /tmp/next-retirement/docs-sync.log
          pnpm governance:refresh 2>&1 | tee /tmp/next-retirement/governance-refresh.log
          git add -A
          if ! git diff --cached --quiet; then
            test "$(git diff --cached --name-only)" = docs/.manifest.json
            pnpm commit docs docs "Regenerate inventory after journal retirement" 2>&1 | tee /tmp/next-retirement/generated-commit.log
          fi
          echo "GIT_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Validate new base final head and individual restoration controls
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,json,os,re
          out=Path('/tmp/next-retirement');base=os.environ['BASE'];results=[]
          def git(*a):return subprocess.check_output(['git',*a]).decode().strip()
          def run(name,cmd,expected=0):
              r=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True)
              (out/(name+'.log')).write_text(r.stdout+'\nSTDERR\n'+r.stderr)
              results.append({'name':name,'command':cmd,'exitCode':r.returncode,'expectedExitCode':expected})
              (out/'validation.json').write_text(json.dumps(results,indent=2))
              print(name,r.returncode,flush=True)
              assert r.returncode==expected,(name,r.stdout[-4000:],r.stderr[-4000:])
              return r.stdout
          removed=json.loads((out/'removed.json').read_text())
          assert set(git('diff','--name-only','--diff-filter=D',base,'HEAD').splitlines())==set(removed)
          assert not git('diff','--name-only','--diff-filter=A',base,'HEAD')
          allowed=set(removed)|{'docs/.manifest.json','tools/ci/docs-disposition-canon.test.mjs'}
          assert set(git('diff','--name-only',base,'HEAD').splitlines())<=allowed
          assert not git('diff','--name-only',base,'HEAD','--','apps','packages','specs','docs/adr','docs/contracts','docs/evidence','docs/risk-register','docs/planning/proposals','buzon','.github','package.json','pnpm-lock.yaml')
          text=run('arc',['node','tools/ci/arc-check.mjs']);m=re.search(r'^\{',text,re.MULTILINE);assert m
          arc=json.loads(text[m.start():]);assert arc['effectiveArcLevel']=='ARC-0'
          assert all(arc['requirements'][k] is False for k in ['evidenceDoc','riskUpdate','rolloutNotes','compatMatrix'])
          cmd=['node','--test','--test-name-pattern=retired documentation-only closeouts','tools/ci/docs-disposition-canon.test.mjs']
          run('green-selected',cmd)
          for i,name in enumerate(removed):
              p=Path(name);p.write_bytes(subprocess.check_output(['git','show',base+':'+name]))
              try:run('restore-'+str(i+1),cmd,1)
              finally:p.unlink()
          p=Path('README.md');original=p.read_bytes();slug=removed[0]
          for name,text,code in [('relative','[Old]('+slug+')',1),('main','https://github.com/dunay2/dvt/blob/main/'+slug,1),('git','https://github.com/dunay2/dvt/blob/'+base+'/'+slug,0),('unrelated','Current Canvas and HTTP contracts remain unchanged.',0)]:
              p.write_bytes(original+('\n'+text+'\n').encode())
              try:run('consumer-'+name,cmd,code)
              finally:p.write_bytes(original)
          run('governance-tests',['node','--test','scripts/check-feature-mechanization.test.cjs','scripts/documentation-publication.test.cjs','scripts/planning-db-surface-inventory-check.test.cjs','tools/ci/docs-disposition-canon.test.mjs','tools/ci/startup-card-canon.test.mjs','tools/ci/planner-package-governance.test.mjs','tools/ci/architecture-doc-reconciliation-canon.test.mjs','scripts/governance-refresh.test.cjs','tools/ci/emit-test-matrix.test.mjs','tools/ci/turbo-workspace-task-contract.test.mjs'])
          for name,cmd in [('sync',['pnpm','docs:sync:check']),('manifest',['pnpm','docs:gov:manifest:check']),('docs',['pnpm','ci:docs']),('prepush',['pnpm','verify:prepush']),('title',['pnpm','pr:validate-title','docs(docs): Retire obsolete HTTP Canvas and planning journals']),('clean',['git','diff','--exit-code','HEAD'])]:run(name,cmd)
          assert not git('status','--porcelain')
          assert git('rev-parse','HEAD^{tree}')=='e18e8450e81a8218639cb1e8ae8298d504080cd6'
          (out/'validated.txt').write_text(git('rev-parse','HEAD')+'\n')
          PY
      - name: Export exact sources and verification evidence
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,json,hashlib,os
          out=Path('/tmp/next-retirement');out.mkdir(exist_ok=True);base=os.environ['BASE']
          for name,args in {'head.txt':['rev-parse','HEAD'],'tree.txt':['rev-parse','HEAD^{tree}'],'commit.txt':['cat-file','commit','HEAD'],'head-files.txt':['ls-tree','-rz','HEAD'],'status.txt':['status','--porcelain'],'candidate.patch':['diff',base,'HEAD'],'numstat.txt':['diff','--numstat',base,'HEAD'],'name-status.txt':['diff','--name-status',base,'HEAD'],'stats.txt':['diff','--stat',base,'HEAD']}.items():
              (out/name).write_bytes(subprocess.check_output(['git',*args]))
          if (out/'source-head.txt').exists():(out/'source-commit.txt').write_bytes(subprocess.check_output(['git','cat-file','commit',(out/'source-head.txt').read_text().strip()]))
          subprocess.run(['git','archive','--format=tar.gz','-o',str(out/'source.tar.gz'),'HEAD'],check=True)
          (out/'checksums.json').write_text(json.dumps({p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in out.iterdir() if p.is_file() and p.name!='checksums.json'},indent=2))
          print((out/'head.txt').read_text());print((out/'stats.txt').read_text())
          PY
      - name: Publish next-cut branch only after all checks pass
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat /tmp/next-retirement/validated.txt)" = "$(git rev-parse HEAD)"
          gh auth setup-git
          branch=docs/3004-retire-http-canvas-planning-journals
          test -z "$(git ls-remote --heads origin refs/heads/$branch)"
          git push origin HEAD:refs/heads/$branch
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: docs-http-canvas-planning-retirement
          path: /tmp/next-retirement
          retention-days: 7
