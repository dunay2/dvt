name: Docs Integration Repair

on:
  push:
    branches: [automation/3004-docs-integration-repair]
    paths: [.github/workflows/docs-integration-repair.yml]

permissions:
  contents: read
  actions: read

jobs:
  retire:
    name: Validate exact reviewed atlas and Canvas retirement
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    env:
      BASE: c76f0f3c476396b73d37ea0181caa0a8862e658a
      GIT_BASE: c76f0f3c476396b73d37ea0181caa0a8862e658a
      PLANNING_DB_INTEGRITY_SCOPE: bootstrap
      TZ: UTC
    steps:
      - name: Checkout exact current main without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c76f0f3c476396b73d37ea0181caa0a8862e658a
          fetch-depth: 0
          persist-credentials: false
      - name: Apply the reviewed hash-verified data specification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,json,hashlib,os,zipfile,io,collections
          out=Path('/tmp/atlas-retirement');out.mkdir(exist_ok=True)
          base=os.environ['BASE']
          def git(*args):return subprocess.check_output(['git',*args])
          def digest(data):return hashlib.sha256(data).hexdigest()
          assert git('rev-parse','HEAD').decode().strip()==base
          archive=subprocess.check_output(['gh','api','repos/dunay2/dvt/actions/artifacts/10546622246/zip'])
          assert digest(archive)=='3482b8db0a1e341e617227a2ab15d3d1ac9bf9263d98bde5805751b04c98174d'
          z=zipfile.ZipFile(io.BytesIO(archive));raw=z.read('spec.json')
          assert digest(raw)=='48e1cabe91cc21c4214a53388017b5367627efa75f062b98f0bc4bd1b86ba4d6'
          spec=json.loads(raw);assert spec['base']==base
          assert len(spec['deletions'])==11 and len(spec['originals'])==15
          # Artifact is data only. Execute no downloaded program.
          for p,sha in {**spec['deletions'],**spec['originals']}.items():
              assert not Path(p).is_absolute() and '..' not in Path(p).parts,p
              assert digest(Path(p).read_bytes())==sha,p
          grouped=collections.defaultdict(list)
          for edit in spec['edits']:grouped[edit['path']].append(edit)
          assert set(grouped)==set(spec['originals'])
          for p,edits in grouped.items():
              text=Path(p).read_text()
              for e in edits:
                  if e.get('append'):text+=e['after']
                  else:
                      assert text.count(e['before'])==e['count'],p
                      text=text.replace(e['before'],e['after'])
              assert digest(text.encode())==spec['expectedEdits'][p],p
              Path(p).write_bytes(text.encode())
          (out/'spec.json').write_bytes(raw)
          cmd=['node','--test','--test-name-pattern=retired atlas and superseded Canvas','tools/ci/docs-disposition-canon.test.mjs']
          red=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
          (out/'red.log').write_text(red.stdout)
          assert red.returncode==1 and 'docs/architecture/atlas' in red.stdout,red.stdout
          for p in spec['deletions']:Path(p).unlink()
          for p in sorted(Path('docs/architecture/atlas').rglob('*'),reverse=True):
              if p.is_dir():p.rmdir()
          Path('docs/architecture/atlas').rmdir()
          git('config','user.name','DVT documentation retirement')
          git('config','user.email','34416258+dunay2@users.noreply.github.com')
          git('add','-A');git('diff','--cached','--check')
          assert set(git('diff','--cached','--name-only').decode().splitlines())==set(spec['deletions'])|set(spec['originals'])
          print('Same exact reviewed specification applied; RED demonstrated; eleven deletions and fifteen source edits')
          PY
      - name: Setup canonical toolchain with enabled hooks
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 22.x
      - name: Prepare disposable CI bootstrap database only
        uses: ./.github/actions/prepare-planning-db
      - name: Generate documentation and governance through canonical owners
        shell: bash
        run: |
          set -euo pipefail
          pnpm docs:sync 2>&1 | tee /tmp/atlas-retirement/docs-sync.log
          pnpm governance:refresh 2>&1 | tee /tmp/atlas-retirement/governance-refresh.log
          git add -A
      - name: Commit through canonical helper and enabled hooks
        shell: bash
        run: |
          set -euo pipefail
          pnpm commit docs docs "Retire historical atlas and superseded Canvas guidance" 2>&1 | tee /tmp/atlas-retirement/commit.log
          echo "GIT_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Verify scope, regressions, negative controls and all repository gates
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,json,os,shutil,re
          out=Path('/tmp/atlas-retirement');spec=json.loads((out/'spec.json').read_text());base=os.environ['BASE']
          def git(*a):return subprocess.check_output(['git',*a]).decode().strip()
          assert git('show','-s','--format=%P','HEAD')==base
          assert git('rev-parse','HEAD^{tree}')=='bb1966f302c7374545475381cad64c272aba96ba'
          assert set(git('diff','--name-only','--diff-filter=D',base,'HEAD').splitlines())==set(spec['deletions'])
          assert not git('diff','--name-only','--diff-filter=A',base,'HEAD')
          allowed=set(spec['originals'])|set(spec['deletions'])|{'docs/architecture/index.md','docs/.manifest.json'}
          assert set(git('diff','--name-only',base,'HEAD').splitlines())<=allowed
          assert not git('diff','--name-only',base,'HEAD','--','apps','packages','specs','docs/adr','docs/evidence','docs/risk-register','.github','package.json','pnpm-lock.yaml')
          results=[]
          def run(name,cmd,expected=0,marker=None):
              r=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
              (out/(name+'.log')).write_text(r.stdout)
              results.append({'name':name,'command':cmd,'exitCode':r.returncode,'expectedExitCode':expected})
              (out/'validation.json').write_text(json.dumps(results,indent=2))
              print(name,r.returncode,flush=True);print('\n'.join(r.stdout.splitlines()[-10:]),flush=True)
              assert r.returncode==expected,(name,r.stdout[-6000:])
              if marker:assert marker in r.stdout,(name,marker,r.stdout[-6000:])
              return r.stdout
          arc=run('arc',['node','tools/ci/arc-check.mjs'])
          # Evaluator prints an informational [ARC] line before its JSON object.
          # Preserve the complete log and require exactly one trailing JSON report.
          start=re.search(r'^\{',arc,re.MULTILINE)
          assert start is not None,arc
          a=json.loads(arc[start.start():]);assert a['effectiveArcLevel']=='ARC-0'
          assert all(a['requirements'][k] is False for k in ['evidenceDoc','riskUpdate','rolloutNotes','compatMatrix'])
          cmd=['node','--test','--test-name-pattern=retired atlas and superseded Canvas','tools/ci/docs-disposition-canon.test.mjs']
          run('green',cmd)
          for i,p in enumerate(spec['deletions']):
              target=Path(p);target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(subprocess.check_output(['git','show',base+':'+p]))
              try:run('restore-'+str(i+1),cmd,1,p if '/atlas/' not in p else 'docs/architecture/atlas')
              finally:
                  target.unlink()
                  if Path('docs/architecture/atlas').exists():shutil.rmtree('docs/architecture/atlas')
          p=Path('README.md');original=p.read_bytes();slug='docs/architecture/atlas/index.md'
          cases=[('local',slug,1),('main','https://github.com/dunay2/dvt/blob/main/'+slug,1),('git','https://github.com/dunay2/dvt/blob/'+base+'/'+slug,0)]
          for name,text,expected in cases:
              p.write_bytes(original+('\n'+text+'\n').encode())
              try:run('consumer-'+name,cmd,expected)
              finally:p.write_bytes(original)
          p=Path('scripts/sync-docs.cjs');original=p.read_bytes()
          p.write_bytes(subprocess.check_output(['git','show',base+':scripts/sync-docs.cjs']))
          try:run('restore-generator',cmd,1,'scripts/sync-docs.cjs')
          finally:p.write_bytes(original)
          commands=[
              ['node','--test','scripts/documentation-publication.test.cjs','scripts/planning-db-surface-inventory-check.test.cjs','tools/ci/docs-disposition-canon.test.mjs','tools/ci/startup-card-canon.test.mjs','tools/ci/planner-package-governance.test.mjs','tools/ci/architecture-doc-reconciliation-canon.test.mjs'],
              ['pnpm','docs:sync:check'],['pnpm','docs:gov:manifest:check'],['pnpm','ci:docs'],['pnpm','verify:prepush'],
              ['pnpm','pr:validate-title','docs(docs): Retire historical atlas and superseded Canvas guidance'],['git','diff','--exit-code','HEAD'],
          ]
          for i,c in enumerate(commands):run('validation-'+str(i+1),c)
          assert not git('status','--porcelain')
          (out/'validated.txt').write_text(git('rev-parse','HEAD')+'\n')
          PY
      - name: Export exact candidate and source evidence
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,json,hashlib,os
          out=Path('/tmp/atlas-retirement');out.mkdir(exist_ok=True);base=os.environ['BASE']
          def git(*a):return subprocess.check_output(['git',*a])
          for name,args in {'head.txt':['rev-parse','HEAD'],'tree.txt':['rev-parse','HEAD^{tree}'],'commit.txt':['cat-file','commit','HEAD'],'status.txt':['status','--porcelain'],'stats.txt':['diff','--stat',base,'HEAD'],'candidate.patch':['diff',base,'HEAD'],'worktree.patch':['diff','HEAD'],'name-status.txt':['diff','--name-status',base,'HEAD'],'numstat.txt':['diff','--numstat',base,'HEAD'],'base-files.txt':['ls-tree','-rz',base],'head-files.txt':['ls-tree','-rz','HEAD']}.items():
              (out/name).write_bytes(git(*args))
          subprocess.run(['git','archive','--format=tar.gz','-o',str(out/'source.tar.gz'),'HEAD'],check=True)
          checks={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in out.iterdir() if p.is_file() and p.name!='checksums.json'}
          (out/'checksums.json').write_text(json.dumps(checks,indent=2))
          print((out/'head.txt').read_text());print((out/'stats.txt').read_text())
          PY
      - name: Publish only validated branch with normal push
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat /tmp/atlas-retirement/validated.txt)" = "$(git rev-parse HEAD)"
          gh auth setup-git
          branch=docs/3004-retire-atlas-and-canvas-history
          test -z "$(git ls-remote --heads origin "refs/heads/$branch")"
          git push origin "HEAD:refs/heads/$branch"
      - name: Upload candidate and validation artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: atlas-canvas-retirement
          path: /tmp/atlas-retirement
          retention-days: 7
