name: Docs Integration Repair

on:
  push:
    branches: [automation/3004-docs-integration-repair]
    paths: [.github/workflows/docs-integration-repair.yml]

permissions:
  contents: read
  actions: read

jobs:
  retire:
    name: Validate superseded proposal retirement after merged 3232
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE: db43c857a8319b356fda98bab78c7dfb55b4606b
      GIT_BASE: db43c857a8319b356fda98bab78c7dfb55b4606b
      PLANNING_DB_INTEGRITY_SCOPE: bootstrap
      TZ: UTC
    steps:
      - name: Checkout exact merged main without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: db43c857a8319b356fda98bab78c7dfb55b4606b
          fetch-depth: 0
          persist-credentials: false
      - name: Apply hash-verified six-file retirement and reviewed consumer edits
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,subprocess,json,hashlib,base64,zlib,os,collections
          out=pathlib.Path('/tmp/retirement-result');out.mkdir(exist_ok=True)
          def git(*args):return subprocess.check_output(['git',*args])
          assert git('rev-parse','HEAD').decode().strip()==os.environ['BASE']
          assert git('rev-parse','HEAD^{tree}').decode().strip()=='f368d3fe9a5bbcc7284321791cc88be4b95c66c9'
          encoded=''
          # Compressed JSON is data only; decoded specification is exported for review.
          raw=zlib.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(raw).hexdigest()=='a4b28e17d34c17eb79e0bc14d4b65011dfc337836fe3d3fff1e27e560958a7cb'
          spec=json.loads(raw);assert len(spec['deletions'])==6
          (out/'reviewed-specification.json').write_bytes(raw)
          grouped=collections.defaultdict(list)
          for edit in spec['edits']:grouped[edit['path']].append(edit)
          assert len(grouped)==15
          for path,edits in grouped.items():
              p=pathlib.Path(path);original=p.read_bytes()
              assert all(hashlib.sha256(original).hexdigest()==e['sha256'] for e in edits),path
              text=original.decode()
              for e in edits:
                  assert text.count(e['before'])==1,(path,e['before'])
                  text=text.replace(e['before'],e['after'].replace('__PIN__',os.environ['BASE']))
              p.write_bytes(text.encode())
          red=subprocess.run(['node','--test','tools/ci/docs-disposition-canon.test.mjs'],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
          (out/'retirement-guard-red.log').write_text(red.stdout)
          assert red.returncode==1 and 'docs/planning/proposals/superseded/runtime-and-contracts' in red.stdout
          for path,sha in spec['deletions'].items():
              p=pathlib.Path(path);original=p.read_bytes()
              assert hashlib.sha256(original).hexdigest()==sha,path
              assert 'status: Superseded\n' in original.decode(),path
              p.unlink()
          pathlib.Path('docs/planning/proposals/superseded/runtime-and-contracts').rmdir()
          git('add','-A')
          git('diff','--cached','--check')
          git('config','user.name','DVT documentation retirement')
          git('config','user.email','34416258+dunay2@users.noreply.github.com')
          git('config','commit.gpgsign','false')
          assert set(git('diff','--cached','--name-only').decode().splitlines())==set(spec['deletions'])|set(grouped)
          print('Six explicitly superseded proposals removed; fifteen reviewed consumers/test files edited; negative guard proved')
          PY
      - name: Setup canonical toolchain and enabled hooks
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 22.x
      - name: Prepare disposable CI bootstrap database only
        uses: ./.github/actions/prepare-planning-db
      - name: Regenerate canonical documentation and governance outputs
        shell: bash
        run: |
          pnpm docs:sync
          pnpm governance:refresh
          git add -A
      - name: Commit through canonical helper and hooks
        shell: bash
        run: |
          pnpm commit docs docs "Remove explicitly superseded runtime proposals"
          echo "GIT_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Verify scope and surviving provenance
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,subprocess,json,os,re
          out=pathlib.Path('/tmp/retirement-result');spec=json.loads((out/'reviewed-specification.json').read_text())
          def git(*args):return subprocess.check_output(['git',*args]).decode().strip()
          assert git('show','-s','--format=%P','HEAD').split()==[os.environ['BASE']]
          changed=git('diff','--name-only',os.environ['BASE'],'HEAD').splitlines()
          assert all(p.startswith('docs/') or p=='tools/ci/docs-disposition-canon.test.mjs' for p in changed),changed
          assert not git('diff','--name-only','--diff-filter=A',os.environ['BASE'],'HEAD')
          assert set(git('diff','--name-only','--diff-filter=D',os.environ['BASE'],'HEAD').splitlines())==set(spec['deletions'])
          slugs=[pathlib.Path(p).name for p in spec['deletions']];bad=[];pins=[]
          for path in git('ls-files').splitlines():
              p=pathlib.Path(path)
              try:text=p.read_text()
              except (UnicodeError,ValueError):continue
              for url in re.findall(r'https?://[^\s)\]<>"`]+',text):
                  if any(slug in url for slug in slugs):
                      assert url.startswith('https://github.com/dunay2/dvt/blob/'+os.environ['BASE']+'/'),(path,url)
                      pins.append({'path':path,'url':url})
              local=re.sub(r'https?://[^\s)\]<>"`]+','',text)
              for slug in slugs:
                  if slug in local:bad.append({'path':path,'target':slug})
          assert not bad,bad
          (out/'backlinks.json').write_text(json.dumps({'remainingLocalReferences':bad,'preservedGitProvenance':pins},indent=2))
          print('No remaining local references; exact Git provenance preserved; no new documents or product changes')
          PY
      - name: Run regressions and canonical validation
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess,pathlib,json,sys
          out=pathlib.Path('/tmp/retirement-result');results=[]
          commands=[
            ['node','--test','scripts/documentation-publication.test.cjs','scripts/planning-db-surface-inventory-check.test.cjs','tools/ci/docs-disposition-canon.test.mjs'],
            ['pnpm','docs:sync:check'],
            ['pnpm','docs:gov:manifest:check'],
            ['pnpm','ci:docs'],
            ['pnpm','verify:prepush'],
            ['pnpm','pr:validate-title','docs(docs): Remove explicitly superseded runtime proposals'],
            ['git','diff','--exit-code','HEAD'],
          ]
          for i,cmd in enumerate(commands):
              r=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
              name=f'validation-{i+1}.log';(out/name).write_text(r.stdout)
              results.append({'command':cmd,'exitCode':r.returncode,'log':name})
              (out/'validation.json').write_text(json.dumps(results,indent=2))
              print('COMMAND',cmd,'EXIT',r.returncode,flush=True)
              print('\n'.join(r.stdout.splitlines()[-25:]),flush=True)
              if r.returncode:sys.exit(r.returncode)
          (out/'validated.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD']).decode())
          PY
      - name: Export exact commit and source evidence
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,subprocess,json,os,hashlib,base64
          out=pathlib.Path('/tmp/retirement-result');out.mkdir(exist_ok=True)
          def git(*args):return subprocess.check_output(['git',*args])
          head=git('rev-parse','HEAD').decode().strip();base=os.environ['BASE']
          (out/'head.txt').write_text(head+'\n')
          (out/'status.txt').write_bytes(git('status','--short'))
          (out/'stats.txt').write_bytes(git('diff','--stat',base,head))
          (out/'candidate.patch').write_bytes(git('diff',base,head))
          subprocess.run(['git','archive','--format=tar.gz','-o',str(out/'source.tar.gz'),head],check=True)
          parents=git('show','-s','--format=%P','HEAD').decode().strip().split();tree=git('rev-parse','HEAD^{tree}').decode().strip()
          def person(prefix):
              values=git('show','-s','--format=%'+prefix+'n%x00%'+prefix+'e%x00%'+prefix+'I','HEAD').decode().strip().split('\0')
              return dict(zip(['name','email','date'],values))
          commit={'message':git('cat-file','commit',head).decode().split('\n\n',1)[1],'tree':tree,'parents':parents,'author':person('a'),'committer':person('c')}
          info={'head':head,'tree':tree,'parents':parents,'base':base,'baseTree':git('rev-parse',base+'^{tree}').decode().strip(),'commitPayload':commit,'treeElements':[],'newBlobs':[]}
          raw=git('diff','--raw','--no-renames','-z',base,head).split(b'\0')
          for i in range(0,len(raw)-1,2):
              f=raw[i].decode().split();p=raw[i+1].decode();deleted=f[-1]=='D'
              sha=None if deleted else git('rev-parse',head+':'+p).decode().strip()
              info['treeElements'].append({'path':p,'mode':f[0][1:] if deleted else f[1],'type':'blob','sha':sha})
          for line in git('rev-list','--objects',head,'^'+base).decode().splitlines():
              sha=line.split(' ',1)[0]
              if git('cat-file','-t',sha).strip()==b'blob':
                  info['newBlobs'].append({'sha':sha,'encoding':'base64','content':base64.b64encode(git('cat-file','blob',sha)).decode()})
          (out/'objects.json').write_text(json.dumps(info,ensure_ascii=False))
          (out/'checksums.json').write_text(json.dumps({p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in out.iterdir() if p.is_file() and p.name!='checksums.json'},indent=2))
          print(json.dumps({k:v for k,v in info.items() if k not in ('treeElements','newBlobs','commitPayload')},indent=2))
          PY
      - name: Upload source and validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: superseded-runtime-retirement
          path: /tmp/retirement-result
          retention-days: 7

  objects:
    name: Transfer validated exact Git objects without publishing refs
    needs: retire
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Transfer verified blobs tree and hook-created commit only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess,json,os,zipfile,io,hashlib,base64
          repo=os.environ['GITHUB_REPOSITORY'];run=os.environ['GITHUB_RUN_ID']
          def api(path,data=None):
              args=['gh','api','repos/'+repo+'/'+path]
              if data is not None:args+=['--method','POST','--input','-']
              return subprocess.check_output(args,input=None if data is None else json.dumps(data).encode())
          matches=[x for x in json.loads(api('actions/runs/'+run+'/artifacts'))['artifacts'] if x['name']=='superseded-runtime-retirement'];assert len(matches)==1
          artifact=matches[0];raw=api('actions/artifacts/'+str(artifact['id'])+'/zip')
          assert 'sha256:'+hashlib.sha256(raw).hexdigest()==artifact['digest']
          z=zipfile.ZipFile(io.BytesIO(raw))
          for p,sha in json.loads(z.read('checksums.json')).items():assert hashlib.sha256(z.read(p)).hexdigest()==sha,p
          obj=json.loads(z.read('objects.json'));assert obj['base']=='db43c857a8319b356fda98bab78c7dfb55b4606b'
          assert obj['parents']==[obj['base']]
          assert z.read('validated.txt').decode().strip()==obj['head']
          results=json.loads(z.read('validation.json'));assert len(results)==7 and all(x['exitCode']==0 for x in results)
          assert z.read('status.txt').strip()==b''
          assert json.loads(z.read('backlinks.json'))['remainingLocalReferences']==[]
          for blob in obj['newBlobs']:
              data=base64.b64decode(blob['content']);sha=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest();assert sha==blob['sha']
              returned=json.loads(api('git/blobs',{'encoding':'base64','content':blob['content']}));assert returned['sha']==sha
          result=json.loads(api('git/trees',{'base_tree':obj['baseTree'],'tree':obj['treeElements']}));assert result['sha']==obj['tree']
          commit=json.loads(api('git/commits',obj['commitPayload']));assert commit['sha']==obj['head'],(commit['sha'],obj['head'])
          print('Verified exact hook-created commit transferred:',commit['sha'])
          print('No branch, PR, protection or main update performed')
          PY
