name: Docs Integration Repair

on:
  push:
    branches: [automation/3004-docs-integration-repair]
    paths: [.github/workflows/docs-integration-repair.yml]

permissions:
  contents: read

concurrency:
  group: docs-integration-repair-3004
  cancel-in-progress: true

jobs:
  diagnose:
    name: Diagnose remaining documentation integration gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GIT_BASE: 88b7922f7246386959700da5866e330076f8dd97
      GIT_HEAD: b0df12d516b49983f0c0c58374714d1eb0c71bf7
      PLANNING_DB_INTEGRITY_SCOPE: bootstrap
    steps:
      - name: Checkout exact candidate without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b0df12d516b49983f0c0c58374714d1eb0c71bf7
          fetch-depth: 0
          persist-credentials: false

      - name: Export only tracked source and exact tree identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/docs-source" "$RUNNER_TEMP/docs-diagnostics"
          git archive --format=tar.gz --output="$RUNNER_TEMP/docs-source/source.tar.gz" HEAD
          git archive --format=tar.gz --output="$RUNNER_TEMP/docs-source/base-docs.tar.gz" "$GIT_BASE" docs
          git ls-tree -rz HEAD > "$RUNNER_TEMP/docs-source/tree.bin"
          git diff --name-status -z "$GIT_BASE" HEAD > "$RUNNER_TEMP/docs-source/changes.bin"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/docs-source/identity.txt"

      - name: Upload temporary tracked source for inspection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: docs-source-b0df12d5
          path: ${{ runner.temp }}/docs-source/
          retention-days: 1
          if-no-files-found: error

      - name: Setup existing toolchain
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 22.x

      - name: Prepare the existing disposable CI database
        uses: ./.github/actions/prepare-planning-db

      - name: Execute all remaining diagnostics independently
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, shlex, subprocess
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'docs-diagnostics'
          commands = [
            ['pnpm', 'docs:gov:filenames:changed'],
            ['pnpm', 'docs:gov:frontmatter:changed'],
            ['pnpm', 'docs:gov:links:changed'],
            ['pnpm', 'docs:gov:generated-policy'],
            ['pnpm', 'docs:governance:unit-coverage'],
            ['pnpm', 'docs:governance:changed-files:check'],
            ['pnpm', 'docs:feature-mechanization'],
            ['pnpm', 'docs:feature-mechanization:implementation'],
            ['pnpm', 'docs:sync:check'],
            ['pnpm', 'docs:gov:manifest:check'],
            ['pnpm', 'ci:docs'],
            ['pnpm', 'verify:prepush'],
          ]
          rows = []
          for index, command in enumerate(commands):
            label = shlex.join(command)
            try:
              result = subprocess.run(command, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=240)
              code, text = result.returncode, result.stdout
            except subprocess.TimeoutExpired as error:
              code, text = 124, error.stdout or b''
              if isinstance(text, bytes):
                text = text.decode('utf-8', errors='replace')
              text += '\nDIAGNOSTIC TIMEOUT\n'
            logfile = f'{index:02d}.log'
            (output / logfile).write_text(text, encoding='utf-8')
            rows.append({'command': command, 'exitCode': code, 'log': logfile})
            print(f'CHECK {code}: {label}', flush=True)
            if code:
              print(text[-7000:], flush=True)
          (output / 'results.json').write_text(json.dumps(rows, indent=2), encoding='utf-8')
          changed = subprocess.check_output(['git', 'diff', '--name-only', '-z', 'HEAD', '--', 'docs', 'scripts', 'tools', 'package.json']).decode().split('\0')
          files = [{'path': name, 'content': pathlib.Path(name).read_text() if pathlib.Path(name).exists() else None} for name in changed if name]
          (output / 'repairs.json').write_text(json.dumps({'base': os.environ['GIT_HEAD'], 'files': files}, indent=2))
          raise SystemExit(1 if any(row['exitCode'] for row in rows) else 0)
          PY

      - name: Upload diagnostics including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: docs-diagnostics-b0df12d5
          path: ${{ runner.temp }}/docs-diagnostics/
          retention-days: 1
          if-no-files-found: warn
