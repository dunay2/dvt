name: Docs Integration Repair

on:
  push:
    branches: [automation/3004-docs-integration-repair]
    paths: [.github/workflows/docs-integration-repair.yml]

permissions:
  contents: read

jobs:
  verify:
    name: Verify exact planning-retirement candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GIT_BASE: bec9a00d48ce1f02ec26199f670fcf1757680ad7
      GIT_HEAD: d4276ce078a649e04782c5f7c9f01e23b9e71301
      PLANNING_DB_INTEGRITY_SCOPE: bootstrap
    steps:
      - name: Checkout exact published candidate without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d4276ce078a649e04782c5f7c9f01e23b9e71301
          fetch-depth: 0
          persist-credentials: false
      - name: Setup existing toolchain
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 22.x
      - name: Prepare existing disposable CI database
        uses: ./.github/actions/prepare-planning-db
      - name: Require generated documentation to match HEAD
        run: |
          pnpm docs:sync:check
          pnpm docs:gov:manifest:check
      - name: Validate the documentation contract in CI scope
        run: pnpm ci:docs
      - name: Run canonical pre-push checks
        run: pnpm verify:prepush
      - name: Run actual affected regression suites
        run: node --test scripts/documentation-publication.test.cjs scripts/planning-db-surface-inventory-check.test.cjs tools/ci/docs-disposition-canon.test.mjs
      - name: Prove current contract and retirement checks fail closed
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, subprocess
          current = pathlib.Path('docs/contracts/traceability/index.md')
          content = current.read_bytes()
          try:
              current.unlink()
              result = subprocess.run(['node', 'scripts/docs-quality-check.cjs'], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              assert result.returncode != 0, 'Missing current contract was incorrectly accepted'
              assert 'docs/contracts/traceability/index.md -> required canonical surface is missing.' in result.stdout
              print('PASS negative control: missing current traceability contract is rejected')
          finally:
              current.write_bytes(content)
          archive = pathlib.Path('docs/planning/archive')
          assert not archive.exists()
          command = ['node', '--test', '--test-name-pattern=retired historical packs and generators cannot return', 'tools/ci/docs-disposition-canon.test.mjs']
          try:
              archive.mkdir()
              result = subprocess.run(command, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              assert result.returncode != 0, 'Reintroduced planning archive was incorrectly accepted'
              assert 'docs/planning/archive' in result.stdout
              print('PASS negative control: restored planning archive is rejected')
          finally:
              archive.rmdir()
          subprocess.run(command, check=True)
          print('PASS final retirement rerun after removing both controlled mutations')
          PY
      - name: Require a clean tracked worktree
        run: git diff --exit-code HEAD
