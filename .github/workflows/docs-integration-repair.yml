name: Docs Integration Repair

on:
  push:
    branches: [automation/3004-docs-integration-repair]
    paths: [.github/workflows/docs-integration-repair.yml]

permissions:
  contents: read
  actions: read

jobs:
  reconcile:
    name: Validate exact retirement candidate with canonical risk filenames
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RETIREMENT_HEAD: fbdb79b8404fdf07b95b0f045e3a3c910581ede0
      CURRENT_MAIN: d7ef2ccf5f7a51628a26dbca3d7cfb9262bd6313
      GIT_BASE: d7ef2ccf5f7a51628a26dbca3d7cfb9262bd6313
      PLANNING_DB_INTEGRITY_SCOPE: bootstrap
    steps:
      - name: Checkout exact integration base without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d7ef2ccf5f7a51628a26dbca3d7cfb9262bd6313
          fetch-depth: 0
          persist-credentials: false
      - name: Restore verified candidate patch and fix the two filename findings
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p /tmp/retirement-result
          git config user.name 'DVT documentation integration'
          git config user.email '34416258+dunay2@users.noreply.github.com'
          python3 - <<'PY'
          import pathlib,subprocess,json,hashlib,zipfile,io,os
          artifact='10456215588'
          raw=subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/artifacts/'+artifact+'/zip'])
          assert hashlib.sha256(raw).hexdigest()=='c44bfc558cd558d1af7641ef7c373bddb5ebad0c26ecca3193934f3913dce9de'
          z=zipfile.ZipFile(io.BytesIO(raw))
          for p,sha in json.loads(z.read('checksums.json')).items(): assert hashlib.sha256(z.read(p)).hexdigest()==sha,p
          obj=json.loads(z.read('objects.json'))
          assert obj['base']==os.environ['CURRENT_MAIN']
          assert obj['oldHead']==os.environ['RETIREMENT_HEAD']
          assert obj['tree']=='e2c71fd5eba0034e6e1a69c87dd57b5c7eecc65d'
          subprocess.run(['git','apply','--index','-'],input=z.read('candidate.patch'),check=True)
          assert subprocess.check_output(['git','write-tree']).decode().strip()==obj['tree']
          print('Exact previously reviewed candidate restored:',obj['tree'])
          mapping={
            'R-20260307-golden-path-coverage-debt.md':'r-20260307-golden-path-coverage-debt.md',
            'R-20260311-g5-3-correctness-closeout-residuals.md':'r-20260311-g5-3-correctness-closeout-residuals.md',
          }
          root=pathlib.Path('docs/risk-register/quality')
          for old,new in mapping.items():
              assert (root/old).is_file() and not (root/new).exists()
              (root/old).rename(root/new)
          edited=[]
          for p in pathlib.Path('docs').rglob('*.md'):
              if p.name=='index.md': continue
              before=p.read_text(); after=before
              for old,new in mapping.items(): after=after.replace(old,new)
              if after!=before: p.write_text(after); edited.append(str(p))
          assert edited==['docs/risk-register/quality/r-20260311-g5-4-operability-and-fencing-residuals.md'],edited
          pathlib.Path('/tmp/retirement-result/consumer-edits.json').write_bytes(z.read('consumer-edits.json'))
          subprocess.run(['git','add','-A'],check=True)
          tracked=subprocess.check_output(['git','ls-files','-z']).decode().strip('\0').split('\0')
          assert all(pathlib.Path(p).exists() for p in tracked), 'CI import must see staged physical inventory'
          print('Risk identities and content preserved; canonical renames are staged before CI import')
          PY
      - name: Setup canonical toolchain and enabled hooks
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 22.x
      - name: Prepare existing disposable CI database
        uses: ./.github/actions/prepare-planning-db
      - name: Regenerate documentation and governance outputs
        run: |
          pnpm docs:sync
          pnpm governance:refresh
          git add -A
      - name: Commit through canonical helper with hooks enabled
        run: |
          pnpm commit docs docs "Reconcile planning retirement and historical consumers"
          echo "GIT_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import subprocess,os
          paths=subprocess.check_output(['git','diff','--name-only',os.environ['CURRENT_MAIN'],'HEAD','--','apps','packages','specs','.github','pnpm-lock.yaml','package.json']).decode().splitlines()
          assert set(paths)=={'apps/web/README.md','packages/@dvt/planner/docs/README.md'},paths
          print('Product code, dependencies and workflows unchanged')
          PY
      - name: Run affected regression tests
        run: node --test scripts/documentation-publication.test.cjs scripts/planning-db-surface-inventory-check.test.cjs tools/ci/docs-disposition-canon.test.mjs
      - name: Validate canonical documentation and full selected prepush plan
        run: |
          pnpm docs:sync:check
          pnpm docs:gov:manifest:check
          pnpm ci:docs
          pnpm verify:prepush
          git diff --exit-code HEAD
      - name: Export candidate evidence without publishing refs
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,subprocess,json,os,hashlib,base64
          out=pathlib.Path('/tmp/retirement-result');out.mkdir(exist_ok=True)
          def git(*args):return subprocess.check_output(['git',*args])
          head=git('rev-parse','HEAD').decode().strip()
          (out/'head.txt').write_text(head+'\n')
          (out/'status.txt').write_bytes(git('status','--short'))
          (out/'stats.txt').write_bytes(git('diff','--stat',os.environ['CURRENT_MAIN'],head))
          (out/'candidate.patch').write_bytes(git('diff',os.environ['CURRENT_MAIN'],head))
          subprocess.run(['git','archive','--format=tar.gz','-o',str(out/'source.tar.gz'),head],check=True)
          info={'head':head,'tree':git('rev-parse','HEAD^{tree}').decode().strip(),'parents':git('show','-s','--format=%P','HEAD').decode().strip().split(),'base':os.environ['CURRENT_MAIN'],'baseTree':git('rev-parse',os.environ['CURRENT_MAIN']+'^{tree}').decode().strip(),'oldHead':os.environ['RETIREMENT_HEAD'],'treeElements':[],'newBlobs':[]}
          raw=git('diff','--raw','--no-renames','-z',os.environ['CURRENT_MAIN'],head).split(b'\0')
          for i in range(0,len(raw)-1,2):
              fields=raw[i].decode().split();p=raw[i+1].decode();deleted=fields[-1]=='D'
              sha=None if deleted else git('rev-parse',head+':'+p).decode().strip()
              info['treeElements'].append({'path':p,'mode':fields[0][1:] if deleted else fields[1],'type':'blob','sha':sha})
          for line in git('rev-list','--objects',head,'^'+os.environ['CURRENT_MAIN'],'^'+os.environ['RETIREMENT_HEAD']).decode().splitlines():
              sha=line.split(' ',1)[0]
              if git('cat-file','-t',sha).strip()==b'blob':
                  info['newBlobs'].append({'sha':sha,'encoding':'base64','content':base64.b64encode(git('cat-file','blob',sha)).decode()})
          (out/'objects.json').write_text(json.dumps(info,ensure_ascii=False))
          (out/'checksums.json').write_text(json.dumps({p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in out.iterdir() if p.is_file() and p.name!='checksums.json'},indent=2))
          print(json.dumps({k:v for k,v in info.items() if k not in ('treeElements','newBlobs')},indent=2))
          print('Changed paths',len(info['treeElements']),'new blobs',len(info['newBlobs']))
          PY
      - name: Upload exact source and validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: planning-retirement-reconciliation
          path: /tmp/retirement-result
          retention-days: 3

  objects:
    name: Transfer validated content-addressed objects only
    needs: reconcile
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Transfer verified blobs and tree without commit or ref updates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess,json,os,zipfile,io,hashlib,base64
          repo=os.environ['GITHUB_REPOSITORY'];run=os.environ['GITHUB_RUN_ID']
          def api(path,data=None):
              args=['gh','api','repos/'+repo+'/'+path]
              if data is not None:args+=['--method','POST','--input','-']
              return subprocess.check_output(args,input=None if data is None else json.dumps(data).encode())
          matches=[x for x in json.loads(api('actions/runs/'+run+'/artifacts'))['artifacts'] if x['name']=='planning-retirement-reconciliation'];assert len(matches)==1
          artifact=matches[0];raw=api('actions/artifacts/'+str(artifact['id'])+'/zip')
          assert 'sha256:'+hashlib.sha256(raw).hexdigest()==artifact['digest']
          z=zipfile.ZipFile(io.BytesIO(raw))
          for p,sha in json.loads(z.read('checksums.json')).items():assert hashlib.sha256(z.read(p)).hexdigest()==sha,p
          obj=json.loads(z.read('objects.json'))
          assert obj['base']=='d7ef2ccf5f7a51628a26dbca3d7cfb9262bd6313'
          assert obj['oldHead']=='fbdb79b8404fdf07b95b0f045e3a3c910581ede0'
          assert obj['parents']==[obj['base']]
          for blob in obj['newBlobs']:
              data=base64.b64decode(blob['content']);sha=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest();assert sha==blob['sha']
              returned=json.loads(api('git/blobs',{'encoding':'base64','content':blob['content']}));assert returned['sha']==sha
          result=json.loads(api('git/trees',{'base_tree':obj['baseTree'],'tree':obj['treeElements']}));assert result['sha']==obj['tree']
          print('Verified tree transferred:',result['sha'])
          print('No commit, branch, PR, protection or main update performed')
          PY
