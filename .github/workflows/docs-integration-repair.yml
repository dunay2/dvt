name: Docs Integration Repair

on:
  push:
    branches: [automation/3004-docs-integration-repair]
    paths: [.github/workflows/docs-integration-repair.yml]

permissions:
  contents: read

jobs:
  transfer:
    name: Transfer reviewed repair blobs without updating refs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - name: Verify exact artifact and upload only content-addressed blobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, io, json, os, urllib.error, urllib.request, zipfile
          api = 'https://api.github.com/repos/dunay2/dvt'
          expected = {
            'docs/.manifest.json': 'a880540ec21bcda3f77ef47a280617043f969c56',
            'docs/adr/index.md': '138ed888e73e74abf9b67a5803739873ab226fe8',
            'docs/evidence/index.md': '8f9fceeeda3afd76e5d4f5c71c1b67472bf4ea42',
            'docs/guides/documentation-maintenance-guide-20260407.md': 'ecc8fc0fdb71f373e5d2d3978e812c86c8182fa1',
            'docs/planning/proposals/mandatory/governance-and-docs/docs-disposition-canon-plan-20260524.md': '2e0225056204ca55a83dd7fc8da3f7dd7cfa7aa4',
            'docs/planning/status/governance-document-rule-inventory.md': '74b8835bf0ddd4dbb7883945aeff959ad465c530',
            'docs/risk-register/quality/index.md': 'd51eb4d8859038472074b92d361a1bef571b0f82',
            'tools/ci/docs-disposition-canon.test.mjs': '4b01d34e56ba2abf31f3ad9b705e4288641aa573',
          }
          class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self, req, fp, code, msg, headers, newurl):
              return None
          opener = urllib.request.build_opener(NoRedirect)
          headers = {
            'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
            'Accept': 'application/vnd.github+json',
            'Content-Type': 'application/json',
            'X-GitHub-Api-Version': '2022-11-28',
          }
          request = urllib.request.Request(api + '/actions/artifacts/10407566837/zip', headers=headers)
          try:
            response = opener.open(request, timeout=30)
            raw = response.read()
          except urllib.error.HTTPError as error:
            if error.code != 302:
              raise
            signed_url = error.headers['Location']
            if not signed_url.startswith('https://'):
              raise ValueError('Artifact redirect must use HTTPS')
            # Never forward the GitHub Authorization header to artifact storage.
            with urllib.request.urlopen(signed_url, timeout=30) as response:
              raw = response.read()
          if hashlib.sha256(raw).hexdigest() != '0a49cc70e46ac706b94b74d71e2fa244a5240723e14628406be1008f7f96488c':
            raise ValueError('Artifact digest mismatch')
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
            payload = json.loads(archive.read('files.json'))
          if payload['base'] != 'fcd5cf29cbd6a42e67a035e173d302896b0fc8d7':
            raise ValueError('Unexpected source candidate')
          files = payload['files']
          if len(files) != len(expected) or {item['path'] for item in files} != set(expected):
            raise ValueError('Artifact path set differs from reviewed repairs')
          for item in files:
            data = item['content'].encode('utf-8')
            digest = hashlib.sha1(b'blob ' + str(len(data)).encode('ascii') + b'\0' + data).hexdigest()
            if digest != expected[item['path']]:
              raise ValueError('Content mismatch: ' + item['path'])
          for item in files:
            body = json.dumps({'content': item['content'], 'encoding': 'utf-8'}).encode('utf-8')
            request = urllib.request.Request(api + '/git/blobs', data=body, headers=headers, method='POST')
            with opener.open(request, timeout=30) as response:
              result = json.load(response)
            if result['sha'] != expected[item['path']]:
              raise ValueError('Uploaded blob mismatch: ' + item['path'])
            print(json.dumps({'path': item['path'], 'sha': result['sha']}))
          print('Verified eight blobs; no commits or references created or updated.')
          PY
