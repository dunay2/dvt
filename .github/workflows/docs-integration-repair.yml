name: Docs Integration Repair
on:
  push:
    branches: [automation/3004-docs-integration-repair]
    paths: [.github/workflows/docs-integration-repair.yml]
permissions:
  contents: read
jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      BASE: 44d3e0d77a1a072a9bceb6c5d231f06256cdc4a3
      GIT_BASE: 44d3e0d77a1a072a9bceb6c5d231f06256cdc4a3
      PLANNING_DB_INTEGRITY_SCOPE: bootstrap
      TZ: UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 44d3e0d77a1a072a9bceb6c5d231f06256cdc4a3
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 22.x
      - name: Apply exact reviewed deletion with red test first
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,json,hashlib,os
          out=Path('/tmp/refactor-retirement');out.mkdir(exist_ok=True)
          def git(*a):return subprocess.check_output(['git',*a])
          def sha(b):return hashlib.sha256(b).hexdigest()
          assert git('rev-parse','HEAD').decode().strip()==os.environ['BASE']
          assert git('rev-parse','HEAD^{tree}').decode().strip()=='9b3a19e36d9860948c7c6c7b57a1a54ad30905e1'
          names=['20260331-dhm-ws5-b-engine-test-fixture-modularization-closeout.md','20260419-tf-a1-c10-preview-route-facade-finalization-closeout.md','20260419-tf-a1-c11-plan-route-grammar-ownership-closeout.md','20260419-tf-a1-c12-plan-route-facade-regression-hardening-closeout.md','20260419-tf-a1-c12-plan-route-facade-standardization-closeout.md','20260419-tf-a1-c13-import-ownership-canonicalization-closeout.md','20260419-tf-a1-c6-preview-route-facade-realignment-closeout.md','20260419-tf-a1-c7-import-route-facade-realignment-closeout.md','20260419-tf-a1-c8-preview-route-helper-seams-closeout.md','20260419-tf-a1-c9-preview-contract-guard-and-scope-qa-closeout.md','20260420-adapter-temporal-test-fixture-alignment-closeout.md','20260420-adapter-temporal-test-seams-hardening-closeout.md','20260420-api-http-error-mapper-srp-decomposition-closeout.md','20260420-tf-a1-c15-c16-plan-route-seam-hardening-closeout.md','20260420-tf-a1-c17-plan-route-request-resolution-recipe-closeout.md','20260420-tf-a1-c18-plan-compile-boundary-ownership-convergence-closeout.md','20260420-tf-a1-c19-plan-route-policy-catalog-and-envelope-convergence-closeout.md','20260601-planning-db-import-test-fixture-reuse-closeout.md','20260601-planning-db-migration-suite-routing-closeout.md','20260601-planning-db-test-file-routing-closeout.md','20260602-web-mechanical-truth-inventory-closeout.md','20260904-gh-2896-retire-empty-canvas-guide-closeout.md']
          removed=['docs/planning/closeouts/'+n for n in names]
          assert len(removed)==len(set(removed))==22
          (out/'removed.json').write_text(json.dumps(removed,indent=2))
          (out/'original-hashes.json').write_text(json.dumps({p:sha(Path(p).read_bytes()) for p in removed},indent=2))
          p=Path('tools/ci/docs-disposition-canon.test.mjs');original=p.read_bytes()
          assert sha(original)=='a5940ca1486a312fc7285787f56fe914a5b2c67f3026e1b5a801bcc33c66889e'
          text=original.decode();needle='  const editorialCloseouts = new Set([\n';assert text.count(needle)==1
          assert all(n not in text for n in names)
          text=text.replace(needle,needle+''.join("    '"+n+"',\n" for n in sorted(names)))
          assert sha(text.encode())=='8efd525acf0e7889f02660c02b010166d23dcd41ccedbf0de558008cba75800b'
          p.write_text(text)
          command=['node','--test','--test-name-pattern=retired documentation-only closeouts','tools/ci/docs-disposition-canon.test.mjs']
          r=subprocess.run(command,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
          (out/'red-before-removal.log').write_text(r.stdout);assert r.returncode==1
          for p in removed:Path(p).unlink()
          assert set(git('diff','--name-only','--diff-filter=D').decode().splitlines())==set(removed)
          assert git('diff','--name-only','--diff-filter=M').decode().strip()=='tools/ci/docs-disposition-canon.test.mjs'
          git('config','user.name','github-actions[bot]')
          git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          git('add','-A');git('diff','--cached','--check')
          print('Verified 22 removals and only 22 additions to existing regression set')
          PY
      - name: Commit source through helper with normal hooks
        shell: bash
        run: |
          set -euo pipefail
          pnpm commit docs docs "Retire obsolete refactor journals" 2>&1 | tee /tmp/refactor-retirement/source-commit.log
          git rev-parse HEAD > /tmp/refactor-retirement/source-head.txt
          echo "GIT_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Prepare disposable CI database without operated-authority claims
        uses: ./.github/actions/prepare-planning-db
      - name: Regenerate canonical documentation inventory
        shell: bash
        run: |
          set -euo pipefail
          pnpm docs:sync 2>&1 | tee /tmp/refactor-retirement/docs-sync.log
          pnpm governance:refresh 2>&1 | tee /tmp/refactor-retirement/governance-refresh.log
          git add -A
          if ! git diff --cached --quiet; then
            test "$(git diff --cached --name-only)" = docs/.manifest.json
            pnpm commit docs docs "Regenerate inventory after refactor journal retirement" 2>&1 | tee /tmp/refactor-retirement/generated-commit.log
          fi
          echo "GIT_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Validate individual negative controls and complete gates
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,json,os
          out=Path('/tmp/refactor-retirement');base=os.environ['BASE'];results=[]
          removed=json.loads((out/'removed.json').read_text())
          def git(*a):return subprocess.check_output(['git',*a]).decode().strip()
          def run(name,cmd,expected=0):
              r=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True)
              (out/(name+'.log')).write_text(r.stdout+'\nSTDERR\n'+r.stderr)
              results.append({'name':name,'command':cmd,'exitCode':r.returncode,'expectedExitCode':expected})
              (out/'validation.json').write_text(json.dumps(results,indent=2))
              print(name,r.returncode,flush=True)
              assert r.returncode==expected,(name,r.stdout[-4000:],r.stderr[-4000:])
              return r.stdout
          assert set(git('diff','--name-only','--diff-filter=D',base,'HEAD').splitlines())==set(removed)
          assert not git('diff','--name-only','--diff-filter=A',base,'HEAD')
          allowed=set(removed)|{'docs/.manifest.json','tools/ci/docs-disposition-canon.test.mjs'}
          assert set(git('diff','--name-only',base,'HEAD').splitlines())<=allowed
          assert not git('diff','--name-only',base,'HEAD','--','apps','packages','specs','docs/adr','docs/contracts','docs/evidence','docs/risk-register','docs/planning/proposals','buzon','.github','package.json','pnpm-lock.yaml')
          arc=json.loads(run('arc',['node','tools/ci/arc-check.mjs']))
          assert arc['effectiveArcLevel']=='ARC-0'
          assert all(arc['requirements'][k] is False for k in ['evidenceDoc','riskUpdate','rolloutNotes','compatMatrix'])
          command=['node','--test','--test-name-pattern=retired documentation-only closeouts','tools/ci/docs-disposition-canon.test.mjs']
          run('green-selected',command)
          for i,name in enumerate(removed):
              p=Path(name);p.write_bytes(subprocess.check_output(['git','show',base+':'+name]))
              try:run('restore-'+str(i+1),command,1)
              finally:p.unlink()
          p=Path('README.md');original=p.read_bytes();slug=removed[0]
          for name,text,code in [('relative','[Old]('+slug+')',1),('main','https://github.com/dunay2/dvt/blob/main/'+slug,1),('git','https://github.com/dunay2/dvt/blob/'+base+'/'+slug,0),('unrelated','Current preview and import contracts remain unchanged.',0)]:
              p.write_bytes(original+('\n'+text+'\n').encode())
              try:run('consumer-'+name,command,code)
              finally:p.write_bytes(original)
          run('governance-tests',['node','--test','scripts/check-feature-mechanization.test.cjs','scripts/documentation-publication.test.cjs','scripts/planning-db-surface-inventory-check.test.cjs','tools/ci/docs-disposition-canon.test.mjs','tools/ci/startup-card-canon.test.mjs','tools/ci/planner-package-governance.test.mjs','tools/ci/architecture-doc-reconciliation-canon.test.mjs','scripts/governance-refresh.test.cjs','tools/ci/emit-test-matrix.test.mjs','tools/ci/turbo-workspace-task-contract.test.mjs'])
          for name,cmd in [('sync',['pnpm','docs:sync:check']),('manifest',['pnpm','docs:gov:manifest:check']),('docs',['pnpm','ci:docs']),('prepush',['pnpm','verify:prepush']),('title',['pnpm','pr:validate-title','docs(docs): Retire obsolete refactor journals']),('clean',['git','diff','--exit-code','HEAD'])]:run(name,cmd)
          assert not git('status','--porcelain')
          (out/'validated.txt').write_text(git('rev-parse','HEAD')+'\n')
          PY
      - name: Export exact candidate and validation evidence
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,json,hashlib,os
          out=Path('/tmp/refactor-retirement');out.mkdir(exist_ok=True);base=os.environ['BASE']
          for name,args in {'head.txt':['rev-parse','HEAD'],'tree.txt':['rev-parse','HEAD^{tree}'],'commit.txt':['cat-file','commit','HEAD'],'head-files.txt':['ls-tree','-rz','HEAD'],'status.txt':['status','--porcelain'],'candidate.patch':['diff',base,'HEAD'],'numstat.txt':['diff','--numstat',base,'HEAD'],'name-status.txt':['diff','--name-status',base,'HEAD'],'stats.txt':['diff','--stat',base,'HEAD']}.items():
              (out/name).write_bytes(subprocess.check_output(['git',*args]))
          if (out/'source-head.txt').exists():(out/'source-commit.txt').write_bytes(subprocess.check_output(['git','cat-file','commit',(out/'source-head.txt').read_text().strip()]))
          subprocess.run(['git','archive','--format=tar.gz','-o',str(out/'source.tar.gz'),'HEAD'],check=True)
          (out/'checksums.json').write_text(json.dumps({p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in out.iterdir() if p.is_file() and p.name!='checksums.json'},indent=2))
          print((out/'head.txt').read_text());print((out/'stats.txt').read_text())
          PY
      - name: Publish branch only after successful validation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat /tmp/refactor-retirement/validated.txt)" = "$(git rev-parse HEAD)"
          gh auth setup-git
          branch=docs/3004-retire-refactor-journals
          test -z "$(git ls-remote --heads origin refs/heads/$branch)"
          git push origin HEAD:refs/heads/$branch
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: docs-refactor-journal-retirement
          path: /tmp/refactor-retirement
          retention-days: 7
