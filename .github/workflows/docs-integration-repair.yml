name: Docs Integration Repair

on:
  push:
    branches: [automation/3004-docs-integration-repair]
    paths: [.github/workflows/docs-integration-repair.yml]

permissions:
  contents: read

jobs:
  snapshot:
    name: Read exact cleanup baseline without changing repository or DB
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact integrated baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f051f1aea4c0ee16a88ed58bec8ebc410987501a
          fetch-depth: 1
          persist-credentials: false
      - name: Export tracked source and Git identity only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/dvt-source-baseline
          test "$(git rev-parse HEAD)" = f051f1aea4c0ee16a88ed58bec8ebc410987501a
          test "$(git rev-parse HEAD^{tree})" = 541ae03dbd2b662597f84d47f667db301eb90af1
          git archive --format=tar.gz -o /tmp/dvt-source-baseline/source.tar.gz HEAD
          git ls-tree -r HEAD > /tmp/dvt-source-baseline/tree.txt
          git cat-file commit HEAD > /tmp/dvt-source-baseline/commit.txt
          git status --porcelain > /tmp/dvt-source-baseline/status.txt
          cd /tmp/dvt-source-baseline
          sha256sum source.tar.gz tree.txt commit.txt status.txt > SHA256SUMS
      - name: Upload exact source baseline
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cleanup-baseline-f051f1a
          path: /tmp/dvt-source-baseline
          retention-days: 7
