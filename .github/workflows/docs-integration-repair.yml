name: Docs Integration Repair

on:
  push:
    branches: [automation/3004-docs-integration-repair]
    paths: [.github/workflows/docs-integration-repair.yml]

permissions:
  contents: read

jobs:
  retire:
    name: Preserve active authority and validate ten historical retirements
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      BASE: c76f0f3c476396b73d37ea0181caa0a8862e658a
      OLD_HEAD: c8708f99aa2aa9775d440986d13302d5a183497d
      GIT_BASE: c76f0f3c476396b73d37ea0181caa0a8862e658a
      PLANNING_DB_INTEGRITY_SCOPE: bootstrap
      TZ: UTC
    steps:
      - name: Checkout exact PR head without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c8708f99aa2aa9775d440986d13302d5a183497d
          fetch-depth: 0
          persist-credentials: false
      - name: Apply hash-verified deferral of the Active plan
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,json,hashlib,os
          out=Path('/tmp/atlas-retirement');out.mkdir(exist_ok=True)
          base=os.environ['BASE'];head=os.environ['OLD_HEAD']
          def git(*a):return subprocess.check_output(['git',*a])
          def sha(b):return hashlib.sha256(b).hexdigest()
          assert git('rev-parse','HEAD').decode().strip()==head
          oldplan='docs/planning/proposals/mandatory/governance-and-docs/architecture-doc-reconciliation-plan-20260402.md'
          canon='docs/planning/proposals/mandatory/governance-and-docs/architecture-doc-reconciliation-canon-plan-20260523.md'
          restore=[oldplan,canon,'docs/planning/domains/documentation-governance.md','docs/planning/proposals/mandatory/governance-and-docs/doc-driven-framework-and-tooling-plan-20260404.md','docs/planning/closeouts/20260407-doc-arch-01-documentation-governance-audit-closeout.md']
          spec={'base':base,'head':head,'restores':{},'edits':[]}
          for p in restore:
              f=Path(p);before=f.read_bytes() if f.exists() else None
              original=git('show',base+':'+p)
              spec['restores'][p]={'currentSha256':sha(before) if before is not None else None,'baseSha256':sha(original)}
              f.write_bytes(original)
          def edit(p,b,a,count=1):
              data=Path(p).read_bytes();text=data.decode();assert text.count(b)==count,(p,b,text.count(b))
              spec['edits'].append({'path':p,'sha256':sha(data),'before':b,'after':a,'count':count})
              Path(p).write_bytes(text.replace(b,a).encode())
          edit(oldplan,'[Architecture Atlas](../../../../architecture/atlas/architecture/architecture-atlas.md)','[Architecture Atlas snapshot](https://github.com/dunay2/dvt/blob/'+base+'/docs/architecture/atlas/architecture/architecture-atlas.md)',4)
          p='docs/planning/proposals/mandatory/runtime-and-contracts/contracts-domain-ownership-migration-plan-20260327.md'
          needle='  - docs/planning/proposals/mandatory/runtime-and-contracts/ar-a6-snapshot-rebuild-concurrency-contract-plan-20260513.md\n'
          edit(p,needle,'  - '+oldplan+'\n'+needle)
          edit('tools/ci/startup-card-canon.test.mjs',"      '"+canon+"'","      '"+oldplan+"'")
          edit('tools/ci/docs-disposition-canon.test.mjs',"    '"+oldplan+"',\n",'')
          raw=json.dumps(spec,indent=2).encode()
          assert sha(raw)=='26167fea769e04a16c86bd0ff7a8079534701030e6b6d18238abe4bae9af9887'
          (out/'active-plan-deferral.json').write_bytes(raw)
          git('config','user.name','DVT documentation retirement')
          git('config','user.email','34416258+dunay2@users.noreply.github.com')
          git('add','-A');git('diff','--cached','--check')
          print('Active plan retained; original canon and consumers restored; exact specification verified')
          PY
      - name: Setup canonical toolchain with enabled hooks
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 22.x
      - name: Commit source correction through canonical hooks
        shell: bash
        run: |
          set -euo pipefail
          pnpm commit docs docs "Preserve active reconciliation authority pending DB review" 2>&1 | tee /tmp/atlas-retirement/source-commit.log
          git rev-parse HEAD > /tmp/atlas-retirement/source-head.txt
          echo "GIT_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Bootstrap disposable CI DB from normalized sources once
        uses: ./.github/actions/prepare-planning-db
      - name: Regenerate canonical indexes and governance outputs
        shell: bash
        run: |
          set -euo pipefail
          pnpm docs:sync 2>&1 | tee /tmp/atlas-retirement/docs-sync.log
          pnpm governance:refresh 2>&1 | tee /tmp/atlas-retirement/governance-refresh.log
          git add -A
      - name: Commit generated manifest with canonical hooks
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --cached --name-only)" = docs/.manifest.json
          pnpm commit docs docs "Regenerate manifest after authority deferral" 2>&1 | tee /tmp/atlas-retirement/generated-commit.log
          echo "GIT_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Validate preserved obligations retirement and complete gates
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,json,os,shutil,re,hashlib
          out=Path('/tmp/atlas-retirement');base=os.environ['BASE'];old=os.environ['OLD_HEAD']
          spec=json.loads((out/'active-plan-deferral.json').read_text())
          def git(*a):return subprocess.check_output(['git',*a]).decode().strip()
          oldplan=next(iter(spec['restores']))
          expected=set(git('diff','--name-only','--diff-filter=D',base,old).splitlines())-{oldplan}
          assert len(expected)==10
          assert set(git('diff','--name-only','--diff-filter=D',base,'HEAD').splitlines())==expected
          assert not git('diff','--name-only','--diff-filter=A',base,'HEAD')
          assert set(git('diff','--name-only',base,'HEAD').splitlines())<=set(git('diff','--name-only',base,old).splitlines())
          assert not git('diff','--name-only',base,'HEAD','--','apps','packages','specs','docs/adr','docs/evidence','docs/risk-register','.github','package.json','pnpm-lock.yaml')
          assert git('show','-s','--format=%P',(out/'source-head.txt').read_text().strip())==old
          assert git('show','-s','--format=%P','HEAD')==(out/'source-head.txt').read_text().strip()
          # Verify full restoration modulo the mandated formatter, with only four provenance links in the Active plan.
          restored=[]
          for p in spec['restores']:
              original=subprocess.check_output(['git','show',base+':'+p]).decode()
              if p==oldplan:
                  original=original.replace(spec['edits'][0]['before'],spec['edits'][0]['after'])
                  assert 'status: Active\n' in Path(p).read_text()
              formatted=subprocess.run(['pnpm','exec','prettier','--stdin-filepath',p],input=original,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,check=True).stdout
              assert formatted==Path(p).read_text(),p
              restored.append({'path':p,'matchesOriginalAfterFormatting':True,'provenanceLinkChanges':4 if p==oldplan else 0})
          (out/'preserved-obligations.json').write_text(json.dumps(restored,indent=2))
          results=[]
          def run(name,cmd,expectedExit=0,marker=None):
              r=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
              (out/(name+'.log')).write_text(r.stdout)
              results.append({'name':name,'command':cmd,'exitCode':r.returncode,'expectedExitCode':expectedExit})
              (out/'validation.json').write_text(json.dumps(results,indent=2))
              print(name,r.returncode,flush=True);print('\n'.join(r.stdout.splitlines()[-10:]),flush=True)
              assert r.returncode==expectedExit,(name,r.stdout[-6000:])
              if marker:assert marker in r.stdout,(name,marker)
              return r.stdout
          arc=run('arc',['node','tools/ci/arc-check.mjs']);start=re.search(r'^\{',arc,re.MULTILINE);assert start
          a=json.loads(arc[start.start():]);assert a['effectiveArcLevel']=='ARC-0'
          assert all(a['requirements'][k] is False for k in ['evidenceDoc','riskUpdate','rolloutNotes','compatMatrix'])
          cmd=['node','--test','--test-name-pattern=retired atlas and superseded Canvas','tools/ci/docs-disposition-canon.test.mjs']
          run('green',cmd)
          for i,p in enumerate(sorted(expected)):
              target=Path(p);target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(subprocess.check_output(['git','show',base+':'+p]))
              try:run('restore-'+str(i+1),cmd,1,p if '/atlas/' not in p else 'docs/architecture/atlas')
              finally:
                  target.unlink()
                  if Path('docs/architecture/atlas').exists():shutil.rmtree('docs/architecture/atlas')
          p=Path('README.md');original=p.read_bytes();slug='docs/architecture/atlas/index.md'
          for name,text,code in [('local',slug,1),('relative','[Old](../atlas/index.md)',1),('main','https://github.com/dunay2/dvt/blob/main/'+slug,1),('git','https://github.com/dunay2/dvt/blob/'+base+'/'+slug,0),('external','https://example.org/atlas/overview',0),('unrelated','graphics/texture-atlas/coordinates',0)]:
              p.write_bytes(original+('\n'+text+'\n').encode())
              try:run('consumer-'+name,cmd,code)
              finally:p.write_bytes(original)
          p=Path('scripts/sync-docs.cjs');original=p.read_bytes();p.write_bytes(subprocess.check_output(['git','show',base+':scripts/sync-docs.cjs']))
          try:run('restore-generator',cmd,1,'scripts/sync-docs.cjs')
          finally:p.write_bytes(original)
          commands=[
              ['node','--test','scripts/documentation-publication.test.cjs','scripts/planning-db-surface-inventory-check.test.cjs','tools/ci/docs-disposition-canon.test.mjs','tools/ci/startup-card-canon.test.mjs','tools/ci/planner-package-governance.test.mjs','tools/ci/architecture-doc-reconciliation-canon.test.mjs'],
              ['pnpm','docs:sync:check'],['pnpm','docs:gov:manifest:check'],['pnpm','ci:docs'],['pnpm','verify:prepush'],
              ['pnpm','pr:validate-title','docs(docs): Retire historical atlas and superseded Canvas guidance'],['git','diff','--exit-code','HEAD'],
          ]
          for i,c in enumerate(commands):run('validation-'+str(i+1),c)
          assert not git('status','--porcelain')
          (out/'validated.txt').write_text(git('rev-parse','HEAD')+'\n')
          PY
      - name: Export exact final candidate and evidence
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,json,hashlib,os
          out=Path('/tmp/atlas-retirement');out.mkdir(exist_ok=True);base=os.environ['BASE']
          def git(*a):return subprocess.check_output(['git',*a])
          for name,args in {'head.txt':['rev-parse','HEAD'],'tree.txt':['rev-parse','HEAD^{tree}'],'commit.txt':['cat-file','commit','HEAD'],'status.txt':['status','--porcelain'],'stats.txt':['diff','--stat',base,'HEAD'],'candidate.patch':['diff',base,'HEAD'],'worktree.patch':['diff','HEAD'],'name-status.txt':['diff','--name-status',base,'HEAD'],'numstat.txt':['diff','--numstat',base,'HEAD'],'base-files.txt':['ls-tree','-rz',base],'head-files.txt':['ls-tree','-rz','HEAD']}.items():
              (out/name).write_bytes(git(*args))
          if (out/'source-head.txt').exists():(out/'source-commit.txt').write_bytes(git('cat-file','commit',(out/'source-head.txt').read_text().strip()))
          subprocess.run(['git','archive','--format=tar.gz','-o',str(out/'source.tar.gz'),'HEAD'],check=True)
          (out/'checksums.json').write_text(json.dumps({p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in out.iterdir() if p.is_file() and p.name!='checksums.json'},indent=2))
          print((out/'head.txt').read_text());print((out/'stats.txt').read_text())
          PY
      - name: Advance the same PR branch without force after validation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat /tmp/atlas-retirement/validated.txt)" = "$(git rev-parse HEAD)"
          gh auth setup-git
          branch=docs/3004-retire-atlas-and-canvas-history
          test "$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)" = "$OLD_HEAD"
          git push origin "HEAD:refs/heads/$branch"
      - name: Upload exact final source and validation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: atlas-canvas-retirement-active-plan-preserved
          path: /tmp/atlas-retirement
          retention-days: 7
