name: Temporary Python code-node lockfile refresh

on:
  push:
    branches:
      - feat/python-code-node-vertical
    paths:
      - .github/workflows/python-code-node-lockfile-refresh.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.repository == 'dunay2/dvt' && github.ref == 'refs/heads/feat/python-code-node-vertical'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feat/python-code-node-vertical
          fetch-depth: 0

      - name: Refresh workspace lockfile
        uses: ./.github/actions/setup-node-pnpm
        with:
          install-args: --lockfile-only --no-frozen-lockfile

      - name: Commit lockfile and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/python-code-node-lockfile-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml .github/workflows/python-code-node-lockfile-refresh.yml
          git diff --cached --quiet && exit 0
          git commit -m "chore(lockfile): register Python runtime package"
          git push origin HEAD:feat/python-code-node-vertical
