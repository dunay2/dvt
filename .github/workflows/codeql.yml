name: CodeQL

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  schedule:
    - cron: '30 2 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-security-scope:
    name: Detect security analysis scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      !(github.event_name == 'pull_request' && github.event.pull_request.draft) &&
      (github.event.repository.visibility == 'public' ||
        vars.GH_ADVANCED_SECURITY_ENABLED == 'true')
    outputs:
      security_analysis_relevant:
        ${{ steps.scope.outputs.security_analysis_relevant ||
        steps.non_pr_scope.outputs.security_analysis_relevant }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Fetch pull-request base ref
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/fetch-scope-base
        with:
          base-ref: ${{ github.base_ref }}

      - name: Validate workflow scope policy JSON
        if: github.event_name == 'pull_request'
        run: node tools/ci/validate-policy.js tools/ci/policy/workflow-scope.json

      - name: Emit PR security scope outputs
        id: scope
        if: github.event_name == 'pull_request'
        run: node tools/ci/emit-scope.mjs --mode workflow
        env:
          GIT_BASE: origin/${{ github.base_ref }}
          GIT_HEAD: ${{ github.sha }}

      - name: Open security scope for non-PR events
        id: non_pr_scope
        if: github.event_name != 'pull_request'
        run: echo "security_analysis_relevant=true" >> "$GITHUB_OUTPUT"

  analyze:
    name: CodeQL analyze
    needs: detect-security-scope
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - name: Record scope-based CodeQL skip
        if: needs.detect-security-scope.outputs.security_analysis_relevant != 'true'
        run: echo "CodeQL analysis is not required for this change scope."

      - name: Checkout
        if: needs.detect-security-scope.outputs.security_analysis_relevant == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        if: needs.detect-security-scope.outputs.security_analysis_relevant == 'true'
        uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL analysis
        if: needs.detect-security-scope.outputs.security_analysis_relevant == 'true'
        uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
