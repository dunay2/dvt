name: Golden Paths Validation

on:
  workflow_dispatch:
    inputs:
      run_contract_fixture_validation:
        description: 'Run contract fixture validation (can fail due to known fixture debt)'
        required: false
        type: boolean
        default: false

concurrency:
  group: golden-paths-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-plans:
    name: Validate Golden Path Plans
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate contract fixtures
        if: ${{ github.event.inputs.run_contract_fixture_validation == 'true' }}
        run: pnpm validate:contracts

      - name: Upload validation results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: golden-paths-validation-results
          path: packages/@dvt/engine/test/contracts/results/
          retention-days: 7
