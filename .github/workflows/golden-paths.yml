name: Golden Paths Validation

on:
  workflow_dispatch:
    inputs:
      run_contract_fixture_validation:
        description:
          'Validate golden path fixtures from generated test results only (no duplicate contracts
          validation)'
        required: false
        type: boolean
        default: false

concurrency:
  group: golden-paths-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-plans:
    name: Validate Golden Path Plans
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup toolchain and dependencies
        uses: ./.github/actions/setup-node-pnpm

      - name: Detect golden results directory
        id: detect_results
        if: ${{ github.event.inputs.run_contract_fixture_validation == 'true' }}
        run: |
          if [ -d "packages/@dvt/engine/test/contracts/results" ]; then
            echo "results_present=true" >> "$GITHUB_OUTPUT"
            echo "✅ Golden results directory present"
          else
            echo "results_present=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ Missing golden results directory: packages/@dvt/engine/test/contracts/results"
            echo "ℹ️ Run Contracts & Determinism workflow (contract-validate/contract-hashes) first, then rerun this workflow."
          fi

      - name: Summarize golden results files
        if:
          ${{ github.event.inputs.run_contract_fixture_validation == 'true' &&
          steps.detect_results.outputs.results_present == 'true' }}
        run: |
          count=$(find packages/@dvt/engine/test/contracts/results -type f | wc -l)
          echo "Found $count files under golden results."
          echo "golden_results_files=$count" >> "$GITHUB_OUTPUT"

      - name: Upload validation results
        if: ${{ always() && github.event.inputs.run_contract_fixture_validation == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: golden-paths-validation-results
          path: packages/@dvt/engine/test/contracts/results/
          retention-days: 7
          if-no-files-found: warn
