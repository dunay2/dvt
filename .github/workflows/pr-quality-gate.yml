name: PR Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_typecheck_gate:
        description: 'Run workspace type-check fast-fail gate'
        required: false
        type: boolean
        default: false
      run_temporal_integration:
        description: 'Run temporal adapter integration tests'
        required: false
        type: boolean
        default: false
      run_temporal_transformation_integration:
        description: 'Run temporal adapter transformation integration tests'
        required: false
        type: boolean
        default: false
      run_temporal_postgres_integration:
        description: 'Run temporal adapter Postgres capability integration tests'
        required: false
        type: boolean
        default: false

concurrency:
  group: pr-quality-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: read
  pull-requests: read

jobs:
  pr-checks:
    name: PR Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: "!(github.event_name == 'pull_request' && github.event.pull_request.draft)"
    outputs:
      temporal_changed:
        ${{ steps.detect_changes.outputs.temporal_changed || steps.wd_scope.outputs.temporal_changed
        }}
      temporal_transformation_changed:
        ${{ steps.detect_changes.outputs.temporal_transformation_changed ||
        steps.wd_scope.outputs.temporal_transformation_changed }}
      temporal_postgres_changed:
        ${{ steps.detect_changes.outputs.temporal_postgres_changed ||
        steps.wd_scope.outputs.temporal_postgres_changed }}
      adapter_postgres_changed: ${{ steps.detect_changes.outputs.adapter_postgres_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Validate workflow scope policy JSON
        run: node tools/ci/validate-policy.js tools/ci/policy/workflow-scope.json

      - name: Detect workflow scope
        id: scope
        run: node tools/ci/emit-scope.mjs --mode workflow
        env:
          GIT_BASE: ${{ github.event.pull_request.base.sha }}
          GIT_HEAD: ${{ github.sha }}

      - name: Validate adapter-postgres policy JSON
        run: node tools/ci/validate-policy.js tools/ci/policy/adapter-postgres-relevance.json

      - name: Enforce forbidden generated files policy
        run: node scripts/check-forbidden-tracked-files.cjs

      - name: Enforce retired knowledge-intake path
        if: github.event_name == 'pull_request'
        run: node scripts/planning-db/knowledge-intake-retirement-guard.cjs --committed
        env:
          GIT_BASE: ${{ github.event.pull_request.base.sha }}
          GIT_HEAD: ${{ github.sha }}

      - name: Setup pnpm, cache and dependencies (fast-fail)
        if:
          github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name
          == 'workflow_dispatch' && github.event.inputs.run_typecheck_gate == 'true')
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 22.x

      - name: Validate changed file format and lint
        if:
          github.event_name == 'pull_request' &&
          (steps.scope.outputs.changed_file_validation_relevant == 'true' ||
          steps.scope.outputs.docs_changed == 'true')
        run: node scripts/check-changed.cjs
        env:
          GIT_BASE: ${{ github.event.pull_request.base.sha }}
          GIT_HEAD: ${{ github.sha }}

      - name: Lint changed Markdown
        if: github.event_name == 'pull_request' && steps.scope.outputs.docs_changed == 'true'
        run: pnpm lint:md:changed
        env:
          GIT_BASE: ${{ github.event.pull_request.base.sha }}
          GIT_HEAD: ${{ github.sha }}

      - name: Run focused committed-diff tests
        if:
          github.event_name == 'pull_request' &&
          steps.scope.outputs.changed_file_validation_relevant == 'true'
        run: pnpm verify:changed --committed-tests
        env:
          GIT_BASE: ${{ github.event.pull_request.base.sha }}
          GIT_HEAD: ${{ github.sha }}

      - name: ARC policy evaluate
        if: github.event_name == 'pull_request'
        run: node tools/ci/arc-check.mjs > arc.json
        env:
          GIT_BASE: ${{ github.event.pull_request.base.sha }}
          GIT_HEAD: ${{ github.sha }}

      - name: ARC docs / evidence validate
        if: github.event_name == 'pull_request'
        run: ARC_JSON=arc.json node tools/ci/doc-check.mjs
        env:
          DOCS_ONLY_SCOPE:
            ${{ steps.scope.outputs.any_code != 'true' && steps.scope.outputs.docs_changed == 'true'
            }}
          GIT_BASE: ${{ github.event.pull_request.base.sha }}
          GIT_HEAD: ${{ github.sha }}

      - name: Prepare planning DB for DB-backed validation
        if:
          github.event_name == 'push' || (github.event_name == 'pull_request' &&
          (steps.scope.outputs.feature_mechanization_relevant == 'true' ||
          steps.scope.outputs.planning_db_inventory_relevant == 'true' ||
          steps.scope.outputs.governance_global_relevant == 'true' ||
          steps.scope.outputs.docs_structure_changed == 'true')) || (github.event_name ==
          'workflow_dispatch' && github.event.inputs.run_typecheck_gate == 'true')
        uses: ./.github/actions/prepare-planning-db
        env:
          GIT_BASE:
            ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha ||
            'origin/main' }}
          GIT_HEAD: ${{ github.sha }}

      - name: Validate Planning DB inventory for committed changes
        if:
          github.event_name == 'pull_request' && steps.scope.outputs.planning_db_inventory_relevant
          == 'true'
        run: pnpm planning:db:inventory:check

      - name: Validate Planning DB integrity for committed changes
        if:
          github.event_name == 'pull_request' && steps.scope.outputs.planning_db_inventory_relevant
          == 'true'
        run: pnpm planning:db:integrity:check --bootstrap

      - name: Validate docs quality policy (English/no duplicate indexes)
        if:
          github.event_name == 'push' || (github.event_name == 'workflow_dispatch' &&
          github.event.inputs.run_typecheck_gate == 'true')
        run: pnpm docs:quality:check

      - name: Run docs doctor (duplicates/legacy/staleness)
        if:
          github.event_name == 'push' || (github.event_name == 'workflow_dispatch' &&
          github.event.inputs.run_typecheck_gate == 'true')
        run: pnpm docs:doctor

      - name: Enforce changed Markdown location policy
        if: github.event_name == 'pull_request' && steps.scope.outputs.docs_changed == 'true'
        run: pnpm docs:gov:locations -- --changed-only

      - name: Enforce Markdown location policy
        if:
          github.event_name == 'push' || (github.event_name == 'workflow_dispatch' &&
          github.event.inputs.run_typecheck_gate == 'true')
        run: pnpm docs:gov:locations

      - name: Enforce canonical docs paths and links
        if:
          github.event_name == 'push' || (github.event_name == 'workflow_dispatch' &&
          github.event.inputs.run_typecheck_gate == 'true')
        run: pnpm docs:canonical:check

      - name: Enforce changed docs filename policy
        if: github.event_name == 'pull_request' && steps.scope.outputs.docs_changed == 'true'
        run: pnpm docs:gov:filenames:changed

      - name: Enforce changed docs frontmatter policy
        if: github.event_name == 'pull_request' && steps.scope.outputs.docs_changed == 'true'
        run: pnpm docs:gov:frontmatter:changed

      - name: Enforce changed docs links
        if: github.event_name == 'pull_request' && steps.scope.outputs.docs_changed == 'true'
        run: pnpm docs:gov:links:changed
        env:
          GIT_BASE: ${{ github.event.pull_request.base.sha }}
          GIT_HEAD: ${{ github.sha }}

      - name: Validate governance unit coverage
        if:
          github.event_name == 'push' || (github.event_name == 'pull_request' &&
          (steps.scope.outputs.governance_global_relevant == 'true' ||
          steps.scope.outputs.governance_tooling_changed == 'true' ||
          steps.scope.outputs.root_build_sensitive == 'true')) || (github.event_name ==
          'workflow_dispatch' && github.event.inputs.run_typecheck_gate == 'true')
        run: pnpm docs:governance:unit-coverage

      - name: Validate governed changed files
        if: github.event_name == 'pull_request'
        run: pnpm docs:governance:changed-files:check
        env:
          GIT_BASE: ${{ github.event.pull_request.base.sha }}
          GIT_HEAD: ${{ github.sha }}

      - name: Validate feature mechanization manifests
        if:
          github.event_name == 'push' || (github.event_name == 'pull_request' &&
          steps.scope.outputs.feature_mechanization_relevant == 'true') || (github.event_name ==
          'workflow_dispatch' && github.event.inputs.run_typecheck_gate == 'true')
        run: pnpm docs:feature-mechanization

      - name: Validate feature implementation mechanization
        if:
          github.event_name == 'push' || (github.event_name == 'pull_request' &&
          steps.scope.outputs.feature_mechanization_relevant == 'true') || (github.event_name ==
          'workflow_dispatch' && github.event.inputs.run_typecheck_gate == 'true')
        run: pnpm docs:feature-mechanization:implementation

      - name: ADR-0000 traceability gate
        if:
          github.event_name == 'push' || (github.event_name == 'pull_request' &&
          steps.scope.outputs.traceability_adr0_relevant == 'true') || (github.event_name ==
          'workflow_dispatch' && github.event.inputs.run_typecheck_gate == 'true')
        run: pnpm traceability:adr0

      - name: Validate QA artifacts
        if:
          github.event_name == 'push' || (github.event_name == 'pull_request' &&
          steps.scope.outputs.docs_changed == 'true') || (github.event_name == 'workflow_dispatch'
          && github.event.inputs.run_typecheck_gate == 'true')
        run: pnpm qa:artifact:check

      - name: Fetch architecture push comparison base
        if: github.event_name == 'push'
        run: |
          git cat-file -e "$GIT_BASE^{commit}" 2>/dev/null ||
            git fetch --no-tags --depth=1 origin "$GIT_BASE"
        env:
          GIT_BASE: ${{ github.event.before }}

      - name: Validate architecture dependency boundaries
        if:
          github.event_name == 'push' || (github.event_name == 'pull_request' &&
          steps.scope.outputs.code_validation_relevant == 'true') || (github.event_name ==
          'workflow_dispatch' && github.event.inputs.run_typecheck_gate == 'true')
        run: pnpm arch:deps
        env:
          GIT_BASE:
            ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha ||
            github.event_name == 'push' && github.event.before || 'origin/main' }}
          GIT_HEAD: ${{ github.sha }}

      - name: Check PR title follows Conventional Commits
        if: github.event_name == 'pull_request'
        run: pnpm pr:validate-title "$PR_TITLE"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}

      - name: Check PR size
        if: github.event_name == 'pull_request'
        run: node tools/ci/check-pr-size.mjs
        env:
          PR_ADDITIONS: ${{ github.event.pull_request.additions }}
          PR_DELETIONS: ${{ github.event.pull_request.deletions }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}

      - name: Check if description is present
        if: github.event_name == 'pull_request'
        run: node tools/ci/check-pr-description.mjs
        env:
          PR_BODY: ${{ github.event.pull_request.body }}

      - name: Detect PR changes relevant to Temporal and adapter-postgres
        id: detect_changes
        if: github.event_name == 'pull_request'
        run: node tools/ci/emit-scope.mjs --mode pr-quality
        env:
          GIT_BASE: ${{ github.event.pull_request.base.sha }}
          GIT_HEAD: ${{ github.sha }}

      - name: Set temporal_changed for workflow_dispatch
        id: wd_scope
        if:
          github.event_name == 'workflow_dispatch' && (github.event.inputs.run_temporal_integration
          == 'true' || github.event.inputs.run_temporal_transformation_integration == 'true' ||
          github.event.inputs.run_temporal_postgres_integration == 'true')
        run: |
          if [[ "${{ github.event.inputs.run_temporal_integration }}" == "true" ]]; then
            echo "temporal_changed=true" >> $GITHUB_OUTPUT
          fi
          if [[ "${{ github.event.inputs.run_temporal_transformation_integration }}" == "true" ]]; then
            echo "temporal_transformation_changed=true" >> $GITHUB_OUTPUT
          fi
          if [[ "${{ github.event.inputs.run_temporal_postgres_integration }}" == "true" ]]; then
            echo "temporal_postgres_changed=true" >> $GITHUB_OUTPUT
          fi

  temporal-integration:
    name: Temporal adapter integration (time-skipping)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [pr-checks]
    if: >-
      needs.pr-checks.outputs.temporal_changed == 'true' && (github.event_name !=
      'workflow_dispatch' ||
       github.event.inputs.run_temporal_integration == 'true')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm, cache and dependencies
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 22.x

      - name: Prepare Temporal adapter integration runtime
        run: pnpm --filter @dvt/adapter-temporal run prepare:integration

      - name: Run Temporal adapter integration (time-skipping)
        run: pnpm --filter @dvt/adapter-temporal run test:integration

  temporal-postgres-integration:
    name: Temporal adapter integration (postgres capability)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [pr-checks]
    if: >-
      needs.pr-checks.outputs.temporal_postgres_changed == 'true' && (github.event_name !=
      'workflow_dispatch' ||
       github.event.inputs.run_temporal_postgres_integration == 'true')
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: dvt_test
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: dvt_test
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 5432:5432
    env:
      DVT_PG_INTEGRATION: '1'
      DVT_PG_ADMIN_URL:
        postgresql://dvt_test:${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/dvt_test
      DVT_PG_APP_USER: dvt_app
      DVT_PG_APP_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-app
      DVT_PG_RLS_URL:
        postgresql://dvt_app:${{ github.run_id }}-${{ github.run_attempt
        }}-app@localhost:5432/dvt_test
      DVT_PG_URL:
        postgresql://dvt_test:${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/dvt_test
      DATABASE_URL:
        postgresql://dvt_test:${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/dvt_test
      DVT_HET1_SERVICE_INTEGRATION: '1'
      DVT_HET1_MINIO_ENDPOINT: http://127.0.0.1:9000
      DVT_HET1_TEMPORAL_ADDRESS: 127.0.0.1:7233
      AWS_ACCESS_KEY_ID: dvt_het1
      AWS_SECRET_ACCESS_KEY: ${{ github.run_id }}-${{ github.run_attempt }}-minio
      AWS_REGION: us-east-1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm, cache and dependencies
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 22.x

      - name: Provision non-bypass Postgres app role
        run: node scripts/provision-postgres-app-role.cjs

      - name: Prove adapter-postgres app-role runtime and direct RLS
        run:
          pnpm --filter @dvt/adapter-postgres test -- PostgresAppRoleRuntime.integration.test.ts
          PostgresTenantRlsEnforcement.integration.test.ts

      - name: Prepare Temporal adapter Postgres integration runtime
        run: pnpm --filter @dvt/adapter-temporal run prepare:integration:postgres

      - name: Run Temporal adapter integration (postgres capability)
        run: pnpm --filter @dvt/adapter-temporal run test:integration:postgres

      - name: Start HET1 object-store and Temporal services
        run: |
          docker run --rm -d --name dvt-het1-minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$AWS_ACCESS_KEY_ID" \
            -e MINIO_ROOT_PASSWORD="$AWS_SECRET_ACCESS_KEY" \
            minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e \
            server /data
          docker run --rm -d --name dvt-het1-temporal -p 7233:7233 \
            temporalio/temporal@sha256:cf86707827fac99e4d1c4a47dc11b105382d796199c7bd41fb3213fb0471628e \
            server start-dev --ip 0.0.0.0
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null && \
              docker exec dvt-het1-temporal temporal operator namespace describe \
                --namespace default --address 127.0.0.1:7233 >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs dvt-het1-minio
          docker logs dvt-het1-temporal
          exit 1

      - name: Prepare HET1 worker runtime dependencies
        run: node scripts/build-workspace-runtime-deps.cjs dvt-temporal-worker

      - name: Prove object-file to PostgreSQL worker vertical
        run: >-
          pnpm --filter dvt-temporal-worker exec vitest run --config vitest.config.ts
          test/host/objectFilePostgres.service.integration.test.ts

  temporal-transformation-integration:
    name: Temporal adapter integration (transformation runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [pr-checks]
    if: >-
      needs.pr-checks.outputs.temporal_transformation_changed == 'true' && (github.event_name !=
      'workflow_dispatch' ||
       github.event.inputs.run_temporal_transformation_integration == 'true')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm, cache and dependencies
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 22.x

      - name: Prepare Temporal adapter transformation runtime
        run: pnpm --filter @dvt/adapter-temporal run prepare:integration:transformation

      - name: Run Temporal adapter integration (transformation runtime)
        run: pnpm --filter @dvt/adapter-temporal run test:integration:transformation

  all-checks-passed:
    name: All Checks Required for Merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      [
        pr-checks,
        temporal-integration,
        temporal-transformation-integration,
        temporal-postgres-integration,
      ]
    if: always()
    steps:
      - name: Check all jobs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const jobs = ${{ toJSON(needs) }};
            // Consider only explicit failures as blocking; ignore skipped/neutral jobs
            const failedJobs = Object.entries(jobs)
              .filter(([_, job]) => ['failure', 'cancelled'].includes(job.result))
              .map(([name, _]) => name);

            if (failedJobs.length > 0) {
              core.setFailed(`❌ The following checks failed: ${failedJobs.join(', ')}`);
            } else {
              core.info('✅ All PR quality checks passed!');
            }
