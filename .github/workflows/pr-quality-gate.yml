name: PR Quality Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_typecheck_gate:
        description: 'Run workspace type-check fast-fail gate'
        required: false
        type: boolean
        default: false
      run_temporal_integration:
        description: 'Run temporal adapter integration tests'
        required: false
        type: boolean
        default: false

concurrency:
  group: pr-quality-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: read
  pull-requests: write

jobs:
  pr-checks:
    name: PR Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: "!(github.event_name == 'pull_request' && github.event.pull_request.draft)"
    outputs:
      temporal_changed:
        ${{ steps.detect_changes.outputs.temporal_changed || steps.wd_scope.outputs.temporal_changed
        }}
      adapter_postgres_changed: ${{ steps.detect_changes.outputs.adapter_postgres_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

      - name: Validate workflow scope policy JSON
        run: node tools/ci/validate-policy.js tools/ci/policy/workflow-scope.json

      - name: Detect workflow scope
        id: scope
        run: node tools/ci/emit-scope.mjs --mode workflow
        env:
          GIT_BASE: origin/${{ github.base_ref }}
          GIT_HEAD: ${{ github.sha }}

      - name: Validate adapter-postgres policy JSON
        run: node tools/ci/validate-policy.js tools/ci/policy/adapter-postgres-relevance.json

      - name: Enforce forbidden generated files policy
        run: node scripts/check-forbidden-tracked-files.cjs

      - name: Setup pnpm, cache and dependencies (fast-fail)
        if:
          github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name
          == 'workflow_dispatch' && github.event.inputs.run_typecheck_gate == 'true')
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 22.x

      - name: ARC policy evaluate
        if: github.event_name == 'pull_request'
        run: node tools/ci/arc-check.mjs > arc.json
        env:
          GIT_BASE: origin/${{ github.base_ref }}
          GIT_HEAD: ${{ github.sha }}

      - name: ARC docs / evidence validate
        if: github.event_name == 'pull_request'
        run: ARC_JSON=arc.json node tools/ci/doc-check.mjs
        env:
          DOCS_ONLY_SCOPE:
            ${{ steps.scope.outputs.any_code != 'true' && steps.scope.outputs.docs_changed == 'true'
            }}
          GIT_BASE: origin/${{ github.base_ref }}
          GIT_HEAD: ${{ github.sha }}

      - name: Validate docs sync outputs (ADR/index coherence)
        if:
          github.event_name == 'pull_request' && steps.scope.outputs.docs_structure_changed ==
          'true'
        run: pnpm docs:sync:check

      - name: Validate planning workboard outputs
        if: github.event_name == 'pull_request' && steps.scope.outputs.lane_yaml_changed == 'true'
        run: pnpm docs:workboard:check

      - name: Validate docs quality policy (English/no duplicate indexes)
        if: github.event_name == 'pull_request' && steps.scope.outputs.docs_changed == 'true'
        run: pnpm docs:quality:check

      - name: Run docs doctor (duplicates/legacy/staleness)
        if: github.event_name == 'pull_request' && steps.scope.outputs.docs_changed == 'true'
        run: pnpm docs:doctor

      - name: Enforce Markdown location policy
        if: github.event_name == 'pull_request' && steps.scope.outputs.docs_changed == 'true'
        run: pnpm docs:gov:locations

      - name: Enforce canonical docs paths and links
        if: github.event_name == 'pull_request' && steps.scope.outputs.docs_changed == 'true'
        run: pnpm docs:canonical:check

      - name: Validate generated code-state status doc
        if:
          github.event_name == 'pull_request' && steps.scope.outputs.generated_status_relevant ==
          'true'
        run: pnpm docs:status:check

      - name: Validate generated capability coverage doc
        if:
          github.event_name == 'pull_request' && steps.scope.outputs.generated_capability_relevant
          == 'true'
        run: pnpm docs:capability:check

      - name: Check PR title follows Conventional Commits
        if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            chore
            ci
            build
            revert
          requireScope: false
          subjectPattern: ^[A-Z].+$
          subjectPatternError: |
            The subject must start with an uppercase character.
          wip: false

      - name: Check PR size
        if: github.event_name == 'pull_request'
        run: node tools/ci/check-pr-size.mjs
        env:
          PR_ADDITIONS: ${{ github.event.pull_request.additions }}
          PR_DELETIONS: ${{ github.event.pull_request.deletions }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}

      - name: Label PR based on files changed
        if: github.event_name == 'pull_request'
        uses: actions/labeler@634933edcd8ababfe52f92936142cc22ac488b1b # v6
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml

      - name: Check if description is present
        if: github.event_name == 'pull_request'
        run: node tools/ci/check-pr-description.mjs
        env:
          PR_BODY: ${{ github.event.pull_request.body }}

      - name: Detect PR changes relevant to Temporal and adapter-postgres
        id: detect_changes
        if: github.event_name == 'pull_request'
        run: node tools/ci/emit-scope.mjs --mode pr-quality
        env:
          GIT_BASE: origin/${{ github.base_ref }}
          GIT_HEAD: ${{ github.sha }}

      - name: Set temporal_changed for workflow_dispatch
        id: wd_scope
        if:
          github.event_name == 'workflow_dispatch' && github.event.inputs.run_temporal_integration
          == 'true'
        run: echo "temporal_changed=true" >> $GITHUB_OUTPUT

  temporal-integration:
    name: Temporal adapter integration (time-skipping)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [pr-checks]
    if: >-
      needs.pr-checks.outputs.temporal_changed == 'true' && (github.event_name !=
      'workflow_dispatch' ||
       github.event.inputs.run_temporal_integration == 'true')
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: dvt_test
          POSTGRES_PASSWORD: dvt_test
          POSTGRES_DB: dvt_test
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 5432:5432
    env:
      DVT_PG_INTEGRATION: '1'
      DVT_PG_URL: postgresql://dvt_test:dvt_test@localhost:5432/dvt_test
      DATABASE_URL: postgresql://dvt_test:dvt_test@localhost:5432/dvt_test
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

      - name: Setup pnpm, cache and dependencies
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 22.x

      - name: Build contracts for integration
        run: pnpm --filter @dvt/contracts build

      - name: Run Temporal adapter integration (time-skipping)
        run: pnpm --filter @dvt/adapter-temporal test:integration

  all-checks-passed:
    name: All Checks Required for Merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [pr-checks, temporal-integration]
    if: always()
    steps:
      - name: Check all jobs
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const jobs = ${{ toJSON(needs) }};
            // Consider only explicit failures as blocking; ignore skipped/neutral jobs
            const failedJobs = Object.entries(jobs)
              .filter(([_, job]) => ['failure', 'cancelled'].includes(job.result))
              .map(([name, _]) => name);

            if (failedJobs.length > 0) {
              core.setFailed(`❌ The following checks failed: ${failedJobs.join(', ')}`);
            } else {
              core.info('✅ All PR quality checks passed!');
            }
