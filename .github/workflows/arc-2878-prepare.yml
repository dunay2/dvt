name: Isolated ARC 2878 preparation

on:
  push:
    branches: [automation/2878-arc-guidance-20260917]
    paths:
      - .github/arc-2878-spec.json
      - .github/workflows/arc-2878-prepare.yml

permissions:
  contents: write

concurrency:
  group: isolated-arc-2878-preparation
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GIT_BASE: 8396e9a06c6ee10a66ec6734be00b00a3ebae2bb
      GIT_HEAD: HEAD
      PLANNING_DB_INTEGRITY_SCOPE: bootstrap
    steps:
      - name: Read isolated preparation input
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Preserve input outside the product checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/arc2878"
          cp .github/arc-2878-spec.json "$RUNNER_TEMP/arc2878/edit-spec.json"
      - name: Checkout the exact product baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8396e9a06c6ee10a66ec6734be00b00a3ebae2bb
          fetch-depth: 0
          persist-credentials: true
      - name: Setup declared Node and pnpm dependencies
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 22.x
      - name: Prepare only the disposable CI database
        uses: ./.github/actions/prepare-planning-db
      - name: Verify inputs and demonstrate red then green
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'arc2878'
          spec = json.loads((out / 'edit-spec.json').read_text())
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          assert git('rev-parse', 'HEAD') == spec['base']
          assert not git('status', '--porcelain')
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          for change in spec['files']:
              assert blob(pathlib.Path(change['path']).read_bytes()) == change['before'], change['path']
          owners = ['.arc-policy.yaml', 'tools/ci/arc-check.mjs', 'tools/ci/doc-check.mjs', 'CLAUDE.md']
          (out / 'unchanged-owners.json').write_text(json.dumps({p:blob(pathlib.Path(p).read_bytes()) for p in owners}, indent=2))
          test_change = next(c for c in spec['files'] if c['path'].endswith('.test.mjs'))
          pathlib.Path(test_change['path']).write_text(test_change['content'])
          command = ['node', '--test', test_change['path']]
          red = subprocess.run(command, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
          (out / 'red.log').write_text(red.stdout)
          print(red.stdout)
          assert red.returncode == 1, 'missing procedure must fail'
          assert 'expected the single ARC-0 decision section' in red.stdout, 'wrong red boundary'
          assert '# pass 17' in red.stdout and '# fail 1' in red.stdout, 'unexpected red failures'
          for change in spec['files']:
              if change is test_change:
                  continue
              file = pathlib.Path(change['path'])
              text = file.read_text()
              for edit in change.get('ranges', []):
                  assert text.count(edit['start']) == 1 and text.count(edit['end']) == 1
                  a = text.index(edit['start'])
                  b = text.index(edit['end'], a)
                  text = text[:a] + edit['content'] + text[b:]
              for edit in change.get('replacements', []):
                  assert text.count(edit['old']) == 1
                  text = text.replace(edit['old'], edit['new'])
              file.write_text(text)
          green = subprocess.run(command, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
          (out / 'green.log').write_text(green.stdout)
          print(green.stdout)
          assert green.returncode == 0
          PY
      - name: Refresh the existing governance surfaces and commit with hooks
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/arc2878"
          pnpm docs:sync 2>&1 | tee "$out/docs-sync.log"
          pnpm governance:refresh 2>&1 | tee "$out/governance-refresh.log"
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'arc2878'
          def blob(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          for p,h in json.loads((out/'unchanged-owners.json').read_text()).items():
              assert blob(pathlib.Path(p).read_bytes())==h,p
          allowed={'AGENTS.md','docs/guides/ai-work-protocol.md','tools/ci/arc-policy-state-store.test.mjs','docs/.manifest.json'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed <= allowed, f'unexpected generated edits: {changed-allowed}'
          assert not subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).strip(), 'unexpected untracked files'
          PY
          git config user.name "DVT governance maintenance"
          git config user.email "34416258+dunay2@users.noreply.github.com"
          git switch -c docs/2878-arc-guidance
          git add AGENTS.md docs/guides/ai-work-protocol.md tools/ci/arc-policy-state-store.test.mjs docs/.manifest.json
          pnpm commit docs docs "Clarify ARC artifact selection without weakening policy" 2>&1 | tee "$out/commit.log"
          git rev-parse HEAD > "$out/head.txt"
          git rev-parse HEAD^{tree} > "$out/tree.txt"
      - name: Validate the exact committed candidate
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/arc2878"
          node --test tools/ci/arc-policy-state-store.test.mjs tools/ci/ci-tool-test-suite.test.mjs tools/ci/startup-card-canon.test.mjs 2>&1 | tee "$out/tests.log"
          node tools/ci/arc-check.mjs > "$out/arc.json"
          python - <<'PY'
          import json,os,pathlib
          arc=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'arc2878/arc.json').read_text())
          assert arc['effectiveArcLevel']=='ARC-0' and not any(arc['requirements'].values()),arc
          PY
          pnpm docs:sync:check 2>&1 | tee "$out/docs-sync-check.log"
          pnpm docs:gov:manifest:check 2>&1 | tee "$out/manifest-check.log"
          pnpm ci:docs 2>&1 | tee "$out/ci-docs.log"
          pnpm verify:prepush 2>&1 | tee "$out/prepush.log"
          pnpm pr:validate-title "docs(docs): Clarify ARC artifact selection without weakening policy" 2>&1 | tee "$out/pr-title.log"
          git diff --exit-code HEAD
          test -z "$(git status --porcelain)"
          git rev-parse HEAD > "$out/validated.txt"
          git diff --binary "$GIT_BASE" HEAD > "$out/candidate.patch"
          git diff --stat "$GIT_BASE" HEAD > "$out/stats.txt"
      - name: Publish only the validated topic branch
        shell: bash
        run: |
          set -euo pipefail
          expected=8396e9a06c6ee10a66ec6734be00b00a3ebae2bb
          current=$(git ls-remote origin refs/heads/docs/2878-arc-guidance | cut -f1)
          test "$current" = "$expected"
          git push origin HEAD:refs/heads/docs/2878-arc-guidance 2>&1 | tee "$RUNNER_TEMP/arc2878/push.log"
      - name: Preserve checksums and evidence, including failures
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'arc2878'
          out.mkdir(exist_ok=True)
          checks={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(out.iterdir()) if p.is_file() and p.name!='checksums.json'}
          (out/'checksums.json').write_text(json.dumps(checks,indent=2)+'\n')
          PY
      - name: Upload the bounded validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: arc-2878-validation
          path: ${{ runner.temp }}/arc2878
          if-no-files-found: error
          retention-days: 7
