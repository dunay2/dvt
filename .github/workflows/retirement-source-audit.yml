name: Isolated retirement source audit
on:
  push:
    branches: [automation/3004-retirement-20260919]
    paths: [.github/workflows/retirement-source-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 44d3e0d77a1a072a9bceb6c5d231f06256cdc4a3
          persist-credentials: false
      - name: Capture exact tracked sources without environment or credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/retirement-audit"
          git rev-parse HEAD > "$RUNNER_TEMP/retirement-audit/head.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/retirement-audit/tree.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/retirement-audit/git-tree.txt"
          git archive --format=tar HEAD | gzip -n > "$RUNNER_TEMP/retirement-audit/source.tar.gz"
          cd "$RUNNER_TEMP/retirement-audit"
          sha256sum head.txt tree.txt git-tree.txt source.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: retirement-source-audit
          path: ${{ runner.temp }}/retirement-audit
          retention-days: 7
          if-no-files-found: error
