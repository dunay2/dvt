name: VTX2 map one-shot formatter

on:
  push:
    branches:
      - docs/vtx2-substrait-development-map
    paths:
      - '.github/workflows/vtx2-map-format-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/vtx2-substrait-development-map
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Format only the VTX2 working map
        run: pnpm exec prettier --write docs/architecture/system/subsystems/semantic-transformation/vtx2-substrait-centered-development-map.md
      - name: Commit formatter output when changed
        run: |
          if git diff --quiet; then
            echo 'No formatter changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/architecture/system/subsystems/semantic-transformation/vtx2-substrait-centered-development-map.md
          git commit -m 'docs(docs): Format VTX2 working map with repository Prettier'
          git push --no-verify origin HEAD:docs/vtx2-substrait-development-map
