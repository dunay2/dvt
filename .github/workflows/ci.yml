name: CI - Code Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_markdown_lint:
        description: 'Run markdown lint job'
        required: false
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci-tool-contracts:
    name: CI tool contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.x

      - name: Run static CI tool contract tests
        run: node tools/ci/ci-tool-test-suite.mjs static

  detect-affected:
    name: Detect affected workspaces
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      any_changed: ${{ steps.matrix.outputs.any_changed }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      docs_changed: ${{ steps.scope.outputs.docs_changed }}
      changed_file_validation_relevant: ${{ steps.scope.outputs.changed_file_validation_relevant }}
      security_analysis_relevant: ${{ steps.scope.outputs.security_analysis_relevant }}
      ci_tool_executable_contracts_relevant:
        ${{ steps.scope.outputs.ci_tool_executable_contracts_relevant }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1

      - name: Fetch pull-request base ref
        uses: ./.github/actions/fetch-scope-base
        with:
          base-ref: ${{ github.base_ref }}

      - name: Validate workflow scope policy JSON
        run: node tools/ci/validate-policy.js tools/ci/policy/workflow-scope.json

      - name: Emit workflow scope outputs
        id: scope
        run: node tools/ci/emit-scope.mjs --mode workflow
        env:
          GIT_BASE: origin/${{ github.base_ref }}
          GIT_HEAD: ${{ github.sha }}

      - name: Build matrix from affected workspaces
        id: matrix
        run: node tools/ci/emit-workspace-matrix.mjs
        env:
          GIT_BASE: origin/${{ github.base_ref }}
          GIT_HEAD: ${{ github.sha }}

  ci-tool-executable-contracts:
    name: CI tool executable contracts
    needs: detect-affected
    if: >-
      github.event_name != 'pull_request' ||
      needs.detect-affected.outputs.ci_tool_executable_contracts_relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1

      - name: Setup pnpm, cache and dependencies
        uses: ./.github/actions/setup-node-pnpm

      - name: Run executable CI tool contract tests
        run: pnpm test:ci-tools:executable

  lint-and-format:
    name: Changed-slice verification
    needs: detect-affected
    if: >-
      github.event_name == 'pull_request' && (needs.detect-affected.outputs.any_changed == 'true' ||
      needs.detect-affected.outputs.docs_changed == 'true' ||
      needs.detect-affected.outputs.changed_file_validation_relevant == 'true' )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1

      - name: Fetch pull-request base ref
        uses: ./.github/actions/fetch-scope-base
        with:
          base-ref: ${{ github.base_ref }}

      - name: Setup pnpm, cache and dependencies
        uses: ./.github/actions/setup-node-pnpm

      - name: Run changed-slice verification
        run: pnpm verify:changed
        env:
          GIT_BASE: origin/${{ github.base_ref }}

  affected-preflight:
    name: Affected workspace preflight
    needs: detect-affected
    if: github.event_name == 'pull_request' && needs.detect-affected.outputs.any_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1

      - name: Fetch pull-request base ref
        uses: ./.github/actions/fetch-scope-base
        with:
          base-ref: ${{ github.base_ref }}

      - name: Setup pnpm, cache and dependencies
        uses: ./.github/actions/setup-node-pnpm

      - name: Run affected workspace build, lint and type-check preflight
        run: pnpm preflight:affected:ci
        env:
          DVT_CI: '1'

  full-ci:
    name: Full CI (main/manual)
    needs: detect-affected
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1

      - name: Setup pnpm, cache and dependencies
        uses: ./.github/actions/setup-node-pnpm

      - name: Prepare planning DB for full CI baseline
        uses: ./.github/actions/prepare-planning-db
        with:
          import-planning: 'true'
          import-governance: 'true'

      - name: Run full CI baseline
        run: pnpm ci:full
        env:
          DVT_CI: '1'
          NODE_OPTIONS: --max-old-space-size=4096
          TURBO_TOKEN: ${{ github.event_name != 'pull_request' && secrets.TURBO_TOKEN || '' }}
          TURBO_TEAM: ${{ github.event_name != 'pull_request' && secrets.TURBO_TEAM || '' }}

  no-affected-workspaces:
    name: No affected workspaces (PR)
    needs: detect-affected
    if: github.event_name == 'pull_request' && needs.detect-affected.outputs.any_changed != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "No workspace changes detected; skipping workspace build/test jobs."

  markdown-lint:
    name: Markdown Documentation
    needs: detect-affected
    if: >-
      github.event_name == 'push' || (github.event_name == 'workflow_dispatch' &&
      github.event.inputs.run_markdown_lint == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup pnpm, cache and dependencies
        uses: ./.github/actions/setup-node-pnpm

      - name: Lint changed Markdown files (PR)
        if: github.event_name == 'pull_request'
        run: pnpm lint:md:changed

      - name: Lint all Markdown files (push/manual)
        if: github.event_name != 'pull_request'
        run: pnpm lint:md
