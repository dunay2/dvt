name: CI - Code Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_markdown_lint:
        description: 'Run markdown lint job'
        required: false
        type: boolean
        default: false
      run_traceability_gate:
        description: 'Run ADR-0000 traceability gate'
        required: false
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-affected:
    name: Detect affected workspaces
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      any_changed: ${{ steps.matrix.outputs.any_changed }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      docs_changed: ${{ steps.matrix.outputs.docs_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

      - name: Detect changes by path (PR only)
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4
        with:
          filters: |
            global:
              - '.github/workflows/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
              - 'vitest.config.ts'
              - 'eslint.config.cjs'
              - '.prettierrc.json'
              - 'commitlint.config.cjs'
            api:
              - 'apps/api/**'
            web:
              - 'apps/web/**'
            contracts:
              - 'packages/@dvt/contracts/**'
            engine:
              - 'packages/@dvt/engine/**'
            adapter_postgres:
              - 'packages/@dvt/adapter-postgres/**'
            adapter_temporal:
              - 'packages/@dvt/adapter-temporal/**'
            cli:
              - 'packages/@dvt/cli/**'
            docs_only:
              - 'docs/**'
              - 'AGENTS.md'
              - 'CLAUDE.md'
              - '.vscode/**'
              - '.gitmessage'
              - '.gitignore'
              - 'scripts/generate-*.cjs'
              - 'scripts/commit.cjs'
              - 'scripts/docs-*.cjs'
              - 'scripts/setup-git-hooks.cjs'

      - name: Build matrix from affected workspaces
        id: matrix
        shell: bash
        run: |
          set -euo pipefail

          include='[]'
          add_item() {
            local name="$1"
            local pkg="$2"
            include=$(jq --arg n "$name" --arg p "$pkg" '. + [{name:$n,pkg:$p}]' <<< "$include")
          }

          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            add_item "api" "dvt-api"
            add_item "web" "@dvt/web"
            add_item "contracts" "@dvt/contracts"
            add_item "engine" "@dvt/engine"
            add_item "adapter-postgres" "@dvt/adapter-postgres"
            add_item "adapter-temporal" "@dvt/adapter-temporal"
            add_item "cli" "@dvt/cli"
          else
            global='${{ steps.filter.outputs.global }}'
            docs_only='${{ steps.filter.outputs.docs_only }}'
            any_workspace='${{ steps.filter.outputs.api == 'true' || steps.filter.outputs.web == 'true' || steps.filter.outputs.contracts == 'true' || steps.filter.outputs.engine == 'true' || steps.filter.outputs.adapter_postgres == 'true' || steps.filter.outputs.adapter_temporal == 'true' || steps.filter.outputs.cli == 'true' }}'

            # Skip all workspace builds when only docs/agent/utility files changed
            if [[ "$global" != "true" && "$any_workspace" != "true" && "$docs_only" == "true" ]]; then
              echo "any_changed=false" >> "$GITHUB_OUTPUT"
              echo "docs_changed=true" >> "$GITHUB_OUTPUT"
              echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [[ "$global" == "true" ]]; then
              add_item "api" "dvt-api"
              add_item "web" "@dvt/web"
              add_item "contracts" "@dvt/contracts"
              add_item "engine" "@dvt/engine"
              add_item "adapter-postgres" "@dvt/adapter-postgres"
              add_item "adapter-temporal" "@dvt/adapter-temporal"
              add_item "cli" "@dvt/cli"
            else
              [[ '${{ steps.filter.outputs.api }}' == 'true' ]] && add_item "api" "dvt-api"
              [[ '${{ steps.filter.outputs.web }}' == 'true' ]] && add_item "web" "@dvt/web"
              [[ '${{ steps.filter.outputs.contracts }}' == 'true' ]] && add_item "contracts" "@dvt/contracts"
              [[ '${{ steps.filter.outputs.engine }}' == 'true' ]] && add_item "engine" "@dvt/engine"
              [[ '${{ steps.filter.outputs.adapter_postgres }}' == 'true' ]] && add_item "adapter-postgres" "@dvt/adapter-postgres"
              [[ '${{ steps.filter.outputs.adapter_temporal }}' == 'true' ]] && add_item "adapter-temporal" "@dvt/adapter-temporal"
              [[ '${{ steps.filter.outputs.cli }}' == 'true' ]] && add_item "cli" "@dvt/cli"
            fi
          fi

          count=$(jq 'length' <<< "$include")
          if [[ "$count" -gt 0 ]]; then
            echo "any_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "any_changed=false" >> "$GITHUB_OUTPUT"
          fi

          include_compact=$(jq -c '.' <<< "$include")
          echo "matrix={\"include\":$include_compact}" >> "$GITHUB_OUTPUT"

          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "docs_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_changed=${{ steps.filter.outputs.docs_only }}" >> "$GITHUB_OUTPUT"
          fi

  lint-and-format:
    name: ESLint + Prettier (changed files)
    needs: detect-affected
    if: >-
      github.event_name != 'pull_request' || needs.detect-affected.outputs.any_changed == 'true' ||
      needs.detect-affected.outputs.docs_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Setup pnpm, cache and dependencies
        uses: ./.github/actions/setup-node-pnpm

      - name: Run changed-file checks
        run: node scripts/check-changed.cjs

      - name: ADR-0000 traceability gate
        if: >-
          ${{
            github.event_name == 'workflow_dispatch' &&
            github.event.inputs.run_traceability_gate == 'true'
          }}
        run: pnpm traceability:adr0

  workspace-ci:
    name: Workspace CI (${{ matrix.name }})
    needs: detect-affected
    if: github.event_name != 'pull_request' || needs.detect-affected.outputs.any_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-affected.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1

      - name: Setup pnpm, cache and dependencies
        uses: ./.github/actions/setup-node-pnpm

      - name: Build affected workspace (including workspace dependencies)
        run: pnpm --filter "${{ matrix.pkg }}..." --if-present run build

      - name: Type-check affected workspace
        run: pnpm --filter "${{ matrix.pkg }}" --if-present run typecheck

  no-affected-workspaces:
    name: No affected workspaces (PR)
    needs: detect-affected
    if: github.event_name == 'pull_request' && needs.detect-affected.outputs.any_changed != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "No workspace changes detected; skipping workspace build/test jobs."

  markdown-lint:
    name: Markdown Documentation
    needs: detect-affected
    if: >-
      github.event_name == 'push' || (github.event_name == 'pull_request' &&
      needs.detect-affected.outputs.docs_changed == 'true') || (github.event_name ==
      'workflow_dispatch' && github.event.inputs.run_markdown_lint == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup pnpm, cache and dependencies
        uses: ./.github/actions/setup-node-pnpm

      - name: Lint Markdown files
        run: pnpm lint:md
