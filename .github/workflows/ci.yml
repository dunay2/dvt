name: CI - Code Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_markdown_lint:
        description: 'Run markdown lint job'
        required: false
        type: boolean
        default: false
      run_traceability_gate:
        description: 'Run ADR-0000 traceability gate (deprecated: now runs automatically on push)'
        required: false
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-affected:
    name: Detect affected workspaces
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      any_changed: ${{ steps.matrix.outputs.any_changed }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      docs_changed: ${{ steps.scope.outputs.docs_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

      - name: Validate workflow scope policy JSON
        run: node tools/ci/validate-policy.js tools/ci/policy/workflow-scope.json

      - name: Emit workflow scope outputs
        id: scope
        run: node tools/ci/emit-scope.mjs --mode workflow
        env:
          GIT_BASE: origin/${{ github.base_ref }}
          GIT_HEAD: ${{ github.sha }}

      - name: Build matrix from affected workspaces
        id: matrix
        run: node tools/ci/emit-workspace-matrix.mjs
        env:
          GIT_BASE: origin/${{ github.base_ref }}
          GIT_HEAD: ${{ github.sha }}

  lint-and-format:
    name: ESLint + Prettier (changed files)
    needs: detect-affected
    if: >-
      github.event_name != 'pull_request' || needs.detect-affected.outputs.any_changed == 'true' ||
      needs.detect-affected.outputs.docs_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Setup pnpm, cache and dependencies
        uses: ./.github/actions/setup-node-pnpm

      - name: Run changed-file checks
        run: node scripts/check-changed.cjs

      - name: ADR-0000 traceability gate
        if: github.event_name == 'push'
        run: pnpm traceability:adr0

  workspace-ci:
    name: Workspace CI (${{ matrix.name }})
    needs: detect-affected
    if: github.event_name != 'pull_request' || needs.detect-affected.outputs.any_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-affected.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1

      - name: Setup pnpm, cache and dependencies
        uses: ./.github/actions/setup-node-pnpm

      - name: Build affected workspace (including workspace dependencies)
        run: pnpm --workspace-concurrency=4 --filter "${{ matrix.pkg }}..." --if-present run build
        env:
          DVT_CI: '1'

      - name: Type-check affected workspace
        run: pnpm --filter "${{ matrix.pkg }}" --if-present run typecheck
        env:
          DVT_CI: '1'

  no-affected-workspaces:
    name: No affected workspaces (PR)
    needs: detect-affected
    if: github.event_name == 'pull_request' && needs.detect-affected.outputs.any_changed != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "No workspace changes detected; skipping workspace build/test jobs."

  markdown-lint:
    name: Markdown Documentation
    needs: detect-affected
    if: >-
      github.event_name == 'push' || (github.event_name == 'pull_request' &&
      needs.detect-affected.outputs.docs_changed == 'true') || (github.event_name ==
      'workflow_dispatch' && github.event.inputs.run_markdown_lint == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup pnpm, cache and dependencies
        uses: ./.github/actions/setup-node-pnpm

      - name: Lint changed Markdown files (PR)
        if: github.event_name == 'pull_request'
        run: pnpm lint:md:changed

      - name: Lint all Markdown files (push/manual)
        if: github.event_name != 'pull_request'
        run: pnpm lint:md
