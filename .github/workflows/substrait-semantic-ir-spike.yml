name: Substrait semantic IR spike

on:
  push:
    branches:
      - study/substrait-semantic-ir-spike
    paths:
      - '.github/workflows/substrait-semantic-ir-spike.yml'
      - 'spikes/substrait-semantic-ir/**'
      - 'docs/planning/reviews/20260824-substrait-semantic-ir-spike-plan.md'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/substrait-semantic-ir-spike.yml'
      - 'spikes/substrait-semantic-ir/**'
      - 'docs/planning/reviews/20260824-substrait-semantic-ir-spike-plan.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture-baseline:
    name: Planning DB architecture baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ffee4ee479b683e3346d5a96749229f798d4ca41
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Planning DB prerequisites
        run: pnpm --filter @dvt/crypto build
      - name: Bootstrap and import Planning DB baseline
        run: |
          pnpm planning:db:up
          pnpm planning:db:health --wait
          node scripts/planning-db-schema.cjs
          pnpm planning:db:import
      - name: Capture architecture authority
        run: |
          mkdir -p spike-results/planning-db
          pnpm planning:db:query architecture-designs --limit 100 > spike-results/planning-db/architecture-designs.json
          pnpm planning:db:query architecture-components --limit 200 > spike-results/planning-db/architecture-components.json
          pnpm planning:db:query architecture-relations --limit 300 > spike-results/planning-db/architecture-relations.json
          pnpm planning:db:query command-query-rails --limit 200 > spike-results/planning-db/command-query-rails.json
          printf '%s\n' 'ffee4ee479b683e3346d5a96749229f798d4ca41' > spike-results/planning-db/baseline-sha.txt
      - name: Upload architecture baseline
        uses: actions/upload-artifact@v4
        with:
          name: substrait-planning-db-baseline
          path: spike-results/planning-db
          if-no-files-found: error
          retention-days: 14
      - name: Stop Planning DB
        if: always()
        run: pnpm planning:db:down

  semantic-spike:
    name: Semantic spike / DuckDB ${{ matrix.duckdb }}
    needs: architecture-baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        duckdb: ['1.2.2', '1.5.5']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: spikes/substrait-semantic-ir/requirements.txt
      - name: Install pinned semantic tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r spikes/substrait-semantic-ir/requirements.txt
          python -m pip install "duckdb==${{ matrix.duckdb }}"
      - name: Execute outcome-agnostic spike
        run: |
          python spikes/substrait-semantic-ir/run_spike.py \
            --output "spike-results/semantic/duckdb-${{ matrix.duckdb }}"
      - name: Upload semantic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: substrait-semantic-duckdb-${{ matrix.duckdb }}
          path: spike-results/semantic/duckdb-${{ matrix.duckdb }}
          if-no-files-found: error
          retention-days: 14

  typescript-bindings:
    name: TypeScript bindings / Substrait v0.99.0
    needs: architecture-baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: substrait-io/substrait
          ref: v0.99.0
          path: upstream-substrait
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact binding tool versions
        working-directory: spikes/substrait-semantic-ir/typescript
        run: npm install --no-audit --no-fund
      - name: Generate, typecheck and roundtrip bindings
        working-directory: spikes/substrait-semantic-ir/typescript
        run: |
          mkdir -p ../../../spike-results/typescript
          started=$(date +%s%N)
          npm run generate
          finished=$(date +%s%N)
          printf '{"generationMilliseconds": %.3f}\n' "$((finished-started))e-6" > ../../../spike-results/typescript/generation-time.json
          npm run typecheck
          npm run smoke > ../../../spike-results/typescript/smoke.json
          DVT_TS_BINDING_REPORT=../../../spike-results/typescript/bindings.json npm run measure
          npm ls --all --json > ../../../spike-results/typescript/npm-tree.json
          cp package-lock.json ../../../spike-results/typescript/package-lock.json
          du -sb node_modules | awk '{print "{\"nodeModulesBytes\":" $1 "}"}' > ../../../spike-results/typescript/install-size.json
      - name: Upload TypeScript binding evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: substrait-typescript-v0.99.0
          path: spike-results/typescript
          if-no-files-found: error
          retention-days: 14
