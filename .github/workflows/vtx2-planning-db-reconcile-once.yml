name: VTX2 Planning DB reconciliation

on:
  push:
    branches:
      - docs/vtx2-substrait-development-map
    paths:
      - '.github/workflows/vtx2-planning-db-reconcile-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/vtx2-substrait-development-map
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Build Planning DB crypto prerequisite
        run: pnpm --filter @dvt/crypto build
      - name: Import Planning DB if stale
        run: pnpm planning:db:import --if-stale
      - name: Query canonical architecture designs
        run: pnpm planning:db:query architecture-designs --limit 100
