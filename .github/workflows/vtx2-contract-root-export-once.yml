name: VTX2 contracts root export one-shot

on:
  push:
    branches:
      - agent/vtx2-substrait-card-pilot
    paths:
      - '.github/workflows/vtx2-contract-root-export-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vtx2-substrait-card-pilot
          fetch-depth: 0
      - name: Reuse the contracts root entrypoint
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          index = Path('packages/@dvt/contracts/src/index.ts')
          text = index.read_text()
          line = "export * from './substrait.js';\n"
          if line not in text:
              anchor = "export * from './workflows.js';\n"
              if anchor not in text:
                  raise SystemExit('contracts root export anchor not found')
              text = text.replace(anchor, anchor + line, 1)
              index.write_text(text)

          for name in [
              'apps/web/src/app/views/canvas/canvasDvtAuthoringModel.ts',
              'apps/web/src/app/views/canvas/canvasDvtSubstraitPilot.test.ts',
              'apps/web/src/app/views/canvas/canvasDvtSubstraitPilot.ts',
              'apps/web/src/app/views/canvas/canvasDvtTransformAuthoringAuthority.ts',
          ]:
              path = Path(name)
              text = path.read_text()
              text = text.replace("from '@dvt/contracts/substrait';", "from '@dvt/contracts';")
              path.write_text(text)
          PY
      - name: Format touched files
        run: >-
          npx --yes prettier@3.9.5 --write
          packages/@dvt/contracts/src/index.ts
          apps/web/src/app/views/canvas/canvasDvtAuthoringModel.ts
          apps/web/src/app/views/canvas/canvasDvtSubstraitPilot.test.ts
          apps/web/src/app/views/canvas/canvasDvtSubstraitPilot.ts
          apps/web/src/app/views/canvas/canvasDvtTransformAuthoringAuthority.ts
      - name: Commit focused boundary fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/@dvt/contracts/src/index.ts \
            apps/web/src/app/views/canvas/canvasDvtAuthoringModel.ts \
            apps/web/src/app/views/canvas/canvasDvtSubstraitPilot.test.ts \
            apps/web/src/app/views/canvas/canvasDvtSubstraitPilot.ts \
            apps/web/src/app/views/canvas/canvasDvtTransformAuthoringAuthority.ts
          git commit -m 'fix(contracts): Reuse root entrypoint for Substrait contracts'
          git push --no-verify origin HEAD:agent/vtx2-substrait-card-pilot
