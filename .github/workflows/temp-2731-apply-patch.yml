name: Apply bounded PTH2.5d test patch

on:
  push:
    branches:
      - "test/2731-dbt-test-workbench-reload-roundtrip"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.repository == 'dunay2/dvt' && (github.event_name == 'push' || github.head_ref == 'test/2731-dbt-test-workbench-reload-roundtrip')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: test/2731-dbt-test-workbench-reload-roundtrip
          fetch-depth: 0

      - name: Apply exact test-only patch and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          target = Path('apps/web/cypress/e2e/canvas/canvas-het2-rest-artifact-dbt-live.cy.ts')
          workflow = Path('.github/workflows/temp-2731-apply-patch.yml')
          text = target.read_text(encoding='utf-8')

          helper_anchor = """function assertAcquisitionEvidence(args: {\n"""
          helper = """function assertPersistedDbtTestWorkbenchRoundtrip(): void {
            openNodeWorkbench(TEST_NODE_NAME);
            cy.get('select[name=\"dbt-test-type\"]').should('have.value', 'not_null');
            cy.get('select[name=\"dbt-test-target\"]').should('have.value', MODEL_NODE_ID);
            cy.get('input[name=\"dbt-test-column\"]').should('have.value', 'order_id');
            cy.get('select[name=\"dbt-test-severity\"]').should('have.value', 'error');
            closeNodeWorkbench();

            openNodeWorkbench(MODEL_NODE_NAME);
            openNodeWorkbenchSection('tests');
            cy.get('[data-slot=\"canvas-node-workbench-tests-content\"]')
              .should('be.visible')
              .within(() => {
                cy.get('tbody tr')
                  .should('have.length', 1)
                  .first()
                  .within(() => {
                    cy.get('td').eq(0).should('have.text', TEST_NODE_NAME);
                    cy.get('td').eq(1).should('have.text', 'not_null');
                    cy.get('td').eq(2).should('have.text', `${MODEL_NODE_NAME}.order_id`);
                    cy.get('td').eq(3).should('have.text', 'order_id');
                    cy.get('td').eq(4).should('have.text', 'error');
                  });
              });
            closeNodeWorkbench();
          }

          """

          call_anchor = """      visitHet1DbtCanvas();
                runSuccessfulRoute(manifest, 'created', ['created', 'replaced']);
          """
          call_replacement = """      visitHet1DbtCanvas();
                assertPersistedDbtTestWorkbenchRoundtrip();
                runSuccessfulRoute(manifest, 'created', ['created', 'replaced']);
          """

          if helper in text:
              raise SystemExit('helper already present; refusing duplicate patch')
          if text.count(helper_anchor) != 1:
              raise SystemExit(f'expected one helper anchor, found {text.count(helper_anchor)}')
          if text.count(call_anchor) != 1:
              raise SystemExit(f'expected one call anchor, found {text.count(call_anchor)}')

          text = text.replace(helper_anchor, helper + helper_anchor, 1)
          text = text.replace(call_anchor, call_replacement, 1)
          target.write_text(text, encoding='utf-8')
          workflow.unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/cypress/e2e/canvas/canvas-het2-rest-artifact-dbt-live.cy.ts .github/workflows/temp-2731-apply-patch.yml
          git commit -m "test(web): prove dbt test Workbench reload roundtrip"
          git push origin HEAD:test/2731-dbt-test-workbench-reload-roundtrip
