name: VTX2 pilot governance one-shot

on:
  push:
    branches:
      - agent/vtx2-substrait-card-pilot
    paths:
      - '.github/workflows/vtx2-pilot-governance-once.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vtx2-substrait-card-pilot
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-pnpm
      - name: Remove one-shot from governed tree
        run: rm .github/workflows/vtx2-pilot-governance-once.yml
      - run: pnpm --filter @dvt/crypto build
      - name: Prepare current-schema Planning DB for document sync
        run: |
          pnpm planning:db:up
          pnpm planning:db:health --wait
          node scripts/planning-db-schema.cjs
          pnpm planning:db:import
      - name: Stabilize governed generated surfaces only
        run: |
          for pass in 1 2; do
            echo "governance generation pass ${pass}/2"
            node scripts/sync-docs.cjs
            pnpm docs:status:generate --code-state-only
            pnpm docs:capability:generate
            pnpm docs:gov:manifest
            pnpm docs:governance:document-unit-map
            pnpm docs:governance:file-component-index
            pnpm docs:governance:file-fingerprint-baseline
            pnpm docs:governance:file-fingerprint-impact
          done
      - name: Commit generated governance state
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(docs): Refresh VTX2 pilot indexes'
          git push --no-verify origin HEAD:agent/vtx2-substrait-card-pilot
