name: VTX2 pilot governance one-shot

on:
  push:
    branches:
      - agent/vtx2-substrait-card-pilot
    paths:
      - '.github/workflows/vtx2-pilot-governance-once.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vtx2-substrait-card-pilot
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-pnpm
      - name: Remove one-shot from governed tree
        run: rm .github/workflows/vtx2-pilot-governance-once.yml
      - name: Build governance runtime dependency
        run: pnpm --filter @dvt/crypto build
      - name: Prepare current-schema Planning DB
        run: |
          pnpm planning:db:up
          pnpm planning:db:health --wait
          node scripts/planning-db-schema.cjs
          pnpm planning:db:import
      - name: Refresh governance
        run: pnpm governance:refresh
      - name: Commit generated governance state
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(governance): refresh VTX2 pilot indexes'
          git push --no-verify origin HEAD:agent/vtx2-substrait-card-pilot
