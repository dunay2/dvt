name: VTX2 governance refresh one-shot

on:
  push:
    branches:
      - agent/vtx2-substrait-card-pilot
    paths:
      - '.github/workflows/vtx2-governance-refresh-once.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/vtx2-substrait-card-pilot
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-pnpm
      - name: Build governance runtime dependency
        run: pnpm --filter @dvt/crypto build
      - name: Format review-touched source files
        run: >-
          pnpm exec prettier --write
          apps/web/src/app/views/canvas/DvtSubstraitPilotEntry.test.tsx
          apps/web/src/app/views/canvas/canvasDvtSubstraitPilot.ts
          packages/@dvt/contracts/src/contracts/planner/DvtSubstraitCapabilityCatalog.v1.ts
          packages/@dvt/contracts/test/dvt-substrait-capability-catalog.contract.test.ts
          apps/web/src/app/views/canvas/canvasNodePresentationProjection.ts
          apps/web/src/app/views/canvas/canvasSubstraitPresentationFailClosed.test.ts
      - name: Start Planning DB
        run: pnpm planning:db:up
      - name: Wait for Planning DB
        run: pnpm planning:db:health --wait
      - name: Bootstrap current Planning DB schema
        run: node scripts/planning-db-schema.cjs
      - name: Import repository governance into Planning DB
        run: pnpm planning:db:import
      - name: Refresh governed repository surfaces
        run: pnpm governance:refresh
      - name: Commit generated governance surfaces
        run: |
          if git diff --quiet && [[ -z "$(git ls-files --others --exclude-standard)" ]]; then
            echo 'No governance changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset -- .github/workflows/vtx2-governance-refresh-once.yml
          git commit -m 'docs(governance): Refresh VTX2 Substrait pilot indexes'
          git push --no-verify origin HEAD:agent/vtx2-substrait-card-pilot

