name: VTX2 governance refresh one-shot

on:
  push:
    branches:
      - agent/vtx2-substrait-card-pilot
    paths:
      - '.github/workflows/vtx2-governance-refresh-once.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/vtx2-substrait-card-pilot
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-pnpm
      - name: Remove this one-shot from the final tree
        run: rm .github/workflows/vtx2-governance-refresh-once.yml
      - name: Build governance runtime dependency
        run: pnpm --filter @dvt/crypto build
      - name: Format review-touched source files
        run: >-
          pnpm exec prettier --write
          apps/web/src/app/views/canvas/DvtSubstraitPilotEntry.test.tsx
          apps/web/src/app/views/canvas/canvasDvtSubstraitPilot.ts
          packages/@dvt/contracts/src/contracts/planner/DvtSubstraitCapabilityCatalog.v1.ts
          packages/@dvt/contracts/test/dvt-substrait-capability-catalog.contract.test.ts
          apps/web/src/app/views/canvas/canvasNodePresentationProjection.ts
          apps/web/src/app/views/canvas/canvasSubstraitPresentationFailClosed.test.ts
      - name: Prepare ephemeral current-schema Planning DB
        run: |
          pnpm planning:db:up
          pnpm planning:db:health --wait
          node scripts/planning-db-schema.cjs
          pnpm planning:db:import
      - name: Generate governed navigation and ownership surfaces
        run: |
          for pass in 1 2; do
            echo "governance generation pass ${pass}/2"
            node scripts/sync-docs.cjs
            pnpm docs:gov:manifest
            pnpm docs:governance:document-unit-map
            pnpm docs:governance:file-component-index
            pnpm docs:governance:file-fingerprint-baseline
            pnpm docs:governance:file-fingerprint-impact
          done
      - name: Commit final governed surfaces and remove the one-shot
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(governance): Refresh VTX2 Substrait pilot indexes'
          git push --no-verify origin HEAD:agent/vtx2-substrait-card-pilot
