name: VTX2 Substrait one-shot formatter

on:
  push:
    branches:
      - agent/vtx2-substrait-card-pilot
    paths:
      - '.github/workflows/vtx2-substrait-format-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vtx2-substrait-card-pilot
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Format only VTX2 pilot files flagged by CI
        run: >-
          pnpm exec prettier --write
          apps/web/src/app/views/canvas/CanvasNodeWorkbenchPanel.tsx
          apps/web/src/app/views/canvas/DvtSubstraitPilotAuthoringSection.tsx
          apps/web/src/app/views/canvas/canvasDvtAuthoringModel.ts
          apps/web/src/app/views/canvas/canvasDvtSubstraitPilot.test.ts
          apps/web/src/app/views/canvas/canvasDvtSubstraitPilot.ts
          apps/web/src/app/views/canvas/canvasTransformationSqlMirror.ts
          packages/@dvt/contracts/test/visual-transform-recipe.contract.test.ts
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo 'No formatter changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/web/src/app/views/canvas/CanvasNodeWorkbenchPanel.tsx \
            apps/web/src/app/views/canvas/DvtSubstraitPilotAuthoringSection.tsx \
            apps/web/src/app/views/canvas/canvasDvtAuthoringModel.ts \
            apps/web/src/app/views/canvas/canvasDvtSubstraitPilot.test.ts \
            apps/web/src/app/views/canvas/canvasDvtSubstraitPilot.ts \
            apps/web/src/app/views/canvas/canvasTransformationSqlMirror.ts \
            packages/@dvt/contracts/test/visual-transform-recipe.contract.test.ts
          git commit -m 'style(web): Format VTX2 Substrait pilot files'
          git push --no-verify origin HEAD:agent/vtx2-substrait-card-pilot
