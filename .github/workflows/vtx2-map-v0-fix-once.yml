name: VTX2 map V0 correction one-shot
on:
  push:
    branches: [docs/vtx2-substrait-development-map]
    paths: ['.github/workflows/vtx2-map-v0-fix-once.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/vtx2-substrait-development-map
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm --filter @dvt/crypto build
      - name: Correct map
        run: node -e "eval(Buffer.from('','base64').toString())"
      - run: pnpm exec prettier --write docs/architecture/system/subsystems/semantic-transformation/vtx2-substrait-centered-development-map.md
      - run: pnpm governance:refresh
      - name: Commit corrected map
        run: |
          rm -f .github/workflows/vtx2-map-format-once.yml .github/workflows/vtx2-planning-db-reconcile-once.yml .github/workflows/vtx2-map-v0-fix-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(architecture): align VTX2 V0 PostgreSQL projection'
          git push --no-verify origin HEAD:docs/vtx2-substrait-development-map
