name: VTX2 map V0 correction one-shot
on:
  push:
    branches: [docs/vtx2-substrait-development-map]
    paths: ['.github/workflows/vtx2-map-v0-fix-once.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/vtx2-substrait-development-map
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-pnpm
      - name: Remove one-shot workflows from governed tree
        run: rm -f .github/workflows/vtx2-map-format-once.yml .github/workflows/vtx2-planning-db-reconcile-once.yml .github/workflows/vtx2-map-v0-fix-once.yml
      - run: pnpm --filter @dvt/crypto build
      - name: Prepare current-schema Planning DB for document sync
        run: |
          pnpm planning:db:up
          pnpm planning:db:health --wait
          node scripts/planning-db-schema.cjs
          pnpm planning:db:import
      - name: Correct map
        run: node -e "eval(Buffer.from('','base64').toString())"
      - run: pnpm exec prettier --write docs/architecture/system/subsystems/semantic-transformation/vtx2-substrait-centered-development-map.md
      - name: Stabilize governed generated surfaces only
        run: |
          for pass in 1 2; do
            echo "governance generation pass ${pass}/2"
            node scripts/sync-docs.cjs
            pnpm docs:status:generate --code-state-only
            pnpm docs:capability:generate
            pnpm docs:gov:manifest
            pnpm docs:governance:document-unit-map
            pnpm docs:governance:file-component-index
            pnpm docs:governance:file-fingerprint-baseline
            pnpm docs:governance:file-fingerprint-impact
          done
      - name: Commit corrected map
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(architecture): align VTX2 V0 PostgreSQL projection'
          git push --no-verify origin HEAD:docs/vtx2-substrait-development-map
