name: LikeC4 source-first architecture preview

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout spike
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch source baseline
        run: git fetch --no-tags origin main

      - name: Generate Planner source evidence
        run: node architecture/tools/generate-source-first-context.mjs planner

      - name: Generate Artifacts source evidence
        run: node architecture/tools/generate-source-first-context.mjs artifacts

      - name: Stage combined LikeC4 workspace
        run: |
          rm -rf .source-first-likec4-preview
          mkdir -p .source-first-likec4-preview .architecture-evidence
          cp architecture/specification.c4 .source-first-likec4-preview/specification.c4
          cp architecture/planner.c4 .source-first-likec4-preview/planner.c4
          cp architecture/artifacts.c4 .source-first-likec4-preview/artifacts.c4
          cp architecture/generated/planner-source.c4 .source-first-likec4-preview/planner-source.c4
          cp architecture/generated/artifacts-source.c4 .source-first-likec4-preview/artifacts-source.c4
          cat > .source-first-likec4-preview/likec4.config.json <<'JSON'
          {
            "$schema": "https://likec4.dev/schemas/config.json",
            "name": "dvt-source-first-architecture-spike",
            "title": "DVT+ — Source-first architecture",
            "metadata": {
              "status": "manual-spike",
              "repository": "dunay2/dvt",
              "baselineSha": "42504563629f0b998d8a3382ea839eead99a36d1"
            }
          }
          JSON
          cp architecture/generated/planner-inventory.json .architecture-evidence/planner-inventory.json
          cp architecture/generated/planner-source.c4 .architecture-evidence/planner-source.c4
          cp architecture/contexts/planner-components.json .architecture-evidence/planner-components.json
          cp architecture/contexts/planner-source-baseline.json .architecture-evidence/planner-source-baseline.json
          cp architecture/generated/artifacts-inventory.json .architecture-evidence/artifacts-inventory.json
          cp architecture/generated/artifacts-source.c4 .architecture-evidence/artifacts-source.c4
          cp architecture/contexts/artifacts-components.json .architecture-evidence/artifacts-components.json
          cp architecture/contexts/artifacts-source-baseline.json .architecture-evidence/artifacts-source-baseline.json

      - name: Validate source-first LikeC4 model
        run: |
          cd .source-first-likec4-preview
          npx --yes likec4@1.59.2 validate

      - name: Build source-first LikeC4 static site
        uses: likec4/actions@v1
        with:
          action: build
          path: .source-first-likec4-preview
          output: dist
          base: ./
          likec4-version: 1.59.2

      - name: Publish machine-readable source evidence
        run: |
          sudo mkdir -p dist/source
          sudo cp .architecture-evidence/* dist/source/
          sudo chown -R "$USER":"$USER" dist

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: dvt-likec4-source-first-preview
          path: dist

      - name: Publish disposable gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
