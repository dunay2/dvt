name: LikeC4 Planner source-first spike preview

on:
  push:
    branches:
      - spike/likec4-planner-source-first
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout spike
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch source baseline
        run: git fetch --no-tags origin main

      - name: Generate source-first Planner inventory
        run: node architecture/tools/generate-planner-preview-v2.mjs

      - name: Reject invalid navigation in generated source model
        run: |
          if grep -n -E '^\s*navigateTo\s+' architecture/generated/planner-source.c4; then
            echo 'Generated Planner source model contains invalid model-level navigateTo' >&2
            exit 1
          fi

      - name: Stage Planner-only LikeC4 workspace
        run: |
          rm -rf .planner-likec4-preview
          mkdir -p .planner-likec4-preview .architecture-evidence
          cp architecture/specification.c4 .planner-likec4-preview/specification.c4
          cp architecture/planner.c4 .planner-likec4-preview/planner.c4
          cp architecture/generated/planner-source.c4 .planner-likec4-preview/planner-source.c4
          cat > .planner-likec4-preview/likec4.config.json <<'JSON'
          {
            "$schema": "https://likec4.dev/schemas/config.json",
            "name": "dvt-planner-source-first-spike",
            "title": "DVT+ Planner — Source-first architecture",
            "metadata": {
              "status": "manual-spike",
              "repository": "dunay2/dvt",
              "baselineSha": "4e63f9a65e25f409ad975fa1da5620e569bb3a36",
              "scope": "packages/@dvt/planner"
            }
          }
          JSON
          cp architecture/generated/planner-inventory.json .architecture-evidence/planner-inventory.json
          cp architecture/generated/planner-source.c4 .architecture-evidence/planner-source.c4
          cp architecture/planner-components.json .architecture-evidence/planner-components.json
          cp architecture/planner-source-baseline.json .architecture-evidence/planner-source-baseline.json

      - name: Validate Planner LikeC4 model
        run: |
          cd .planner-likec4-preview
          npx --yes likec4@1.59.2 validate

      - name: Build Planner LikeC4 static site
        uses: likec4/actions@v1
        with:
          action: build
          path: .planner-likec4-preview
          output: dist
          base: ./
          likec4-version: 1.59.2

      - name: Publish machine-readable source evidence
        run: |
          sudo mkdir -p dist/source
          sudo cp .architecture-evidence/* dist/source/
          sudo chown -R "$USER":"$USER" dist

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: dvt-likec4-planner-source-first-preview
          path: dist

      - name: Publish disposable gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
