name: LikeC4 source-first architecture preview

on:
  push:
    branches:
      - spike/likec4-planner-source-first
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-first-architecture-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout spike
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch source baseline
        run: git fetch --no-tags origin main

      - name: Prepare source-first preview
        run: node architecture/tools/prepare-source-first-preview.mjs

      - name: Derive observed import evidence from current main
        run: |
          BASELINE_SHA="$(node -e "const fs=require('fs');process.stdout.write(JSON.parse(fs.readFileSync('.architecture-evidence/resolved-baseline.json','utf8')).baselineSha)")"
          git worktree add --detach .architecture-main "$BASELINE_SHA"
          (
            cd .architecture-main
            npx --yes --package dependency-cruiser@17.3.9 --package typescript@5.9.3 \
              depcruise apps packages \
              --config .dependency-cruiser.cjs \
              --output-type json \
              --output-to ../.architecture-evidence/dependency-cruise.json
          )
          node architecture/tools/generate-observed-import-landscape.mjs \
            .architecture-evidence/dependency-cruise.json "$BASELINE_SHA"
          cp architecture/generated/context-imports.c4 .source-first-likec4-preview/context-imports.c4
          cp architecture/generated/context-imports.json .architecture-evidence/context-imports.json
          git worktree remove --force .architecture-main

      - name: Validate source-first LikeC4 model
        run: |
          cd .source-first-likec4-preview
          npx --yes likec4@1.59.2 validate

      - name: Build source-first LikeC4 static site
        uses: likec4/actions@v1
        with:
          action: build
          path: .source-first-likec4-preview
          output: dist
          base: ./
          likec4-version: 1.59.2

      - name: Publish machine-readable source evidence
        run: |
          sudo mkdir -p dist/source
          sudo cp .architecture-evidence/* dist/source/
          sudo chown -R "$USER":"$USER" dist

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: dvt-likec4-source-first-preview
          path: dist

      - name: Publish disposable gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
