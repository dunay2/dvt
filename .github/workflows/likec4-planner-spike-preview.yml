name: LikeC4 source-first architecture preview

on:
  push:
    branches:
      - spike/likec4-planner-source-first
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout spike
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch source baseline
        run: git fetch --no-tags origin main

      - name: Generate source-first evidence
        run: |
          for context in planner plan-verifier plan-interpreter engine run-domain artifacts state-store delivery adapter-temporal adapter-postgres; do
            node architecture/tools/generate-source-first-context.mjs "$context"
          done

      - name: Stage combined LikeC4 workspace
        run: |
          rm -rf .source-first-likec4-preview
          mkdir -p .source-first-likec4-preview .architecture-evidence
          cp architecture/specification.c4 .source-first-likec4-preview/specification.c4
          for context in planner plan-verifier plan-interpreter engine run-domain artifacts state-store delivery adapter-temporal adapter-postgres; do
            cp "architecture/${context}.c4" ".source-first-likec4-preview/${context}.c4"
            cp "architecture/generated/${context}-source.c4" ".source-first-likec4-preview/${context}-source.c4"
            cp "architecture/generated/${context}-inventory.json" ".architecture-evidence/${context}-inventory.json"
            cp "architecture/generated/${context}-source.c4" ".architecture-evidence/${context}-source.c4"
            cp "architecture/contexts/${context}-components.json" ".architecture-evidence/${context}-components.json"
            cp "architecture/contexts/${context}-source-baseline.json" ".architecture-evidence/${context}-source-baseline.json"
          done
          cat > .source-first-likec4-preview/likec4.config.json <<'JSON'
          {
            "$schema": "https://likec4.dev/schemas/config.json",
            "name": "dvt-source-first-architecture-spike",
            "title": "DVT+ — Source-first architecture",
            "metadata": {
              "status": "manual-spike",
              "repository": "dunay2/dvt",
              "baselineSha": "42504563629f0b998d8a3382ea839eead99a36d1",
              "contexts": "planner,plan-verifier,plan-interpreter,engine,run-domain,artifacts,state-store,delivery,adapter-temporal,adapter-postgres"
            }
          }
          JSON

      - name: Validate source-first LikeC4 model
        run: |
          cd .source-first-likec4-preview
          npx --yes likec4@1.59.2 validate

      - name: Build source-first LikeC4 static site
        uses: likec4/actions@v1
        with:
          action: build
          path: .source-first-likec4-preview
          output: dist
          base: ./
          likec4-version: 1.59.2

      - name: Publish machine-readable source evidence
        run: |
          sudo mkdir -p dist/source
          sudo cp .architecture-evidence/* dist/source/
          sudo chown -R "$USER":"$USER" dist

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: dvt-likec4-source-first-preview
          path: dist

      - name: Publish disposable gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
