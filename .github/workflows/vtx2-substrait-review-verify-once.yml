name: VTX2 Substrait review verification one-shot

on:
  push:
    branches:
      - agent/vtx2-substrait-card-pilot
    paths:
      - '.github/workflows/vtx2-substrait-review-verify-once.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pilot branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/vtx2-substrait-card-pilot
          fetch-depth: 0

      - name: Setup pnpm, cache and dependencies
        uses: ./.github/actions/setup-node-pnpm

      - name: Check changed-file format and lint
        run: node scripts/check-changed.cjs
        env:
          GIT_BASE: origin/main
          GIT_HEAD: HEAD

      - name: Build contracts
        run: pnpm --filter @dvt/contracts build

      - name: Build and type-check Web
        run: |
          pnpm --filter @dvt/web build
          pnpm --filter @dvt/web typecheck

      - name: Run Web lint
        run: pnpm --filter @dvt/web lint

      - name: Run Substrait pilot unit tests
        run: >-
          pnpm --filter @dvt/web exec vitest run
          --config vitest.unit.config.ts
          src/app/views/canvas/canvasDvtSubstraitPilot.test.ts
          src/app/views/canvas/canvasDvtSubstraitPilot.review.test.ts

      - name: Run Substrait pilot product-entry test
        run: >-
          pnpm --filter @dvt/web exec vitest run
          --config vitest.presentation.config.ts
          src/app/views/canvas/DvtSubstraitPilotEntry.test.tsx

      - name: Run executable CI governance contracts
        run: pnpm test:ci-tools:executable

      - name: Validate architecture dependency boundaries
        run: pnpm arch:deps

# Triggered once to validate the review fixes; delete after the run completes.
