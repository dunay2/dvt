name: issue-2803-canvas-tests-layout

on:
  push:
    branches:
      - issue-2803-canvas-tests-layout

permissions:
  contents: write

jobs:
  migrate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Move Canvas tests
        run: node scripts/issue-2803-move-canvas-tests.cjs

      - name: Verify Canvas suites
        env:
          CI: 'true'
        run: pnpm --filter @dvt/web test:canvas

      - name: Verify Web typecheck
        run: pnpm --filter @dvt/web typecheck

      - name: Verify Web lint
        run: pnpm --filter @dvt/web lint

      - name: Commit verified migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --stat
          git commit -m "chore(web): move Canvas tests into dedicated directory"
          git push origin HEAD:issue-2803-canvas-tests-layout
