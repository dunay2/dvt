name: LikeC4 source-first architecture preview

on:
  push:
    branches:
      - spike/likec4-source-first-20260903
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout spike
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch current main
        run: git fetch --no-tags origin main

      - name: Setup compatible Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Generate source-first topology
        run: node architecture/tools/generate-source-first.mjs

      - name: Generate source-evidenced runtime relations
        run: node architecture/tools/generate-runtime-relations.mjs

      - name: Stage isolated LikeC4 workspace
        run: |
          rm -rf .likec4-preview .architecture-evidence dist
          mkdir -p .likec4-preview .architecture-evidence
          cp architecture/specification.c4 .likec4-preview/specification.c4
          cp architecture/generated/*.c4 .likec4-preview/
          cat > .likec4-preview/likec4.config.json <<'JSON'
          {
            "$schema": "https://likec4.dev/schemas/config.json",
            "name": "dvt-source-first-spike",
            "title": "DVT+ — Source-first architecture"
          }
          JSON
          cp architecture/generated/*.json .architecture-evidence/
          cp architecture/generated/*.c4 .architecture-evidence/

      - name: Validate LikeC4 model
        run: |
          cd .likec4-preview
          npx --yes likec4@1.59.2 validate

      - name: Build LikeC4 static site
        run: npx --yes likec4@1.59.2 build --base ./ --output dist .likec4-preview

      - name: Publish machine-readable evidence and preview metrics
        run: |
          mkdir -p dist/source
          cp .architecture-evidence/* dist/source/
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const stat = (file) => fs.existsSync(file) ? fs.statSync(file).size : null;
          const walk = (dir) => fs.readdirSync(dir, { withFileTypes: true }).reduce((sum, entry) => {
            const target = path.join(dir, entry.name);
            return sum + (entry.isDirectory() ? walk(target) : fs.statSync(target).size);
          }, 0);
          const metrics = {
            schemaVersion: 2,
            generatedAt: new Date().toISOString(),
            totalDistBytes: walk('dist'),
            likec4ViewsBytes: stat('dist/likec4-views.js'),
            summaryBytes: stat('dist/source/summary.json'),
            sourceTopologyBytes: stat('dist/source/source-first.c4'),
            runtimeRelationsBytes: stat('dist/source/runtime-relations.c4'),
            runtimeEvidenceBytes: stat('dist/source/runtime-relations.json'),
          };
          fs.writeFileSync('dist/source/preview-metrics.json', JSON.stringify(metrics, null, 2) + '\n');
          console.log(metrics);
          NODE

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: dvt-likec4-source-first-preview
          path: dist

      - name: Publish disposable gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
