name: Release Candidate Integrity

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: release-candidate-integrity-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  begin_release_candidate_integrity:
    name: Begin release candidate integrity check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: write
    outputs:
      check-run-id: ${{ steps.publish.outputs.check-run-id }}
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup trusted Node runtime
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22.x

      - name: Publish in-progress check on pull-request head
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DETAILS_URL:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EXTERNAL_ID: ${{ github.run_id }}:${{ github.run_attempt }}
        shell: bash
        run: |
          check_run_id="$(node tools/ci/release-candidate-integrity/releaseCandidateCheckGithubAdapter.mjs begin \
            --repository "$GITHUB_REPOSITORY" --head "$HEAD_SHA" \
            --details-url "$DETAILS_URL" --external-id "$EXTERNAL_ID")"
          echo "check-run-id=${check_run_id}" >> "$GITHUB_OUTPUT"

  assess_release_candidate_integrity:
    name: Assess release candidate integrity
    needs: begin_release_candidate_integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Classify pull request authority
        id: authority
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$HEAD_REF" != release-please--branches--* ]]; then
            echo "release-candidate=false" >> "$GITHUB_OUTPUT"
            echo "Product pull request: exact release-candidate assessment is not applicable."
            exit 0
          fi
          if [[ "$BASE_REF" != "main" || "$HEAD_REPOSITORY" != "$REPOSITORY" ]]; then
            echo "Release candidate authority requires a same-repository PR targeting main." >&2
            exit 1
          fi
          echo "release-candidate=true" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted base
        if: steps.authority.outputs.release-candidate == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup trusted validation runtime
        if: steps.authority.outputs.release-candidate == 'true'
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22.x

      - name: Checkout untrusted candidate without credentials
        if: steps.authority.outputs.release-candidate == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: candidate

      - name: Inspect repository merge policy from trusted code
        if: steps.authority.outputs.release-candidate == 'true'
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          delimiter="release-policy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "json<<${delimiter}" >> "$GITHUB_OUTPUT"
          node tools/ci/release-candidate-integrity/releaseMergePolicyCli.mjs inspect \
            --repo "$GITHUB_REPOSITORY" --ruleset "protect main" >> "$GITHUB_OUTPUT"
          echo "${delimiter}" >> "$GITHUB_OUTPUT"

      - name: Assess exact candidate with trusted code
        if: steps.authority.outputs.release-candidate == 'true'
        working-directory: candidate
        env:
          RELEASE_REPOSITORY_POLICY_JSON: ${{ steps.policy.outputs.json }}
          RELEASE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RELEASE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node "$GITHUB_WORKSPACE/tools/ci/release-candidate-integrity/releaseCandidateIntegrityCli.mjs" \
            --base "$RELEASE_BASE_SHA" --head "$RELEASE_HEAD_SHA" \
            --repository "$GITHUB_REPOSITORY"

  complete_release_candidate_integrity:
    name: Complete release candidate integrity check
    if: ${{ always() }}
    needs:
      - begin_release_candidate_integrity
      - assess_release_candidate_integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup trusted Node runtime
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22.x

      - name: Publish final check outcome on pull-request head
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHECK_RUN_ID: ${{ needs.begin_release_candidate_integrity.outputs.check-run-id }}
          CHECK_CONCLUSION:
            ${{ needs.assess_release_candidate_integrity.result == 'success' && 'success' ||
            'failure' }}
        run: |
          node tools/ci/release-candidate-integrity/releaseCandidateCheckGithubAdapter.mjs complete \
            --repository "$GITHUB_REPOSITORY" --head "$HEAD_SHA" \
            --check-run-id "$CHECK_RUN_ID" --conclusion "$CHECK_CONCLUSION"

      - name: Enforce trusted assessment outcome
        if: ${{ needs.assess_release_candidate_integrity.result != 'success' }}
        run: exit 1
