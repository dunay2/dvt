name: Release Candidate Integrity

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: release-candidate-integrity-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify_release_candidate_authority:
    name: Classify release candidate authority
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      classification-json: ${{ steps.classify.outputs.json }}
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup trusted Node runtime
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22.x

      - name: Classify trusted pull-request metadata
        id: classify
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        shell: bash
        run: |
          classification="$(node tools/ci/release-candidate-integrity/releaseCandidateAuthorityCli.mjs \
            --base-ref "$BASE_REF" --head-ref "$HEAD_REF" \
            --base-repository "$BASE_REPOSITORY" --head-repository "$HEAD_REPOSITORY" \
            --head-sha "$HEAD_SHA" --merge-sha "$MERGE_SHA")"
          delimiter="release-authority-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "json<<${delimiter}" >> "$GITHUB_OUTPUT"
          echo "$classification" >> "$GITHUB_OUTPUT"
          echo "${delimiter}" >> "$GITHUB_OUTPUT"

  begin_release_candidate_integrity:
    name: Begin release candidate integrity check
    needs: classify_release_candidate_authority
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: write
    outputs:
      check-run-id: ${{ steps.publish.outputs.check-run-id }}
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup trusted Node runtime
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22.x

      - name: Publish in-progress check on authoritative revision
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_SHA:
            ${{
            fromJSON(needs.classify_release_candidate_authority.outputs.classification-json).publicationSha
            }}
          DETAILS_URL:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EXTERNAL_ID: ${{ github.run_id }}:${{ github.run_attempt }}
        shell: bash
        run: |
          check_run_id="$(node tools/ci/release-candidate-integrity/releaseCandidateCheckGithubAdapter.mjs begin \
            --repository "$GITHUB_REPOSITORY" --target "$PUBLICATION_SHA" \
            --details-url "$DETAILS_URL" --external-id "$EXTERNAL_ID")"
          echo "check-run-id=${check_run_id}" >> "$GITHUB_OUTPUT"

  assess_release_candidate_integrity:
    name: Assess release candidate integrity
    if:
      ${{
      fromJSON(needs.classify_release_candidate_authority.outputs.classification-json).assessmentDisposition
      != 'not_applicable' }}
    needs:
      - classify_release_candidate_authority
      - begin_release_candidate_integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Reject invalid release-candidate authority
        if:
          ${{
          fromJSON(needs.classify_release_candidate_authority.outputs.classification-json).assessmentDisposition
          == 'rejected' }}
        env:
          REJECTION_CODE:
            ${{
            fromJSON(needs.classify_release_candidate_authority.outputs.classification-json).rejectionCode
            }}
        run: |
          echo "Release candidate authority rejected: ${REJECTION_CODE}" >&2
          exit 1

      - name: Checkout trusted base
        if:
          ${{
          fromJSON(needs.classify_release_candidate_authority.outputs.classification-json).assessmentDisposition
          == 'required' }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup trusted validation runtime
        if:
          ${{
          fromJSON(needs.classify_release_candidate_authority.outputs.classification-json).assessmentDisposition
          == 'required' }}
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22.x

      - name: Checkout untrusted candidate without credentials
        if:
          ${{
          fromJSON(needs.classify_release_candidate_authority.outputs.classification-json).assessmentDisposition
          == 'required' }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: candidate

      - name: Inspect repository merge policy from trusted code
        if:
          ${{
          fromJSON(needs.classify_release_candidate_authority.outputs.classification-json).assessmentDisposition
          == 'required' }}
        id: policy
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GOVERNANCE_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || {
            echo "RELEASE_GOVERNANCE_TOKEN is required for complete policy visibility." >&2
            exit 1
          }
          delimiter="release-policy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "json<<${delimiter}" >> "$GITHUB_OUTPUT"
          node tools/ci/release-candidate-integrity/releaseMergePolicyCli.mjs inspect \
            --repo "$GITHUB_REPOSITORY" --ruleset "protect main" >> "$GITHUB_OUTPUT"
          echo "${delimiter}" >> "$GITHUB_OUTPUT"

      - name: Assess exact candidate with trusted code
        if:
          ${{
          fromJSON(needs.classify_release_candidate_authority.outputs.classification-json).assessmentDisposition
          == 'required' }}
        working-directory: candidate
        env:
          RELEASE_REPOSITORY_POLICY_JSON: ${{ toJSON(fromJSON(steps.policy.outputs.json).policy) }}
          RELEASE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RELEASE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node "$GITHUB_WORKSPACE/tools/ci/release-candidate-integrity/releaseCandidateIntegrityCli.mjs" \
            --base "$RELEASE_BASE_SHA" --head "$RELEASE_HEAD_SHA" \
            --repository "$GITHUB_REPOSITORY"

  complete_release_candidate_integrity:
    name: Complete release candidate integrity check
    if: ${{ always() }}
    needs:
      - classify_release_candidate_authority
      - begin_release_candidate_integrity
      - assess_release_candidate_integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup trusted Node runtime
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22.x

      - name: Publish final check outcome on authoritative revision
        if:
          ${{ needs.classify_release_candidate_authority.result == 'success' &&
          needs.begin_release_candidate_integrity.result == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_SHA:
            ${{
            fromJSON(needs.classify_release_candidate_authority.outputs.classification-json).publicationSha
            }}
          CHECK_RUN_ID: ${{ needs.begin_release_candidate_integrity.outputs.check-run-id }}
          CHECK_CONCLUSION:
            ${{
            (fromJSON(needs.classify_release_candidate_authority.outputs.classification-json).assessmentDisposition
            == 'not_applicable' || needs.assess_release_candidate_integrity.result == 'success') &&
            'success' || 'failure' }}
        run: |
          node tools/ci/release-candidate-integrity/releaseCandidateCheckGithubAdapter.mjs complete \
            --repository "$GITHUB_REPOSITORY" --target "$PUBLICATION_SHA" \
            --check-run-id "$CHECK_RUN_ID" --conclusion "$CHECK_CONCLUSION"

      - name: Enforce trusted authority and publication outcome
        if:
          ${{ needs.classify_release_candidate_authority.result != 'success' ||
          needs.begin_release_candidate_integrity.result != 'success' }}
        run: exit 1

      - name: Enforce required trusted assessment outcome
        if:
          ${{ needs.classify_release_candidate_authority.result == 'success' &&
          needs.begin_release_candidate_integrity.result == 'success' &&
          fromJSON(needs.classify_release_candidate_authority.outputs.classification-json).assessmentDisposition
          != 'not_applicable' && needs.assess_release_candidate_integrity.result != 'success' }}
        run: exit 1
