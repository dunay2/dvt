name: Build and deploy docs (Zensical)

on:
  workflow_dispatch:
    inputs:
      run_pages_deploy:
        description: 'Deploy site to gh-pages branch'
        required: false
        type: boolean
        default: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm, cache and dependencies
        uses: ./.github/actions/setup-node-pnpm

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
          cache: 'pip'
          cache-dependency-path: .github/requirements/zensical.lock

      - name: Install Zensical
        run:
          python -m pip install --disable-pip-version-check --require-hashes -r
          .github/requirements/zensical.lock

      - name: Generate DB-first publication projection
        run: pnpm docs:publish

      - name: Build site
        run: pnpm docs:build

      - name: Deploy to GitHub Pages
        if: ${{ github.event.inputs.run_pages_deploy == 'true' }}
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
