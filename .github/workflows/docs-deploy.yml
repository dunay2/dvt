name: Build and deploy docs (Zensical)

on:
  workflow_dispatch:
    inputs:
      run_pages_deploy:
        description: 'Deploy site to gh-pages branch'
        required: false
        type: boolean
        default: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm, cache and dependencies
        uses: ./.github/actions/setup-node-pnpm

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Install Zensical
        run: |
          python -m pip install --upgrade pip
          python -m pip install zensical==0.0.39

      - name: Build site
        run: pnpm docs:build

      - name: Deploy to GitHub Pages
        if: ${{ github.event.inputs.run_pages_deploy == 'true' }}
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
