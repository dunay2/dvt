version: '3.9'

# DVT+ local infra — Postgres (RDS substitute)
# Usage: docker compose -f infra/rds/local-compose.yaml up -d
# Stop:  docker compose -f infra/rds/local-compose.yaml down -v

services:
  postgres:
    image: postgres:16-alpine
    container_name: dvt-postgres
    environment:
      POSTGRES_USER: dvt
      POSTGRES_PASSWORD: dvt_local
      POSTGRES_DB: dvt_runs
    ports:
      - '5432:5432'
    volumes:
      - dvt_pg_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d # place SQL init scripts here
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dvt -d dvt_runs']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dvt_pg_data:
